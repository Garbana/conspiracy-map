k:"Karus esą finansuoja tie patys namai iš abiejų pusių, nes svarbu ne kas laimės, o skola.",
lore:"Tarptautinė bankininkystė istoriškai tikrai veikė per sienas, o atskirų atvejų su paskolomis abiem pusėms būta. Iš to daroma visuotinė taisyklė su iš anksto suplanuotu rezultatu.",
f:"Kartojama Rotšildų frazė apie tai, kad pirkti reikia, kai gatvėse kraujas — ji greičiausiai apokrifinė. Ši linija yra tiesioginis XIX a. antisemitinio modulio tęsinys, tik dažniausiai be pavardžių."},

{id:"th_ekonominis_smogikas",l:"Ekonominiai smogikai",t:"teorija",y:2004,st:"ginčytina",
k:"Šalys esą sąmoningai įklampinamos į neįveikiamas paskolas, kad taptų priklausomos.",
lore:"Knygos autorius pasakoja savo patirtį konsultacijų versle. Detalės nepatikrinamos, tačiau bendra kritika dėl paskolų sąlygų ir jų politinių pasekmių sutampa su rimta akademine literatūra.",
f:"Kartojama, kad pirma siūlo paskolą, paskui bazę. Ši knyga daugeliui buvo pirmoji, po kurios ekonomika ėmė atrodyti kaip ginklas. Skirtingai nuo daugelio mazgų, jos kritika iš dalies sutampa su tuo, ką rašo ir visai nekonspiraciniai tyrėjai."},

{id:"th_hiperinfliacija",l:"Didysis nurašymas",t:"teorija",y:2020,st:"nepatikrinama",
k:"Sistemą esą planuojama sugriauti kontroliuojamai, kad būtų galima nurašyti skolas ir įvesti naują tvarką.",
lore:"Skolų lygis daugelyje šalių tikrai istoriškai aukštas, o diskusijos apie pertvarkymą vyksta. Teorija prideda grafiką ir tikslą.",
f:"Kartojama, kad krizė bus ne nelaimė, o įrankis, ir kad tie, kas žino datą, jau pasiruošę. Šis mazgas yra finansinė Didžiojo perkrovimo versija ir dažniausiai keliauja kartu su auksu bei kriptovaliutomis."},

{id:"th_deagel",l:"Deagelio prognozė",t:"teorija",y:2020,st:"paneigta",
k:"Nežinomos paskirties svetainėje esą buvo paskelbta prognozė apie dramatišką Vakarų šalių gyventojų mažėjimą.",
lore:"Nedidelė karinės analitikos svetainė skelbė lenteles su 2025 m. rodikliais, kurių metodika niekada nebuvo paaiškinta. Po išplitimo skiltis buvo pašalinta, o autoriai paaiškino, kad tai buvo scenarijaus modeliavimas.",
f:"Kartojama, kad prognozė buvo nuimta būtent todėl, kad per daug tiksliai atspindėjo planą. Skaičiai iki šiol cirkuliuoja ekrano nuotraukose be jokio konteksto. Tai gryniausias pavyzdys, kaip nežinoma lentelė tampa dokumentu."},

{id:"th_bitkoinas_psyop",l:"Kas sukūrė bitkoiną",t:"teorija",y:2013,st:"nepatikrinama",
k:"Kriptovaliutą esą sukūrė žvalgyba, kad išbandytų ir vėliau perimtų skaitmeninius pinigus.",
lore:"Kūrėjo tapatybė iki šiol nežinoma, o kandidatų sąrašas ilgas. Kaip įrodymas nurodomas 1996 m. paskelbtas valstybinės agentūros tyrimas apie anoniminius elektroninius pinigus ir naudojami kriptografijos standartai.",
f:"Bendruomenė dėl to skyla į dvi dalis. Vieni sako, kad anonimiškumas įrodo grynas ketinimas, kiti — kad būtent tokia legenda ir kuriama. Kartojama, kad tikrasis tikslas buvo priversti žmones patiems pereiti prie skaitmeninių pinigų, o paskui pakeisti taisykles."},

// ================= ASMENYS =================
{id:"p_satoshi",l:"Satoši Nakamoto",t:"asmuo",y:2008,st:"ginčytina",
k:"Bitkoino kūrėjo slapyvardis, kurio tapatybė iki šiol nenustatyta.",
lore:"2008 m. paskelbė techninį aprašą, dalyvavo kūrime porą metų ir dingo, palikdamas nejudinamą didelį monetų kiekį. Kelis kartus buvo įvardyti kandidatai, nė vienas neįrodytas.",
f:"Tai vienintelis atlaso asmuo, kurio pagrindinė savybė yra nebuvimas. Kartojama, kad monetos nepajudintos, nes jų savininkui pinigai nereikalingi. Kiekvienas naujas įvardijimas sukelia bangą ir baigiasi niekuo."},

{id:"p_perkins",l:"Džonas Perkinsas",t:"asmuo",y:2004,st:"realus",
k:"Autorius, aprašęs savo darbą tarptautinių paskolų versle kaip sąmoningą įklampinimo sistemą.",
lore:"Knyga tapo tarptautiniu bestseleriu. Dalis jo asmeninių teiginių nepatvirtinta, tačiau bendra kritika dėl paskolų politinių pasekmių sutampa su akademiniais tyrimais.",
f:"Vertinamas kaip vienintelis, kuris papasakojo iš vidaus. Kartojama, kad jam leido kalbėti, nes jis pasakė tik dalį."},

{id:"p_griffin",l:"Edvardas Grifinas",t:"asmuo",y:1994,st:"realus",
k:"Autorius, kurio knyga apie centrinį banką tapo pagrindiniu tekstu šioje temoje.",
lore:"Knygoje pasakojama apie 1910 m. slaptą susitikimą saloje ir iš to išvedama visa sistemos kritika. Susitikimas realiai vyko, o interpretacija toli peržengia dokumentus.",
f:"Vadinamas žmogumi, kuris pirmas paaiškino, kaip veikia pinigai. Jo knyga yra dažniausia rekomendacija pradedantiesiems visoje finansinėje šakoje."},

{id:"p_madoff",l:"Bernardas Madofas",t:"asmuo",y:2008,st:"realus",
k:"Finansininkas, dešimtmečius vykdęs didžiausią žinomą piramidinę schemą.",
lore:"Buvo gerbiamas rinkos dalyvis ir biržos vadovas. Schema griuvo tik tada, kai per krizę klientai vienu metu paprašė pinigų.",
f:"Cituojamas kaip įrodymas, kad reputacija yra geriausia priedanga. Kartojama, kad jis buvo tik tas, kurį parodė, o kiti tiesiog nesugriuvo."},

// ================= GRUPĖS IR TEKSTAI =================
{id:"g_bis",l:"Tarptautinių atsiskaitymų bankas",t:"grupe",y:1930,st:"reali",
k:"Centrinių bankų bankas Bazelyje, koordinuojantis jų bendradarbiavimą.",
lore:"Įsteigtas 1930 m., turi tarptautinio subjekto statusą ir imunitetus, o jo susitikimai yra uždari. Jo rekomendacijos veikia bankų reguliavimą visame pasaulyje.",
f:"Vadinamas tikruoju pasaulio banku, apie kurį niekas nekalba. Kartojama, kad jam negalioja šalies, kurioje jis stovi, įstatymai — ir tai iš esmės tiesa. Šis mazgas yra finansinis Bilderbergo atitikmuo."},

{id:"g_blackrock",l:"Didieji turto valdytojai",t:"grupe",y:1988,st:"reali",
k:"Kelios bendrovės, valdančios dešimtis trilijonų klientų turto ir turinčios balsavimo teises tūkstančiuose įmonių.",
lore:"Jos veikia kaip tarpininkai, o ne savininkai, tačiau balsų koncentracija yra reali ir akademiškai svarstoma problema. Viena jų taip pat konsultavo centrinius bankus krizių metu.",
f:"Kartojama, kad jie valdo viską, įskaitant vieni kitus. Konsultavimo sutartys su centriniais bankais laikomos įrodymu, kad riba tarp valstybės ir fondo išnyko."},

{id:"g_tvf",l:"Tarptautinis valiutos fondas",t:"grupe",y:1944,st:"reali",
k:"Institucija, teikianti paskolas valstybėms su sąlygomis dėl jų ekonominės politikos.",
lore:"Sąlygos istoriškai apėmė išlaidų mažinimą ir privatizaciją, o jų poveikis kai kuriose šalyse buvo skaudus ir kritikuojamas net vidinėse vertinimo ataskaitose.",
f:"Kartojama, kad tai ne bankas, o politikos keitimo įrankis. Šiuo atveju kritika iš dalies sutampa su oficialiais vertinimais, ir būtent tai daro mazgą stiprų."},

{id:"t_jekyll",l:"Padaras iš Džekilo salos",t:"tekstas",y:1994,st:"pirminis",
k:"Knyga apie centrinio banko įkūrimą kaip slaptą bankininkų susitarimą.",
lore:"Remiasi realiu 1910 m. susitikimu, kuriame dalyviai keliavo su slapyvardžiais. Iš tikros paslapties išvedama visa sistemos teorija.",
f:"Tai pagrindinis įėjimo tekstas visoje finansinėje šakoje ir dažniausiai dovanojama knyga tarp besidominčiųjų. Kartojama, kad ją perskaičius nebegali žiūrėti į pinigus kaip anksčiau."},

{id:"t_satoshi",l:"Bitkoino aprašas",t:"tekstas",y:2008,st:"pirminis",
k:"Devynių puslapių dokumentas, aprašęs atsiskaitymų sistemą be tarpininko.",
lore:"Paskelbtas praėjus kelioms savaitėms po banko žlugimo, kriptografų el. pašto sąraše. Pirmame bloke įrašyta tos dienos laikraščio antraštė apie bankų gelbėjimą.",
f:"Ta antraštė pirmame bloke laikoma manifestu ir cituojama nuolat. Kartojama, kad sistema gimė būtent kaip atsakas į gelbėjimą viešomis lėšomis — ir tai vienas iš nedaugelio atvejų, kai laiko sutapimas tikrai reiškia ką pasakė."}

lore:"Kongreso tyrimai patvirtino finansavimą opozicijai, spaudai ir ankstesnį nepavykusį bandymą. Ar JAV tiesiogiai dalyvavo pačiame perversme, iki šiol ginčijamasi, tačiau ilgametė programa yra dokumentuota.",
f:"Kartojama frazė apie tai, kad nematyti priežasties leisti šaliai tapti komunistine dėl jos pačios gyventojų neatsakingumo — ji tikra ir cituojama iš išslaptintų dokumentų. Data taip pat pastebima: rugsėjo vienuoliktoji."},

{id:"e_condor",l:"Operacija Kondoras",t:"faktas",y:1975,st:"faktas",
k:"Šešios Pietų Amerikos diktatūros veikė kartu, sekdamos, grobdamos ir žudydamos oponentus vienos kitų teritorijose.",
lore:"Programos dokumentai rasti 1992 m. Paragvajaus archyve, vadinamame Teroro archyvu. Aukų skaičiuojama dešimtys tūkstančių, o bylos tebenagrinėjamos.",
f:"Tai bene aiškiausias pasaulyje įrodymas, kad valstybės gali metų metus koordinuoti slaptą programą per sienas ir tai išlaikyti paslaptyje. Kartojama, kad ją atskleidė ne tyrimas, o atsitiktinai rastas archyvas."},

{id:"e_gvatemala_sifilis",l:"Gvatemalos tyrimai",t:"faktas",y:1946,st:"faktas",
k:"1946–1948 m. JAV finansuoti tyrėjai Gvatemaloje sąmoningai užkrėtė daugiau nei tūkstantį žmonių lytiškai plintančiomis ligomis.",
lore:"Aukos buvo kaliniai, kareiviai ir psichiatrijos ligoninių pacientai, nežinoję, kas su jais daroma. Programa buvo atskleista tik 2010 m., JAV oficialiai atsiprašė.",
f:"Cituojama kartu su Taskygio byla kaip įrodymas, kad tai nebuvo vienetinis atvejis. Kartojama, kad apie tai sužinojome po šešiasdešimt metų, ir klausiama, ko dar nežinome apie dabartį."},

{id:"e_dark_alliance",l:"Kokaino ir sukilėlių byla",t:"faktas",y:1996,st:"ginčytina",
k:"Žurnalisto tyrimas susiejo kokaino prekybą JAV su Nikaragvos sukilėlių finansavimu.",
lore:"Publikacija buvo aštriai kritikuojama dėl perdėtų teiginių, tačiau vėlesnė žvalgybos vidaus ataskaita pripažino, kad kai kurie su sukilėliais susiję prekeiviai nebuvo tiriami. Autorius neteko darbo ir 2004 m. mirė; mirtis kvalifikuota kaip savižudybė.",
f:"Kartojama, kad jį sunaikino už tiesą, o dvi kulkos laikomos įrodymu. Tai vienas iš mazgų, kur perdėjimas ir pagrįstas branduolys taip susipynę, kad abi pusės gali cituoti tuos pačius dokumentus."},

// ================= LOTYNŲ AMERIKA: TEORIJOS =================
{id:"th_bananu",l:"Bananų respublikos",t:"teorija",y:1954,st:"ginčytina",
k:"Regiono valstybės esą buvo ir tebėra valdomos korporacijų per perversmus ir paskolas.",
lore:"Istorinis branduolys tvirtas — konkrečios bendrovės tikrai turėjo lemiamą įtaką kelių šalių politikai ir lobizavo intervencijas. Šiuolaikinė versija tai perkelia į dabartį be tokių pat įrodymų.",
f:"Kartojama, kad pasikeitė tik prekės pavadinimas — vietoj bananų dabar litis ir varis. Šis mazgas regione veikia kaip pamatinis pasaulėvaizdis, o ne kaip atskira teorija."},

{id:"th_narko_cia",l:"Žvalgyba ir narkotikai",t:"teorija",y:1986,st:"nepatikrinama",
k:"Žvalgybos tarnybos esą sąmoningai naudojo narkotikų prekybą slaptoms operacijoms finansuoti.",
lore:"Kongreso komiteto ataskaita 1989 m. nustatė, kad su sukilėliais susiję asmenys dalyvavo prekyboje ir kad administracija tai žinojo. Teiginys apie sąmoningą programą platesnis nei tai, kas įrodyta.",
f:"Kartojama, kad epidemija miestuose buvo ne nelaimė, o šalutinis produktas, kurio niekas nesustabdė. Ši linija JAV bendruomenėse turi ypatingą svorį, nes kalba apie konkrečias apylinkes ir kartas."},

{id:"th_chupacabra",l:"Čupakabra",t:"teorija",y:1995,st:"paneigta",
k:"Puerto Rike ir vėliau visame regione esą siautėja padaras, išsiurbiantis gyvulių kraują.",
lore:"Pirmoji liudytoja 1995 m. aprašė būtybę, kurios išvaizda beveik sutapo su prieš kelias savaites rodyto fantastinio filmo personažu. Vėliau rasti egzemplioriai pasirodė esą niežų nualinti šunys ir kojotai.",
f:"Pasakojimas greitai apaugo vyriausybės eksperimento versija: esą tai pabėgęs genetinis bandinys iš karinės bazės. Tai regioninis gyvulių žalojimo temos atitikmuo ir vienas švariausių pavyzdžių, kaip filmo vaizdinys per savaites tampa liudijimu."},

{id:"th_varginha",l:"Varginjos atvejis",t:"teorija",y:1996,st:"nepatikrinama",
k:"1996 m. Brazilijos mieste esą buvo sugauta gyva nežemiška būtybė, o įvykį uždengė kariuomenė.",
lore:"Trys merginos pranešė mačiusios keistą padarą, tuo pat metu mieste vyko karinės transporto operacijos. Oficialaus patvirtinimo nėra, liudijimai prieštaringi.",
f:"Vadinamas Brazilijos Rosvelu, miestas net pastatė NSO formos vandens bokštą. Kartojama, kad būtybė mirė ligoninėje, o vienas dalyvavęs policininkas netrukus mirė neaiškiomis aplinkybėmis."},

{id:"th_nazca_mumijos",l:"Naskos mumijos",t:"teorija",y:2023,st:"paneigta",
k:"2023 m. Meksikos Kongrese pristatyti trijų pirštų kūnai esą yra nežemiškos būtybės.",
lore:"Peru institucijos ir tyrėjai nustatė, kad tai iš žmogaus ir gyvūnų kaulų sukonstruoti dirbiniai, kai kurie su klijais. Panašūs radiniai buvo pristatinėjami ir anksčiau.",
f:"Tai naujausias didelis atvejis ir jis parodė mechaniką realiu laiku: parlamento salė suteikė pasakojimui rimtumo, kurio pats turinys neturėjo. Kartojama, kad buvo prisiekta, vadinasi, rimta — nors prisiekta buvo tik dėl pateikimo tvarkos."},

// ================= AZIJA: FAKTAI =================
{id:"e_731",l:"731 dalinys",t:"faktas",y:1936,st:"faktas",
k:"Japonijos kariuomenės padalinys Kinijoje vykdė biologinio ginklo tyrimus su gyvais žmonėmis.",
lore:"Aukos buvo užkrečiamos, operuojamos be nuskausminimo, naudojamos šalčio ir slėgio bandymams. Po karo dalis vadovybės gavo imunitetą mainais už tyrimų duomenis, ir tai patvirtinta dokumentais.",
f:"Šis mazgas naudojamas visame regione kaip įrodymas, kad valstybės perka nusikaltėlių duomenis ir dangsto juos. Kartojama, kad jei tai buvo padaryta ir nutylėta dešimtmečius, tai bet kas įmanoma."},

{id:"e_aum",l:"Aum Shinrikyo ataka",t:"faktas",y:1995,st:"faktas",
k:"1995 m. religinė sekta Tokijo metro paleido nervus paralyžiuojančių dujų, žuvo keliolika žmonių, nukentėjo tūkstančiai.",
lore:"Sekta turėjo savo laboratorijas, mokslininkų ir gamino cheminį ginklą. Ji laukė pasaulio pabaigos ir nusprendė ją paspartinti. Vadovas buvo nuteistas ir 2018 m. įvykdyta mirties bausmė.",
f:"Tai svarbiausias pasaulyje pavyzdys, ką gali apokaliptinė bendruomenė su resursais ir išsilavinusiais nariais. Kartojama, kad niekas nepatikėjo, kol neįvyko. Šis mazgas atlase yra riba, kur pasakojimas apie pabaigą tampa veiksmu."},

{id:"e_tiananmen",l:"1989 m. cenzūra",t:"faktas",y:1989,st:"faktas",
k:"Po 1989 m. įvykių Kinijoje buvo sukurta viena nuosekliausių pasaulyje informacijos filtravimo sistemų.",
lore:"Data ir su ja susiję vaizdai iki šiol sistemingai šalinami iš vietinio interneto, įskaitant užuominas ir skaičių derinius. Sistema tobulinama nuolat.",
f:"Cituojama kaip įrodymas, kad ištrinti įvykį iš atminties techniškai įmanoma, jei valdai infrastruktūrą. Kartojama, kad Vakaruose tas pats daroma švelnesniais būdais."},

// ================= AZIJA: TEORIJOS =================
{id:"th_falun",l:"Organų paėmimo kaltinimai",t:"teorija",y:2006,st:"ginčytina",
k:"Kinijoje esą sistemingai imami organai iš kalinamų sąžinės kalinių.",
lore:"Kaltinimus kelia persekiojamas judėjimas ir jo aplinkos organizacijos. Nepriklausomas tarptautinis tribunolas 2019 m. padarė išvadą, kad prievartinis organų ėmimas vyko; kiti tyrėjai nurodo įrodymų metodologijos problemas. Klausimas lieka rimtas ir neišspręstas.",
f:"Šis mazgas ypatingas tuo, kad jį kelia realiai persekiojama grupė, o kartu jos medijos platina ir daugybę kitų, jau visiškai nepagrįstų teiginių. Kartojama, kad todėl netikima ir tuo, kas gali būti tiesa — tai grynas atvejis, kai perdėjimas kenkia pačiam kaltinimui."},

{id:"th_kinijos_planas",l:"Šimtmečio planas",t:"teorija",y:1999,st:"nepatikrinama",
k:"Kinija esą vykdo šimtmečiais skaičiuojamą strategiją perimti pasaulinę galią be tiesioginio karo.",
lore:"Dažnai cituojama dviejų karininkų 1999 m. knyga apie karą be apribojimų, kuri Vakaruose skaitoma kaip planas, nors buvo analitinis svarstymas. Ilgalaikis strateginis planavimas realus, tačiau vieningo dokumento su grafiku nėra.",
f:"Kartojama, kad jie mąsto šimtmečiais, o mes rinkimų ciklais. Ši linija populiari ir tarp rimtų analitikų, ir tarp konspiracinių autorių, tik pirmieji kalba apie tendencijas, o antrieji — apie scenarijų su datomis."},

{id:"th_kinijos_kolonizacija",l:"Skolų spąstai",t:"teorija",y:2017,st:"ginčytina",
k:"Infrastruktūros paskolos esą sąmoningai duodamos tam, kad negrąžinusios šalys atiduotų uostus ir išteklius.",
lore:"Vienas dažnai minimas uosto perdavimo atvejis realus, tačiau tyrimai rodo, kad daugeliu atvejų skolos buvo restruktūrizuojamos, o ne konfiskuojamas turtas. Terminas paplito greičiau nei duomenys.",
f:"Kartojama, kad tai tas pats, ką anksčiau darė Vakarų institucijos, tik su kitu akcentu. Šis mazgas įdomus tuo, kad jį naudoja tie patys žmonės, kurie kitame kontekste kalba apie ekonominius smogikus — tik kaltinamasis kitas."},

{id:"th_vimanos",l:"Vedinės skraidyklės",t:"teorija",y:1952,st:"paneigta",
k:"Senovės Indijos tekstai esą aprašo skraidančius aparatus ir ginklus, kurių technologija prarasta.",
lore:"Pagrindinis šaltinis yra XX a. pradžioje mediumo užrašytas ir 1952 m. paskelbtas tekstas, pateiktas kaip senovinis. 1974 m. inžinierių analizė nustatė, kad aprašyti aparatai skristi negalėtų.",
f:"Kartojama, kad epuose aprašyti ginklai primena branduolinį sprogimą, ir rodomos suklijuotos citatos. Ši linija yra indiškas senovės astronautų atitikmuo ir dažnai naudojama nacionalinio pranašumo argumentams."},

{id:"th_hindutva",l:"Istorijos perrašymas Indijoje",t:"teorija",y:1990,st:"ginčytina",
k:"Teiginys, kad indoeuropiečių atėjimo nebuvo, o civilizacija kilo vietoje ir yra daug senesnė.",
lore:"Senoji migracijos teorija buvo pataisyta, tačiau genetiniai ir kalbiniai tyrimai patvirtina judėjimą iš stepių. Atmetimas dažniausiai motyvuojamas politiškai, o ne duomenimis.",
f:"Kartojama, kad migracijos teoriją sugalvojo kolonizatoriai, kad pateisintų valdymą — istorinė šio teiginio dalis teisinga, išvada ne. Struktūriškai tai tikslus baltų ir slavų proistorės mitų atitikmuo, tik daug didesnio masto."},

{id:"p_allende",l:"Salvadoras Aljendė",t:"asmuo",y:1973,st:"realus",
k:"Čilės prezidentas, žuvęs per 1973 m. perversmą.",
lore:"Išrinktas 1970 m., vykdė nacionalizavimo programą. Žuvo prezidentūroje puolimo metu; 2011 m. ekshumacija patvirtino savižudybę.",
f:"Ekshumacijos išvada priimama nevienodai — kartojama, kad apsuptas žmogus nesirenka. Jo figūra regione veikia kaip įrodymas, kad rinkimų rezultatas galioja tik iki tam tikros ribos."},

{id:"p_webb",l:"Geris Vebas",t:"asmuo",y:1996,st:"realus",
k:"Žurnalistas, susiejęs kokaino prekybą su slaptų operacijų finansavimu.",
lore:"Po publikacijų buvo kritikuojamas didžiųjų laikraščių, perkeltas į kitas pareigas ir paliko profesiją. Vėlesnė vidaus ataskaita iš dalies patvirtino jo temą, nors ne visus teiginius.",
f:"Kartojama, kad jį sugriovė kolegos, o ne priešai. Jo mirtis su dviem šūviais laikoma neginčijamu įrodymu, nors teismo medikai tai paaiškino. Tai vienas stipriausių kankinio pasakojimų šiuolaikinėje žurnalistikoje."},

{id:"p_maussan",l:"Chaimė Mausanas",t:"asmuo",y:2023,st:"realus",
k:"Meksikos žurnalistas, pristatęs vadinamąsias nežemiškas mumijas parlamentui.",
lore:"Dešimtmečius rengia laidas NSO tema, ne kartą pristatė radinius, kurie vėliau pasirodė esą klastotės. 2023 m. pristatymas Kongrese sulaukė pasaulinio dėmesio.",
f:"Sekėjams jis žmogus, kuris pagaliau įnešė temą į parlamentą. Kritikams — pavyzdys, kaip vienas žmogus gali gauti valstybinę tribūną be jokios ekspertizės."},

{id:"p_asahara",l:"Šoko Asahara",t:"asmuo",y:1995,st:"realus",
k:"Sektos, surengusios cheminę ataką Tokijo metro, vadovas.",
lore:"Skelbėsi apsišvietusiu, jungė budizmo, jogos ir apokaliptinių krikščioniškų elementų mišinį. Sekta verbavo elitinių universitetų absolventus, kurie ir gamino ginklą.",
f:"Jo atvejis atlase svarbus tuo, kad rodo: pavojinga ne pati doktrina, o jos derinys su kompetencija ir pinigais. Kartojama, kad valdžia sektą ignoravo metų metus, nors signalų būta."},

{id:"p_savarkaras",l:"Vinajakas Savarkaras",t:"asmuo",y:1923,st:"realus",
k:"Autorius, suformulavęs tautinės tapatybės sampratą, tapusią šiuolaikinio Indijos nacionalizmo pagrindu.",
lore:"1923 m. tekste apibrėžė priklausymą per gimtinę ir šventąją žemę, taip išskirdamas dalį gyventojų. Jo idėjos formuoja ir istorijos aiškinimą.",
f:"Cituojamas kaip žmogus, kuris grąžino savastį po kolonijinio ištrynimo. Iš jo tekstų kyla ir istorijos perrašymo programa, kurioje senovė turi būti sava ir seniausia."},

{id:"b_chupakabra",l:"Čupakabra",t:"butybe",y:1995,st:"mitinis",

{id:"g_aum",l:"Aum Shinrikyo",t:"grupe",y:1984,st:"reali",

lore:"Turėjo dešimtis tūkstančių narių, nuosavybės ir laboratorijų. Po 1995 m. atakos organizacija buvo išardyta, bet įpėdinės grupės tebeveikia stebimos.",

{id:"t_unrestricted",l:"Karas be apribojimų",t:"tekstas",y:1999,st:"pirminis",

{id:"e_waco",l:"Veiko apgultis",t:"faktas",y:1993,st:"faktas",

lore:"Operacija prasidėjo nuo ginklų patikrinimo ir baigėsi šturmu bei gaisru, kurio priežastys ginčytos metų metus. Vėlesni tyrimai kritikavo sprendimų priėmimą, o dalis kaltinimų valdžiai nepasitvirtino.",

{id:"e_oklahoma",l:"Oklahomos sprogdinimas",t:"faktas",y:1995,st:"faktas",
k:"1995 m. balandžio 19 d. susprogdinus federalinį pastatą žuvo 168 žmonės, tarp jų devyniolika vaikų.",
lore:"Data sutapo su Veiko apgulties pabaigos metinėmis. Vykdytojas priklausė milicijų aplinkai ir vežiojosi ištraukas iš 1978 m. romano, kuriame aprašomas panašus veiksmas. Tai buvo didžiausias vidaus terorizmo aktas JAV istorijoje iki tol.",
f:"Šis mazgas atlase yra riba: iki jo kalbėta apie tironiją abstrakčiai, po jo tapo aišku, kur veda konkretus tekstas. Dalis aplinkos iškart paskelbė, kad tai buvo vyriausybės provokacija — tas pats šablonas, kuris vėliau naudotas po kiekvieno panašaus įvykio."},

{id:"e_utoja",l:"2011 m. Norvegijos išpuolis",t:"faktas",y:2011,st:"faktas",

lore:"Vykdytojas prieš išpuolį paskleidė ilgą tekstą, kuriame rėmėsi Eurabijos ir pakeitimo naratyvais. Byla tapo lūžiu, kaip Europoje vertinamas vienišo vykdytojo pavojus.",
f:"Šis atvejis parodė, kad grandinė veikia ir be organizacijos: žmogus metus rengėsi vienas, remdamasis viešai prieinamais tekstais. Norvegijos žiniasklaida sąmoningai apribojo vardo vartojimą, ir tai tapo pavyzdžiu kitiems."},

{id:"e_christchurch",l:"2019 m. Kraistčerčo išpuolis",t:"faktas",y:2019,st:"faktas",

lore:"Vykdytojas rėmėsi pakeitimo naratyvu ir tiesiogiai nurodė ankstesnius atvejus. Tiesioginė transliacija ir jos plitimas privertė valstybes ir platformas keisti taisykles; buvo priimtas tarptautinis įsipareigojimas dėl tokio turinio šalinimo.",
f:"Būtent po šio atvejo grandinė tapo akivaizdi visiems: tekstas nurodė pirmtakus ir kreipėsi į sekėjus. Naujosios Zelandijos vadovybė viešai atsisakė minėti vardą, ir šis sprendimas plačiai cituojamas kaip teisingas atsakas."},

{id:"e_bufalas",l:"2022 m. Bafalo išpuolis",t:"faktas",y:2022,st:"faktas",

lore:"Dokumentas prieš išpuolį kartojo ankstesnių atvejų struktūrą ir tiesiogiai rėmėsi ta pačia sąvoka. Valstijos generalinės prokurorės ataskaita nagrinėjo platformų vaidmenį radikalizacijoje.",
f:"Šis atvejis dažniausiai cituojamas ginče dėl to, ar naratyvas turi pasekmių. Kartojama, kad tai vienetinis pamišėlis, tačiau tekstas nurodo tuos pačius šaltinius kaip ankstesni — būtent tai ir yra grandinės įrodymas."},

{id:"e_kapitolijus",l:"2021 m. Kapitolijaus šturmas",t:"faktas",y:2021,st:"faktas",
k:"2021 m. sausio 6 d. minia įsiveržė į JAV Kongreso rūmus, siekdama sustabdyti rinkimų rezultatų patvirtinimą.",
lore:"Įvykiui pagrindą sudarė mėnesius trukęs teiginys apie pavogtus rinkimus, kurio teismai neparėmė nė vienoje byloje. Buvo pareikšta daugiau nei tūkstantis kaltinimų, tarp dalyvių — organizuotų grupių narių.",
f:"Dvi versijos gyvena greta ir viena kitos nepripažįsta: vieniems tai sukilimas, kitiems — provokacija su įsimaišiusiais agentais. Antroji versija atsirado per kelias dienas ir yra tikslus tas pats šablonas kaip po Oklahomos."},

{id:"e_reichsburger",l:"2022 m. sulaikymai Vokietijoje",t:"faktas",y:2022,st:"faktas",

lore:"Tarp sulaikytųjų buvo buvusių kariškių, teisininkė ir aristokratų giminės atstovas. Grupė laikėsi įsitikinimo, kad dabartinė valstybė neteisėta, o senoji imperija tebeegzistuoja.",

// ================= IDEOLOGIJOS STRUKTŪRA =================
{id:"th_zog",l:"„Okupacinė vyriausybė“",t:"teorija",y:1976,st:"paneigta",
k:"Valstybė esą nebėra sava — ją perėmusi svetima grupė, todėl valdžia neteisėta.",
lore:"Sąvoka susiformavo JAV kraštutinėje dešinėje ir yra atviro antisemitinio modulio politinė forma. Jos funkcija praktinė: jei valdžia okupacinė, priešinimasis pateikiamas kaip savigyna.",
f:"Šiandien tiesioginė santrumpa vartojama rečiau, o vietoj jos kalbama apie globalistus ar režimą. Struktūra nepakito: pirma paskelbiama, kad valdžia svetima, paskui daroma išvada apie leistinus veiksmus. Tai jungiamoji grandis tarp senojo antisemitizmo ir šiuolaikinės antivalstybinės retorikos."},

{id:"th_baltas_genocidas",l:"„Baltasis genocidas“",t:"teorija",y:1988,st:"paneigta",
k:"Demografiniai pokyčiai esą yra sąmoningas naikinimo planas, o ne migracijos ir gimstamumo pasekmė.",
lore:"Nuo bendresnio pakeitimo naratyvo skiriasi tuo, kad naudoja genocido sąvoką ir taip iš anksto pateisina kraštutinį atsaką. Turi savo trumpą šūkį, kuris veikia kaip atpažinimo ženklas.",
f:"Šūkis vartojamas kaip slaptažodis — jį ištarus aišku, kurioje pusėje esi. Tai vienas iš nedaugelio atlaso mazgų, kurį tyrėjai tiesiogiai sieja su konkrečiais išpuoliais, nes vykdytojų tekstai jį įvardija patys."},

{id:"th_milicijos",l:"Milicijų judėjimas",t:"teorija",y:1994,st:"nepatikrinama",
k:"Valdžia esą ruošiasi nuginkluoti ir suimti piliečius, todėl reikia rengtis ginkluotam pasipriešinimui.",
lore:"Judėjimas išaugo devintojo dešimtmečio pradžioje po dviejų apgulčių ir pasiekė piką iki 1995 m. Vėliau silpo, o po 2008 m. ir 2020 m. vėl kilo bangomis.",
f:"Kalbama apie pasiruošimą, mokymus ir tai, kad diena ateis. Bendruomenė daug laiko skiria įrangai ir organizacijai, o ne ideologijai, ir būtent tai daro ją stabilią. Grafe ji jungiasi su FEMA stovyklų, ginklų atėmimo ir NPT temomis."},

{id:"th_ginklu_atemimas",l:"Ginklų atėmimo planas",t:"teorija",y:1994,st:"nepatikrinama",
k:"Kiekvienas ginklų taisyklių pakeitimas esą yra žingsnis link visuotinio konfiskavimo.",
lore:"Konkretūs pasiūlymai paprastai būna daug siauresni, tačiau argumentas remiasi ilgalaike tendencija, o ne vienu sprendimu. Po kiekvieno didelio įvykio pardavimai smarkiai išauga.",
f:"Kartojama, kad pirma registruoja, paskui atima, ir kaip pavyzdys nurodomos kitos šalys. Ši teorija turi unikalią savybę: ji pati keičia tikrovę, nes panika didina ginklų kiekį apyvartoje."},

{id:"th_suverenus_pilietis",l:"Suverenaus piliečio doktrina",t:"teorija",y:1971,st:"paneigta",
k:"Egzistuoja esą slaptas teisinis triukas, leidžiantis atsiskirti nuo valstybės ir netaikyti sau įstatymų.",
lore:"Doktrina remiasi savitu didžiųjų raidžių, jūrų teisės ir gimimo liudijimo aiškinimu. Kanados teismo 2012 m. sprendimas išsamiai išnagrinėjo šiuos argumentus ir konstatavo, kad nė vienas jų nėra teisiškai veikiantis; teismuose jie nelaimėjo niekada.",
f:"Judėjimas turi savo ritualus: tam tikras parašo formas, dokumentų grąžinimą ir frazes, kurias reikia ištarti policijai. Kalbama, kad teisėjai pyksta, nes formulė veikia — nors pyktį kelia procesų vilkinimas. Ši doktrina plinta ir Europoje, kur pardavinėjami mokymai."},

{id:"th_reichsburger",l:"Imperijos tęstinumas",t:"teorija",y:1985,st:"paneigta",
k:"Dabartinė valstybė esą yra tik administracinis darinys, o tikroji valstybė niekada nenustojo egzistavusi.",
lore:"Vokiškasis variantas remiasi savitu pokario teisinės padėties aiškinimu, kurį teismai atmetė. Panašios doktrinos veikia ir kitose šalyse, visur su ta pačia logika.",
f:"Nariai gaminasi savo dokumentus, pasus ir vėliavas. Kalbama, kad reikia tik atkurti teisėtą tvarką, o dabartinė administracija tiesiog dings. Tai suverenaus piliečio doktrinos europinis atitikmuo su istoriniu apvalkalu."},

{id:"th_stop_the_steal",l:"Pavogti rinkimai",t:"teorija",y:2020,st:"paneigta",
k:"Rinkimų rezultatai esą suklastoti mašinomis, balsavimu paštu ir koordinuotu sukčiavimu.",
lore:"Teiginiai buvo nagrinėti dešimtyse bylų ir atmesti visose instancijose, įskaitant teisėjų, paskirtų tos pačios pusės. Balsavimo mašinų gamintojų ieškiniai dėl šmeižto baigėsi rekordinėmis kompensacijomis.",
f:"Kalbama, kad bylas atmetė dėl formalumų, o ne dėl esmės. Ši teorija ypatinga tuo, kad turi tikslią pabaigos datą kiekviename cikle ir vis tiek atgimsta. Grafe ji tiesiogiai jungiasi su QAnon ir su Kapitolijaus įvykiais."},

{id:"th_akceleracionizmas",l:"Akceleracionizmas",t:"teorija",y:2015,st:"paneigta",
k:"Sistemos griūtį esą reikia paspartinti, nes tik chaose atsiras galimybė naujai tvarkai.",
lore:"Skirtingai nuo daugelio kitų mazgų, tai ne aiškinimas, o strategija. Ji atsirado internetinėse subkultūrose ir tiesiogiai skatina smurtą kaip griūties greitiklį.",
f:"Kalbama apie tai, kad taisyti nebeįmanoma ir kad reikia tiesiog stumtelėti. Ši linija atlase yra pavojingiausia, nes jai nereikia nei įrodymų, nei nuoseklumo — pakanka nusivylimo. Tyrėjai nurodo, kad būtent ji dabar labiausiai auga tarp jaunų vartotojų."},

{id:"th_lone_wolf",l:"Bevadė struktūra",t:"teorija",y:1992,st:"paneigta",

  for(let it=0;it<400;it++){

    const A=N[i],B=N[j];let dx=B.x-A.x,dy=B.y-A.y,d2=dx*dx+dy*dy;
    if(d2<4){d2=4;dx=Math.random()-.5;dy=Math.random()-.5;}
    const d=Math.sqrt(d2),f=1500/d2,fx=dx/d*f,fy=dy/d*f;
    A.vx-=fx;A.vy-=fy;B.vx+=fx;B.vy+=fy;
    const mn=R(A)+R(B)+18;
    if(d<mn){const p=(mn-d)/d*.3;A.vx-=dx*p;A.vy-=dy*p;B.vx+=dx*p;B.vy+=dy*p;}
   }
   LK.forEach(l=>{const a=l.source,b=l.target,dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||1;
    const f=(d-90)*.05,fx=dx/d*f,fy=dy/d*f;a.vx+=fx;a.vy+=fy;b.vx-=fx;b.vy-=fy;});
   N.forEach(n=>{n.vx+=(W/2-n.x)*.004;n.vy+=(H/2-n.y)*.004;n.x+=n.vx*.5;n.y+=n.vy*.5;n.vx*=.83;n.vy*=.83;});
  }
 }
 N.forEach(n=>{n.gx=n.x;n.gy=n.y;n.tx=n.x;n.ty=n.y;});
})();

/* ---------- būsena ---------- */
const S={q:"",year:2025,off:new Set(),sel:null,depth:1,trail:[],mode:"atlas"};
const SVGNS="http://www.w3.org/2000/svg";
const MOB=()=>matchMedia("(max-width:820px), (pointer:coarse) and (max-width:1024px)").matches;
document.body.classList.toggle("touch",matchMedia("(pointer:coarse)").matches);
const svg=document.getElementById("viz"),scene=document.getElementById("scene");

/* ---------- kairysis stulpelis ---------- */
const cnt={};N.forEach(n=>cnt[n.t]=(cnt[n.t]||0)+1);
const tb=document.getElementById("types");
Object.entries(TYPES).forEach(([k,v])=>{
 const b=document.createElement("button");b.className="chip";
 b.innerHTML=`<span class="dot" style="background:${v.c}"></span>${v.n}<span class="count">${cnt[k]||0}</span>`;
 b.onclick=()=>{S.off.has(k)?S.off.delete(k):S.off.add(k);b.classList.toggle("off");render();};
 tb.appendChild(b);
});
const rb=document.getElementById("rels");
Object.entries(RELS).forEach(([k,v])=>{
 const d=document.createElement("div");d.className="chip";
 d.innerHTML=`<span class="bar" style="background:${v.c}"></span><span style="color:var(--ink2)">${v.n}</span>`;
 rb.appendChild(d);
});
document.getElementById("legend").innerHTML=
 `<div class="row"><span class="dot" style="background:#0FA47F"></span><b>Motyvai</b> — pasikartojantys blokai</div>`+
 `<div class="row"><span class="dot" style="background:#E8336D"></span><b>Teorijos</b> — jų deriniai</div>`+
 `<div class="row"><span class="dot" style="background:#3B4A57"></span><b>Faktai</b> — kur teorija turi atramą</div>`+
 `<div style="margin-top:6px;color:var(--ink3)">Spustelėkite burbuliuką — jis ir jo ryšiai užsidegs tinkle. Nežinote, nuo ko pradėti — „Atsitiktinė teorija“ arba klavišas R.</div>`;

/* ---------- SVG elementai ---------- */
const lineEls=LK.map(l=>{
 const e=document.createElementNS(SVGNS,"line");
 e.setAttribute("stroke",RELS[l.r].c);e.setAttribute("stroke-linecap","round");
 scene.appendChild(e);return e;
});
const nodeEls=N.map(n=>{
 const g=document.createElementNS(SVGNS,"g");g.setAttribute("class","node");
 const hit=document.createElementNS(SVGNS,"circle");
 hit.setAttribute("fill","transparent");
 const c=document.createElementNS(SVGNS,"circle");
 c.setAttribute("fill",TYPES[n.t].c);c.setAttribute("stroke","#fff");c.setAttribute("stroke-width",2);
 const t=document.createElementNS(SVGNS,"text");
 t.setAttribute("y",4);t.textContent=n.l;
 g.append(hit,c,t);
 g.onclick=ev=>{ev.stopPropagation();if(dragged)return;focus(n.id);};
 scene.appendChild(g);return{g,c,t,hit};
});

/* ---------- transformacija ---------- */
let tf={k:.55,x:0,y:0};
const applyTf=()=>scene.setAttribute("transform",`translate(${tf.x},${tf.y}) scale(${tf.k})`);
function fitTo(list,pad){
 if(!list.length)return;pad=pad||90;
 const r=svg.getBoundingClientRect();
 const x0=Math.min(...list.map(n=>n.tx))-pad,x1=Math.max(...list.map(n=>n.tx))+pad+120;
 const y0=Math.min(...list.map(n=>n.ty))-pad,y1=Math.max(...list.map(n=>n.ty))+pad;
 const k=Math.min(r.width/(x1-x0),r.height/(y1-y0),1.35);
 animateTf({k,x:-x0*k+(r.width-(x1-x0)*k)/2,y:-y0*k+(r.height-(y1-y0)*k)/2});
}
let tfAnim=null;
function animateTf(to){
 const from={...tf},t0=performance.now();
 tfAnim=()=>{
  const p=Math.min(1,(performance.now()-t0)/520),e=1-Math.pow(1-p,3);
  tf={k:from.k+(to.k-from.k)*e,x:from.x+(to.x-from.x)*e,y:from.y+(to.y-from.y)*e};
  applyTf();if(p>=1)tfAnim=null;
 };
}
svg.addEventListener("wheel",e=>{
 e.preventDefault();tfAnim=null;
 const r=svg.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
 const k=Math.min(4,Math.max(.15,tf.k*(e.deltaY<0?1.13:1/1.13)));
 tf.x=mx-(mx-tf.x)*(k/tf.k);tf.y=my-(my-tf.y)*(k/tf.k);tf.k=k;applyTf();
},{passive:false});
let drag=null,dragged=false,pinch=null;
const ptrs=new Map();
const dist=()=>{const a=[...ptrs.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);};
const mid=()=>{const a=[...ptrs.values()];return{x:(a[0].x+a[1].x)/2,y:(a[0].y+a[1].y)/2};};

svg.addEventListener("pointerdown",e=>{
 tfAnim=null;
 ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){
  drag=null;dragged=true;
  const r=svg.getBoundingClientRect(),m=mid();
  pinch={d:dist(),k:tf.k,mx:m.x-r.left,my:m.y-r.top,tx:tf.x,ty:tf.y};
 }else if(ptrs.size===1){
  drag={x:e.clientX,y:e.clientY,tx:tf.x,ty:tf.y,m:false};
  svg.classList.add("drag");
 }
});
document.addEventListener("pointermove",e=>{
 if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pinch&&ptrs.size>=2){
  const k=Math.min(4,Math.max(.12,pinch.k*(dist()/pinch.d)));
  tf.x=pinch.mx-(pinch.mx-pinch.tx)*(k/pinch.k);
  tf.y=pinch.my-(pinch.my-pinch.ty)*(k/pinch.k);
  tf.k=k;applyTf();return;
 }
 if(!drag)return;
 const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
 if(Math.abs(dx)+Math.abs(dy)>6)drag.m=true;
 tf.x=drag.tx+dx;tf.y=drag.ty+dy;applyTf();
});
function endPtr(e){
 ptrs.delete(e.pointerId);
 if(ptrs.size<2)pinch=null;
 if(!drag)return;
 dragged=drag.m;
 if(!drag.m&&e.target===svg)focus(null);
 drag=null;svg.classList.remove("drag");
 setTimeout(()=>{dragged=false;},0);
}
document.addEventListener("pointerup",endPtr);
document.addEventListener("pointercancel",endPtr);

/* ---------- matomumas ---------- */
const passes=n=>n.y<=S.year&&!S.off.has(n.t);
function relSet(){
 if(!S.sel)return null;
 const s=new Set([S.sel]);
 adj.get(S.sel).forEach(a=>s.add(a.o));
 if(S.depth>1){[...s].forEach(id=>adj.get(id).forEach(a=>s.add(a.o)));}
 return s;
}
function visibleSet(){return S.mode==="ego"?relSet():null;}

/* ---------- ego išdėstymas ---------- */
function egoLayout(set){
 const c=byId.get(S.sel);
 const cx=W/2,cy=H/2;
 c.tx=cx;c.ty=cy;
 const ring1=[...new Set(adj.get(S.sel).map(a=>a.o))].filter(id=>set.has(id)&&passes(byId.get(id))).map(id=>byId.get(id));
 ring1.sort((a,b)=>a.t===b.t?a.y-b.y:Object.keys(TYPES).indexOf(a.t)-Object.keys(TYPES).indexOf(b.t));
 const R1=Math.max(230,Math.min(520,ring1.length*26));
 const ang={};
 ring1.forEach((n,i)=>{const a=-Math.PI/2+i/ring1.length*Math.PI*2;ang[n.id]=a;n.tx=cx+R1*Math.cos(a);n.ty=cy+R1*Math.sin(a);});
 if(S.depth>1){
  const r1=new Set(ring1.map(n=>n.id));
  const outer=[...set].filter(id=>id!==S.sel&&!r1.has(id)&&passes(byId.get(id))).map(id=>byId.get(id));
  const buckets={};
  outer.forEach(n=>{
   const ps=adj.get(n.id).map(a=>a.o).filter(o=>r1.has(o));
   const key=ps.length?ps[0]:ring1[0]&&ring1[0].id;
   (buckets[key]=buckets[key]||[]).push(n);
  });
  Object.entries(buckets).forEach(([k,arr])=>{
   const base=ang[k]!==undefined?ang[k]:0;
   const span=Math.min(.9,arr.length*.09);
   arr.forEach((n,i)=>{
    const a=base+(arr.length===1?0:(-span/2+span*i/(arr.length-1)));
    n.tx=cx+(R1+300)*Math.cos(a);n.ty=cy+(R1+300)*Math.sin(a);
   });
  });
 }
}

/* ---------- animacija ---------- */
let raf=null;
function tick(){
 let moving=false;
 N.forEach(n=>{
  const dx=n.tx-n.x,dy=n.ty-n.y;
  if(Math.abs(dx)>.4||Math.abs(dy)>.4){n.x+=dx*.14;n.y+=dy*.14;moving=true;}
  else{n.x=n.tx;n.y=n.ty;}
 });
 paint();
 if(tfAnim)tfAnim();
 if(moving||tfAnim)raf=requestAnimationFrame(tick);else raf=null;
}
function kick(){if(!raf)raf=requestAnimationFrame(tick);}

function paint(){
 const set=visibleSet(), hi=relSet();
 N.forEach((n,i)=>{
  const el=nodeEls[i];
  const show=passes(n)&&(!set||set.has(n.id));
  if(!show){el.g.style.display="none";return;}
  el.g.style.display="";
  el.g.setAttribute("transform",`translate(${n.x},${n.y})`);
  const isSel=n.id===S.sel, inHi=!hi||hi.has(n.id), r=isSel?R(n)+4:R(n);
  el.c.setAttribute("r",r);
  el.hit.setAttribute("r",Math.max(r+5,MOB()?20:11)/Math.max(tf.k,.35));
  el.c.setAttribute("stroke",isSel?"#14202E":"#fff");
  el.c.setAttribute("stroke-width",isSel?3:2);
  const dim=S.q.trim()&&!match(n);
  el.g.setAttribute("opacity",dim?.15:(inHi?1:.12));
  const lab=(hi?hi.has(n.id):(n.t==="motyvas"||n.deg>=7))||(S.q.trim()&&match(n));
  el.t.style.display=lab?"":"none";
  el.t.setAttribute("x",r+6);
  el.t.setAttribute("font-size",n.t==="motyvas"?13:11.5);
  el.t.setAttribute("fill",isSel?"#14202E":"#33465C");
  el.t.setAttribute("font-weight",isSel?700:560);
 });
 LK.forEach((l,i)=>{
  const e=lineEls[i];
  const show=passes(l.source)&&passes(l.target)&&(!set||(set.has(l.s)&&set.has(l.t)));
  if(!show){e.style.display="none";return;}
  e.style.display="";
  e.setAttribute("x1",l.source.x);e.setAttribute("y1",l.source.y);
  e.setAttribute("x2",l.target.x);e.setAttribute("y2",l.target.y);
  const hot=S.sel&&(l.s===S.sel||l.t===S.sel);
  const both=!hi||(hi.has(l.s)&&hi.has(l.t));
  e.setAttribute("stroke-width",hot?2.8:(set?1.5:1.1));
  e.setAttribute("opacity",hot?1:(both?(set?.5:.32):.05));
 });
 const vis=N.filter(n=>passes(n)&&(!set||set.has(n.id))).length;
 document.getElementById("stat").textContent=
   hi?`${byId.get(S.sel).l} · ${adj.get(S.sel).length} tiesioginiai ryšiai`:`${vis} mazgai · ${LK.length} ryšiai`;
}
const match=n=>{const s=S.q.toLowerCase();
 return n.l.toLowerCase().includes(s)||n.en.toLowerCase().includes(s)||
  n.tags.some(t=>t.toLowerCase().includes(s))||n.k.toLowerCase().includes(s)||n.lore.toLowerCase().includes(s);};

/* ---------- fokusavimas ---------- */
function centerOn(n){
 const r=svg.getBoundingClientRect(), k=Math.max(tf.k,MOB()?.5:.72);
 const cy=MOB()?r.height*.22:r.height/2;
 animateTf({k,x:r.width/2-n.tx*k,y:cy-n.ty*k});
}
function focus(id){
 if(id&&S.sel!==id){S.trail=S.trail.filter(x=>x!==id);S.trail.push(id);if(S.trail.length>7)S.trail.shift();}
 S.sel=id;
 if(!id&&S.mode==="ego"){S.mode="atlas";N.forEach(n=>{n.tx=n.gx;n.ty=n.gy;});}
 if(id&&S.mode==="ego")egoLayout(relSet());
 render();
 if(MOB()){
  document.body.classList.toggle("sheet",!!id);
  document.body.classList.remove("drawer");
 }
 if(S.mode==="ego"){const set=visibleSet();fitTo(N.filter(n=>passes(n)&&(!set||set.has(n.id))));}
 else if(id)centerOn(byId.get(id));
 kick();
}
function render(){drawPanel();drawTrail();paint();}

function drawTrail(){
 const el=document.getElementById("trail");
 el.innerHTML="";
 S.trail.forEach((id,i)=>{
  if(i){const s=document.createElement("span");s.className="sep";s.textContent="›";el.appendChild(s);}
  const b=document.createElement("button");b.textContent=byId.get(id).l;
  b.onclick=()=>focus(id);el.appendChild(b);
 });
}

const INTRO=`<div class="intro">
<div class="eyebrow">Kaip skaityti</div>
<p style="margin-top:10px"><b>Žali mazgai — motyvai.</b> Tai pasikartojantys naratyvo blokai. Beveik kiekviena teorija yra kelių motyvų derinys su nauju veikėjų sąrašu.</p>
<p><b>Oranžinės linijos</b> rodo, kaip ta pati struktūra išlaiko formą, bet pakeičia kaltinamąjį: iliuminatai → žydai → NPT → reptiloidai → gilioji valstybė. Tai dažniausias evoliucijos mechanizmas.</p>
<p><b>Tamsūs mazgai — realūs faktai.</b> MKUltra, COINTELPRO, Tuskegee. Be jų neįmanoma paaiškinti, kodėl pasakojimai apskritai randa auditoriją.</p>
<p style="color:var(--ink3);font-size:12.5px">Spustelėkite bet kurį mazgą — jis su savo ryšiais užsidegs bendrame tinkle, o čia atsivers aprašymas. Iš nuorodų šakokitės toliau; kelias lieka viršuje. Nežinote, nuo ko pradėti — spauskite „Atsitiktinė teorija“ arba klavišą R ir keliaukite iš ten. Mygtukas „Sutelkti aplink“ išskiria tik to mazgo aplinką.</p></div>`;

function drawPanel(){
 const box=document.getElementById("right");
 if(!S.sel){box.innerHTML=INTRO;return;}
 const n=byId.get(S.sel);
 const st=ST[n.st]||{l:n.st,c:"#6B7C90"};
 const yr=n.y<0?`${-n.y} pr. m. e.`:n.y;
 let h=`<div class="tagline">
   <span class="badge" style="background:${TYPES[n.t].c}18;color:${TYPES[n.t].c}">${TYPES[n.t].n}</span>
   <span class="badge" style="background:${st.c}18;color:${st.c}">${st.l}</span>
   <span class="meta">${yr}</span></div>
  <h2>${n.l}</h2>
  <div class="en">${n.en}</div>
  <div class="claim">${n.k}</div>
  <div class="lore">${n.lore}</div>
  ${n.f?`<div class="folk"><span class="eyebrow" style="color:#7B3FE4">Žmonės kalba</span><div>${n.f}</div></div>`:""}
  <div class="tags">${n.tags.map(t=>`<button class="tag" data-tag="${t}">#${t}</button>`).join("")}</div>
  ${n.src?`<div class="src"><span class="eyebrow">Tikrinimo raktas</span><div>${n.src}</div></div>`:""}`;
 const grp={};
 adj.get(n.id).forEach(a=>{(grp[a.r]=grp[a.r]||[]).push(a);});
 Object.keys(RELS).forEach(r=>{
  if(!grp[r])return;
  h+=`<div class="relgrp"><div class="lbl" style="color:${RELS[r].c}">${RELS[r].n} (${grp[r].length})</div>`;
  grp[r].sort((a,b)=>byId.get(a.o).y-byId.get(b.o).y).forEach(a=>{
   const o=byId.get(a.o);
   h+=`<button class="rel" data-go="${o.id}">
     <span class="nm">${a.dir==="in"?"← ":""}${o.l}</span><br>
     <span class="tp">${TYPES[o.t].n} · ${o.y<0?-o.y+" pr.m.e.":o.y}</span></button>`;
  });
  h+=`</div>`;
 });
 box.innerHTML=h;
 box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>focus(b.dataset.go));
 box.querySelectorAll("[data-tag]").forEach(b=>b.onclick=()=>{
  const q=document.getElementById("q");q.value=b.dataset.tag;
  q.dispatchEvent(new Event("input"));q.scrollIntoView({block:"nearest"});});
 box.scrollTop=0;
}

/* ---------- valdikliai ---------- */
document.getElementById("q").oninput=e=>{
 S.q=e.target.value;
 const rs=document.getElementById("results");rs.innerHTML="";
 if(S.q.trim()){
  N.filter(match).slice(0,12).forEach(n=>{
   const b=document.createElement("button");
   b.innerHTML=`${n.l}<span class="re">${n.en}</span><span class="rt">${TYPES[n.t].n}</span>`;
   b.onclick=()=>{document.body.classList.remove("drawer");focus(n.id);};rs.appendChild(b);
  });
 }
 paint();
};
document.getElementById("year").oninput=e=>{
 S.year=+e.target.value;document.getElementById("ylab").textContent=S.year;
 if(S.sel){egoLayout(visibleSet());kick();}
 paint();
};
let recent=[];
function randomNode(){
 // paieška išjungiama, kad naujas mazgas nebūtų pritemdytas
 if(S.q){S.q="";const qi=document.getElementById("q");qi.value="";document.getElementById("results").innerHTML="";}
 if(S.mode==="ego"){S.mode="atlas";document.getElementById("bEgo").classList.remove("on");N.forEach(n=>{n.tx=n.gx;n.ty=n.gy;});}
 let pool=N.filter(n=>passes(n)&&!recent.includes(n.id));
 if(!pool.length){recent=[];pool=N.filter(passes);}
 if(!pool.length)return;
 // dvigubas svoris teorijoms, bet visi tipai lieka pasiekiami
 const w=pool.filter(n=>n.t==="teorija");
 const src=(w.length&&Math.random()<.65)?w:pool;
 const pick=src[Math.floor(Math.random()*src.length)];
 recent.push(pick.id); if(recent.length>15) recent.shift();
 focus(pick.id);
}
document.getElementById("bRand").onclick=randomNode;
document.addEventListener("keydown",e=>{
 const t=e.target.tagName;
 if(t==="INPUT"||t==="TEXTAREA")return;
 if(e.key==="r"||e.key==="R"||e.key===" "){e.preventDefault();randomNode();}
});
document.getElementById("bAll").onclick=()=>{
 S.mode="atlas";document.getElementById("bEgo").classList.remove("on");
 N.forEach(n=>{n.tx=n.gx;n.ty=n.gy;});render();fitTo(N,120);kick();};
const be=document.getElementById("bEgo");
be.onclick=()=>{
 if(!S.sel)return;
 S.mode=S.mode==="ego"?"atlas":"ego";
 be.classList.toggle("on",S.mode==="ego");
 if(S.mode==="ego")egoLayout(relSet()); else N.forEach(n=>{n.tx=n.gx;n.ty=n.gy;});
 render();
 const set=visibleSet();
 if(S.mode==="ego")fitTo(N.filter(n=>passes(n)&&(!set||set.has(n.id))));else centerOn(byId.get(S.sel));
 kick();};
document.getElementById("bFit").onclick=()=>{const set=visibleSet();fitTo(N.filter(n=>passes(n)&&(!set||set.has(n.id))));kick();};
const bd=document.getElementById("bDepth");
bd.onclick=()=>{S.depth=S.depth===1?2:1;bd.classList.toggle("on");if(S.sel)focus(S.sel);};

document.getElementById("btnMenu").onclick=()=>document.body.classList.toggle("drawer");
document.getElementById("scrim").onclick=()=>document.body.classList.remove("drawer");
document.getElementById("sheetX").onclick=()=>document.body.classList.remove("sheet");

let rz;
addEventListener("resize",()=>{
 clearTimeout(rz);
 rz=setTimeout(()=>{const set=visibleSet();fitTo(N.filter(n=>passes(n)&&(!set||set.has(n.id))));kick();},220);
});
addEventListener("orientationchange",()=>setTimeout(()=>{
 const set=visibleSet();fitTo(N.filter(n=>passes(n)&&(!set||set.has(n.id))));kick();},350));

render();
fitTo(N,MOB()?40:120);kick();
</script>
</body>
