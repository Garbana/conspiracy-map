<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Sąmokslo teorijų atlasas</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
:root{
  --bg:#F6F8FB; --card:#FFFFFF; --line:#DDE4EC; --line2:#EDF1F6;
  --ink:#14202E; --ink2:#4A5D72; --ink3:#8395A8;
  --sans:"Avenir Next","Segoe UI",Inter,system-ui,-apple-system,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:9px}

header{display:flex;align-items:center;gap:14px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:16px;font-weight:650;letter-spacing:-.01em;margin:0}
.meta{font-family:var(--mono);font-size:11px;color:var(--ink3)}
#trail{display:flex;gap:6px;align-items:center;margin-left:auto;overflow-x:auto;max-width:52%}
#trail button{font-size:11px;padding:3px 9px;border-radius:20px;background:var(--line2);color:var(--ink2);white-space:nowrap}
#trail button:hover{background:#DCE6F2}
#trail .sep{color:var(--ink3);font-size:11px}

#wrap{display:flex;height:calc(100% - 49px)}
.mob{display:none}
#sheetX{display:none}
#scrim{display:none}
aside{background:var(--card);overflow-y:auto;flex:none}
#left{width:250px;border-right:1px solid var(--line);padding:16px}
#right{width:360px;border-left:1px solid var(--line);padding:20px}
.eyebrow{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.block{margin-bottom:22px}
input[type=text]{width:100%;margin-top:8px;padding:7px 10px;font-size:13px;font-family:var(--sans);
  background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:7px;outline:none}
input[type=text]:focus{border-color:#2B5FE8;background:#fff}
input[type=range]{width:100%;margin-top:8px;accent-color:#E8336D}
.chip{display:flex;align-items:center;gap:8px;font-size:13px;padding:4px 6px;width:100%;text-align:left;border-radius:6px}
.chip:hover{background:var(--line2)}
.chip.off{opacity:.35}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.bar{width:16px;height:3px;border-radius:2px;flex:none}
.count{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--ink3)}
.hint{font-size:11.5px;color:var(--ink3);line-height:1.55;margin-top:8px}
#results{margin-top:8px}
#results button{display:block;width:100%;text-align:left;padding:6px 8px;border-radius:6px;font-size:12.5px;line-height:1.3}
#results button:hover{background:var(--line2)}
#results .rt{font-family:var(--mono);font-size:9px;color:var(--ink3);display:block}

main{flex:1;position:relative;min-width:0}
svg{display:block;width:100%;height:100%;cursor:grab;touch-action:none}
svg.drag{cursor:grabbing}
.node{cursor:pointer}
.node circle{transition:r .15s ease}
.node:hover circle{stroke:#14202E;stroke-width:3}
.node text{pointer-events:none;paint-order:stroke;stroke:#F6F8FB;stroke-width:3.5px;stroke-linejoin:round;font-family:var(--sans);font-weight:560}
.controls{position:absolute;top:14px;left:14px;display:flex;gap:8px;flex-wrap:wrap}
.controls button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:12px;
  box-shadow:0 1px 3px rgba(20,32,46,.06)}
.controls button:hover{border-color:#2B5FE8;color:#2B5FE8}
.controls button.on{background:#14202E;color:#fff;border-color:#14202E}
.controls button.prim{background:#E8336D;color:#fff;border-color:#E8336D;font-weight:600}
.controls button.prim:hover{background:#C81F57;border-color:#C81F57;color:#fff}
.controls button.prim:active{transform:scale(.97)}
#legend{position:absolute;bottom:14px;left:14px;background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;box-shadow:0 1px 3px rgba(20,32,46,.06);font-size:11.5px;line-height:1.7;max-width:230px}
#legend .row{display:flex;align-items:center;gap:7px}

#right .en{font-size:13px;color:var(--ink3);margin-top:3px;font-weight:500;font-style:italic}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.tag{font-family:var(--mono);font-size:10.5px;padding:3px 9px;border-radius:20px;
  background:var(--line2);color:var(--ink2);white-space:nowrap}
.folk{margin-top:16px;padding:12px 14px;border-radius:10px;background:#F3EFFD;border-left:3px solid #7B3FE4;
  font-size:13px;line-height:1.6;color:#3A2B5C}
.folk div{margin-top:5px}
.src{margin-top:16px;padding-top:12px;border-top:1px solid var(--line2);font-size:11.5px;color:var(--ink3);line-height:1.5}
.src div{margin-top:4px}
.tag:hover{background:#DCE6F2;color:#2B5FE8}
#results .re{display:block;font-size:10.5px;color:var(--ink3);font-style:italic}
#right h2{font-size:23px;font-weight:660;margin:10px 0 0;line-height:1.2;letter-spacing:-.015em}
#right .claim{font-size:14.5px;line-height:1.5;margin:14px 0 0;color:var(--ink);font-weight:520}
#right .lore{font-size:13.5px;line-height:1.65;margin:12px 0 0;color:var(--ink2)}
.badge{display:inline-block;font-family:var(--mono);font-size:9.5px;letter-spacing:.08em;padding:3px 8px;border-radius:20px;text-transform:uppercase}
.tagline{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.rel{display:block;width:100%;text-align:left;padding:7px 9px;border-radius:7px;margin-top:3px;line-height:1.35}
.rel:hover{background:var(--line2)}
.rel .nm{font-size:13.5px;font-weight:540}
.rel .tp{font-family:var(--mono);font-size:9.5px;color:var(--ink3)}
.relgrp{margin-top:16px}
.relgrp .lbl{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:2px}
.intro p{font-size:13.5px;line-height:1.65;color:var(--ink2);margin:0 0 12px}
.intro b{color:var(--ink)}

@media (max-width:1100px){
  #left{width:210px}#right{width:310px}
}
@media (max-width:820px), (pointer:coarse) and (max-width:1024px){
  header{padding:10px 14px;gap:10px}
  header h1{font-size:15px}
  #trail{display:none}
  .mob{display:inline-flex;align-items:center;background:var(--line2);border-radius:20px;padding:5px 12px;font-size:12px;font-weight:560}
  #stat{margin-left:auto;font-size:10px}
  #wrap{height:calc(100dvh - 49px)}
  main{flex:1;height:100%}
  #legend{display:none}
  .controls{top:auto;bottom:14px;left:50%;transform:translateX(-50%);justify-content:center;
    background:rgba(255,255,255,.9);backdrop-filter:blur(8px);border-radius:12px;padding:5px;
    box-shadow:0 2px 10px rgba(20,32,46,.12)}
  .controls button{padding:8px 12px;font-size:12px;border:none}

  #left{position:fixed;top:49px;left:0;right:0;width:100%;z-index:60;max-height:72dvh;
    border-right:none;border-bottom:1px solid var(--line);
    transform:translateY(-115%);transition:transform .28s ease;
    box-shadow:0 10px 30px rgba(20,32,46,.15)}
  body.drawer #left{transform:none}
  body.drawer #scrim{display:block;position:fixed;inset:0;z-index:50;background:rgba(20,32,46,.25)}

  #right{position:fixed;left:0;right:0;bottom:0;width:100%;height:68dvh;z-index:70;
    border-left:none;border-top:1px solid var(--line);border-radius:18px 18px 0 0;
    padding:22px 18px 40px;transform:translateY(103%);
    transition:transform .3s cubic-bezier(.2,.8,.2,1);
    box-shadow:0 -8px 30px rgba(20,32,46,.18)}
  body.sheet #right{transform:none}
  body:not(.sheet) #right{pointer-events:none}
  #right:before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);
    width:42px;height:4px;border-radius:4px;background:var(--line)}
  body.sheet #sheetX{display:block;position:fixed;right:14px;bottom:calc(68dvh + 12px);z-index:71;
    background:var(--card);border:1px solid var(--line);border-radius:20px;padding:7px 14px;
    font-size:12px;box-shadow:0 2px 10px rgba(20,32,46,.12)}
  .rel{padding:11px 9px}
  .tag{font-size:12px;padding:5px 11px}
  .chip{padding:8px 6px;font-size:14px}
  #results button{padding:10px 8px;font-size:14px}
  input[type=text]{padding:10px 12px;font-size:16px}
  .node:hover circle{stroke:#fff;stroke-width:2}
}
</style>
</head>
<body>
<header>
  <h1>Sąmokslo teorijų atlasas</h1>
  <button id="btnMenu" class="mob">Filtrai</button>
  <span class="meta" id="stat"></span>
  <div id="trail"></div>
</header>

<div id="wrap">
  <aside id="left">
    <div class="block">
      <div class="eyebrow">Paieška</div>
      <input type="text" id="q" placeholder="LT arba EN: Illuminati, blood libel, Q…">
      <div id="results"></div>
    </div>
    <div class="block">
      <div class="eyebrow">Laikas iki <span id="ylab">2025</span></div>
      <input type="range" id="year" min="100" max="2025" value="2025">
      <div class="hint">Traukite atgal ir žiūrėkite, kokia tvarka sluoksniai atsirado.</div>
    </div>
    <div class="block">
      <div class="eyebrow">Mazgų tipai</div>
      <div id="types" style="margin-top:6px"></div>
    </div>
    <div class="block">
      <div class="eyebrow">Ryšių tipai</div>
      <div id="rels" style="margin-top:6px"></div>
    </div>
  </aside>

  <main>
    <svg id="viz"><g id="scene"></g></svg>
    <div class="controls">
      <button id="bRand" class="prim">Atsitiktinė teorija</button>
      <button id="bAll">Visas tinklas</button>
      <button id="bEgo">Sutelkti aplink</button>
      <button id="bDepth">Antras lygis</button>
      <button id="bFit">Sutalpinti</button>
    </div>
    <div id="legend"></div>
  </main>

  <aside id="right"></aside>
</div>
<button id="sheetX">Uždaryti</button>
<div id="scrim"></div>

<script>
const TYPES={
 teorija:{c:"#E8336D",n:"Teorija"},
 asmuo:{c:"#2B5FE8",n:"Asmuo"},
 butybe:{c:"#7B3FE4",n:"Būtybė / figūra"},
 grupe:{c:"#F2A007",n:"Grupė / organizacija"},
 motyvas:{c:"#0FA47F",n:"Motyvas"},
 tekstas:{c:"#00A5C4",n:"Šaltinis / tekstas"},
 faktas:{c:"#3B4A57",n:"Realus faktas"}
};
const RELS={
 kyla:{c:"#E8336D",n:"kyla iš"},
 keicia:{c:"#F0533A",n:"keičia kaltinamąjį"},
 perdirba:{c:"#B02A8F",n:"perdirba tekstą"},
 fikcija:{c:"#00A5C4",n:"fikcija tapo tikėjimu"},
 seklai:{c:"#3B4A57",n:"faktinė sėkla"},
 motyvas:{c:"#0FA47F",n:"naudoja motyvą"},
 veikejas:{c:"#7B3FE4",n:"veikėjas teorijoje"},
 autorius:{c:"#2B5FE8",n:"autorius / skleidėjas"},
 taikinys:{c:"#F2A007",n:"kaltinamas / taikinys"}
};

const D_TEORIJOS=[
{id:"th_iliuminatai",l:"Iliuminatų sąmokslas",t:"teorija",y:1797,st:"paneigta",
k:"1785 m. uždarytas Bavarijos ordinas neva niekada nenustojo veikti ir iki šiol slapta valdo pasaulio įvykius.",
lore:"Weishaupto įkurta švietėjiška draugija veikė devynerius metus ir buvo išvaikyta kunigaikščio įsakymu. Praėjus dvylikai metų du autoriai — jėzuitas Barruelis ir škotų profesorius Robisonas — nepriklausomai paskelbė, kad ordinas išliko ir surengė Prancūzijos revoliuciją. Nuo tada iliuminatai tapo universalia forma: į tą patį kiaušinio lukštą per du šimtmečius buvo dedami masonai, žydai, bankininkai, komunistai, NPT ir galiausiai gilioji valstybė."},

{id:"th_masonai",l:"Masonų sąmokslas",t:"teorija",y:1797,st:"nepatikrinama",
k:"Masonų ložės esą yra pasaulinio politinio valdymo tinklas, o jų ritualai slepia okultinę doktriną.",
lore:"Masonerija tikrai turi laipsnius, priesaikas ir uždarus ritualus — to pakanka, kad ji atrodytų kaip idealus konspiracijos indas. XVIII a. ji buvo apkaltinta revoliucijomis, XIX a. — ateizmu, XX a. — sąjunga su žydais. Leo Taxilio afera (1885–1897) parodė mechanizmą gryna forma: prancūzas dešimtmetį leido knygas apie masonų velnio garbinimą, o paskui viešai pareiškė, kad viską išgalvojo — tačiau jo prasimanymai gyvena iki šiol."},

{id:"th_zydu_sam",l:"Pasaulinis žydų sąmokslas",t:"teorija",y:1868,st:"paneigta",
k:"Žydų vadovybė esą slapta koordinuoja finansus, žiniasklaidą ir politiką, siekdama valdyti pasaulį.",
lore:"Tai ne viena teorija, o variklis, kuris kelis šimtmečius maitina visas kitas. Jis paveldėjo viduramžių kraujo šmeižtą, XIX a. gavo pseudomokslinį rasinį apvalkalą, o 1903 m. — savo šventraštį, Siono išminčių protokolus. Struktūra tokia patogi, kad ją nuolat perdirba: pakeitus žodį „žydai“ į „chazarai“, „globalistai“, „Rotšildai“ ar „reptiloidai“, pasakojimas veikia toliau, o daliai auditorijos atrodo nebe antisemitinis."},

{id:"th_rotsildai",l:"Rotšildų valdymas",t:"teorija",y:1846,st:"paneigta",
k:"Viena bankininkų giminė esą valdo pasaulio finansus, karus ir centrinius bankus.",
lore:"Rotšildai XIX a. iš tiesų buvo galingiausia Europos bankininkų šeima ir finansavo valstybes — tai faktinė sėkla. Ant jos užaugo prasimanymai: neva Natanas Rotšildas pelnėsi iš Vaterlo žinių, kad giminė valdo visus bankus, išskyrus kelias šalis. Šiandien giminės finansinė reikšmė yra nedidelė, tačiau pavardė liko patogiu antisemitinio pasakojimo kodu, kurį galima ištarti neminint žodžio „žydai“."},

{id:"th_fed",l:"Federalinio rezervo sąmokslas",t:"teorija",y:1913,st:"nepatikrinama",
k:"JAV centrinis bankas esą yra privati bankininkų nuosavybė, sukurta slaptame Džekilo salos susitikime tautai pavergti.",
lore:"1910 m. susitikimas Džekilo saloje tikrai buvo slaptas — bankininkai ir senatorius atvyko su išgalvotais vardais. Iš to gimė pasakojimas, kad Fed yra privatus kartelis, spausdinantis pinigus iš oro ir vergiantis piliečius skola. Ši teorija yra tiltas: ji sujungia antisemitinę bankininkų liniją su amerikietiška antivalstybine tradicija ir per Gary Allenʼo brošiūrą įteka tiesiai į Naujosios pasaulio tvarkos pasakojimą."},

{id:"th_bilderbergas",l:"Bilderbergo grupė",t:"teorija",y:1957,st:"nepatikrinama",
k:"Kasmetiniame uždarame politikų ir verslininkų susitikime esą priimami tikrieji pasaulio sprendimai.",
lore:"Konferencija yra reali, vyksta nuo 1954 m., dalyvių sąrašas skelbiamas, o pokalbių turinys — ne. Šis informacijos plyšys ir yra visa teorija: kur nėra protokolo, ten įrašomas bet koks planas. Bilderbergas tapo pagrindine NPT pasakojimo vieta, o kartu su Trišale komisija ir CFR sudaro trijų raidžių trejybę, be kurios neapsieina nė vienas XX a. pabaigos sąmokslo tekstas."},

{id:"th_trisale",l:"Trišalė komisija",t:"teorija",y:1973,st:"nepatikrinama",
k:"Rokfelerio įkurta komisija esą koordinuoja Vakarų elito veiksmus pasaulinei vyriausybei kurti.",
lore:"1973 m. Davidas Rokfeleris subūrė Šiaurės Amerikos, Europos ir Japonijos veikėjų diskusijų forumą. Kadangi Carterio administracijoje atsidūrė daug jos narių, tai buvo perskaityta kaip perėmimo įrodymas. Komisija tapo privaloma antrąja NPT trikampio viršūne."},

{id:"th_cfr",l:"Užsienio ryšių taryba (CFR)",t:"teorija",y:1962,st:"nepatikrinama",
k:"JAV užsienio politiką esą formuoja ne rinkėjai, o uždara analitikų ir bankininkų taryba.",
lore:"CFR yra reali įtakinga organizacija, leidžianti žurnalą ir rengianti pranešimus. Šaltojo karo dešiniesiems ji tapo įrodymu, kad politika perkelta iš Kongreso į privatų kabinetą. Iš šio kaltinimo išaugo visa amerikietiška „šešėlinės vyriausybės“ leksika."},

{id:"th_skull",l:"Skull and Bones",t:"teorija",y:1970,st:"nepatikrinama",
k:"Jeilio studentų brolija esą yra elito verbavimo mechanizmas su okultiniais ritualais.",
lore:"Brolija reali, uždara, jos nariais buvo trys prezidentai. Pasakojimai apie karstus, kaukoles ir priesaikas paverčia universiteto tradiciją inicijacijos grandimi, jungiančia iliuminatų archetipą su konkrečiomis JAV pavardėmis."},

{id:"th_bohemija",l:"Bohemijos giraitė",t:"teorija",y:1980,st:"nepatikrinama",
k:"Kalifornijos miške galingiausi vyrai esą atlieka pagoniškus aukojimo ritualus prie milžiniškos pelėdos.",
lore:"Bohemian Grove yra realus uždaras klubas, kuriame nuo XIX a. vyksta vyrų suvažiavimai su teatralizuota ceremonija „Rūpesčio kremacija“ prie betoninės pelėdos statulos. 2000 m. Alexas Jonesas ten įsibrovė ir nufilmavo ceremoniją — ši medžiaga tapo svarbiausiu vaizdiniu ritualinio elito įrodymu, nors filmuota tikrai buvo teatrinė inscenizacija."},

{id:"th_nwo",l:"Naujoji pasaulio tvarka",t:"teorija",y:1971,st:"nepatikrinama",
k:"Slaptas elitas esą laipsniškai naikina valstybes, kad įvestų vieną pasaulinę vyriausybę ir totalią kontrolę.",
lore:"NPT yra ne teorija, o konteineris: į jį telpa bankai, JT, vakcinos, klimato politika, migracija ir kosminiai ateiviai. Terminas paplito po Gary Allenʼo brošiūros, o 1990 m. jį netyčia sustiprino George'as H. W. Bushas, viešai pavartojęs frazę „naujoji pasaulio tvarka“. Būtent šis mazgas jungia beveik visas modernias teorijas — todėl tinkle jis ir yra tankiausias."},

{id:"th_deepstate",l:"Gilioji valstybė",t:"teorija",y:2016,st:"ginčytina",
k:"Nerinkta žvalgybos ir biurokratijos sluoksnis esą valdo šalį nepriklausomai nuo rinkimų rezultatų.",
lore:"Sąvoka atkeliavo iš Turkijos, kur gilioji valstybė buvo dokumentuota realybė. JAV kontekste ji tapo NPT tęsiniu be ezoterikos: ta pati struktūra, bet kaltinamieji — ne iliuminatai, o FTB ir CŽV pareigūnai. Būtent šis perkėlimas leido senam pasakojimui grįžti į kasdienę politiką ir tapti QAnon pamatu."},

{id:"th_agenda21",l:"Agenda 21 ir 2030",t:"teorija",y:1992,st:"paneigta",
k:"JT darnaus vystymosi programos esą yra planas suvaryti žmones į miestus, atimti nuosavybę ir sumažinti populiaciją.",
lore:"Agenda 21 yra neįpareigojantis 1992 m. Rio konferencijos dokumentas apie aplinkosaugą. JAV vietos politikoje jis buvo perskaitytas kaip nuosavybės teisių naikinimo instrukcija: dviračių takai, tankesnė statyba ir gamtos rezervatai tapo pavergimo įrankiais. Iš čia tiesiai kyla „15 minučių miestų“ panika ir Didžiojo perkrovimo pasakojimas."},

{id:"th_greatreset",l:"Didysis perkrovimas",t:"teorija",y:2020,st:"paneigta",
k:"Pasaulio ekonomikos forumas esą panaudojo pandemiją kaip pretekstą įvesti kontroliuojamą ekonomiką, kur niekas nieko neturės.",
lore:"2020 m. WEF paskelbė knygą ir iniciatyvą apie ekonomikos pertvarkymą po pandemijos, o senas forumo įrašas su fraze apie tai, kad ateityje žmonės nieko neturės ir bus laimingi, tapo memu. Prognozė buvo paversta planu, o pasiūlymas — įsakymu. Teorija greitai sulipo su vakcinų, skaitmeninių valiutų ir klimato politikos linijomis."},

{id:"th_kalergi",l:"Kalergio planas",t:"teorija",y:2005,st:"paneigta",
k:"Europos vienijimosi pradininkas esą parašė programą sumaišyti europiečius su atvykėliais ir sunaikinti tautas.",
lore:"Richardas Coudenhove-Kalergi 1925 m. knygoje spėliojo apie būsimą mišrią europiečių rasę — tai buvo tuometinė ateities vizija, ne politinis planas. Austrų neonacių autorius 2005 m. ištraukė kelias pastraipas iš konteksto ir pavertė jas įsakymu. Iš čia teorija tiesiai virsta Didžiuoju pakeitimu."},

{id:"th_pakeitimas",l:"Didysis pakeitimas",t:"teorija",y:2011,st:"paneigta",
k:"Elitas esą sąmoningai keičia vietinius Europos gyventojus migrantais.",
lore:"Renaud Camus 2011 m. suteikė senam demografiniam nerimui patrauklų pavadinimą. Nuo ankstesnių versijų ji skiriasi tik kaltinamųjų sąrašu — struktūra ta pati kaip Kalergio plane ar tarpukario baimėse. Ši teorija yra viena iš nedaugelio, tiesiogiai įkvėpusių masinius smurto aktus, todėl atlase žymima kaip aukštos žalos mazgas."},

{id:"th_kultmarks",l:"„Kultūrinis marksizmas“",t:"teorija",y:1992,st:"paneigta",
k:"Frankfurto mokyklos filosofai esą sukūrė programą sugriauti Vakarų kultūrą iš vidaus per švietimą ir žiniasklaidą.",
lore:"Frankfurto mokykla realiai egzistavo ir kritikavo masinę kultūrą. Teorija paverčia akademinę srovę centralizuota operacija, o kadangi dauguma jos narių buvo žydų kilmės emigrantai, konstruktas veikia kaip perpakuotas tarpukario „kultūrinio bolševizmo“ kaltinimas."},

{id:"th_soros",l:"Soroso tinklas",t:"teorija",y:1997,st:"paneigta",
k:"Vienas finansininkas esą finansuoja protestus, migraciją ir revoliucijas, kad destabilizuotų valstybes.",
lore:"George'as Sorosas yra realus investuotojas ir filantropas, per Atviros visuomenės fondus finansavęs pilietines organizacijas. Teorija jį paverčia visų nepatogių įvykių priežastimi — nuo protestų iki migrantų karavanų. Struktūriškai tai klasikinis vieno turtingo žydo kaip pasaulio variklio įvaizdis, todėl tyrėjai ją laiko antisemitinio šablono tęsiniu."},

{id:"th_chazaru",l:"„Chazarų mafija“",t:"teorija",y:2010,st:"paneigta",
k:"Šiuolaikiniai žydai esą nėra tikri žydai, o chazarų palikuonys, vykdantys senovinį keršto planą.",
lore:"Chazarų kaganatas buvo reali VII–X a. valstybė, kurios elitas priėmė judaizmą. XX a. hipotezė apie Rytų Europos žydų kilmę buvo paversta ginklu: jei žydai „netikri“, jų naikinimas esą pateisinamas. Tai atviriausiai smurtinė antisemitinio modulio versija, plačiai naudojama QAnon ir reptiloidų sluoksniuose."},

{id:"th_guidestones",l:"Džordžijos akmenys",t:"teorija",y:1980,st:"paneigta",
k:"Granito paminklas su įrašu apie 500 mln. gyventojų esą yra elito depopuliacijos planas akmenyje.",
lore:"1980 m. Džordžijoje anonimas užsakė paminklą su dešimčia patarimų aštuoniomis kalbomis, tarp jų — laikyti žmoniją žemiau 500 mln. Užsakovo tapatybė buvo paslaptis iki 2015 m., ir šis vakuumas pavertė akmenis NPT antkapiu. 2022 m. paminklas buvo susprogdintas ir nugriautas."},

{id:"th_denver",l:"Denverio oro uostas",t:"teorija",y:1995,st:"paneigta",
k:"Po oro uostu esą įrengtas elito bunkeris, o freskos ir statula yra užšifruotas apokalipsės pranešimas.",
lore:"Oro uostas buvo brangus, pastatytas su vėlavimais ir papuoštas neįprastu menu: freskomis su kariu dujokauke ir mėlynu žirgu raudonomis akimis, kuris statymo metu užmušė savo kūrėją. Kiekviena keista detalė buvo perskaityta kaip ženklas. Oro uosto administracija galiausiai pati pradėjo juokauti apie teorijas reklamose."},

{id:"th_fema",l:"FEMA stovyklos",t:"teorija",y:1982,st:"paneigta",
k:"JAV esą paruošti koncentracijos lageriai piliečiams, kai bus paskelbta nepaprastoji padėtis.",
lore:"Reali sėkla — šaltojo karo tęstinumo planai ir REX 84 pratybos. Iš jų išaugo pasakojimas apie tuščius traukinių vagonus su antrankiais ir plastikinius karstus. Ši teorija yra amerikietiškos milicijų kultūros branduolys ir tiesioginė Jonesʼo radijo laidų medžiaga."},

{id:"th_jfk",l:"JFK nužudymo teorijos",t:"teorija",y:1964,st:"ginčytina",
k:"Prezidentą esą nužudė ne vienas šaulys, o CŽV, mafijos ar karinio komplekso sąmokslas.",
lore:"Warreno komisijos išvada apie vienintelį šaulį netenkino daugumos amerikiečių, o 1979 m. Kongreso komitetas pats pripažino tikėtiną antrą šaulį. Tai pirmasis atvejis, kai sąmokslo teorija tapo daugumos nuomone demokratinėje valstybėje. JFK byla išmokė visą kultūrą skaityti oficialius pranešimus kaip pridengimo dokumentus."},

{id:"th_911",l:"Rugsėjo 11-osios teorijos",t:"teorija",y:2002,st:"paneigta",
k:"Bokštus esą sugriovė iš anksto padėti sprogmenys, o valdžia žinojo arba pati organizavo išpuolį.",
lore:"Teorija turi tris pakopas — nuo švelnios (žinojo ir leido) iki griežtos (patys padarė). Ji rėmėsi realiais dalykais: Northwoods planu, žvalgybos klaidomis ir plieno griuvimo fizika, kurios dauguma žmonių nemoka vertinti. 9/11 tapo interneto eros pirmuoju masiniu sąmokslo judėjimu ir sujungė senąją NPT temos kartą su jaunais vaizdo įrašų autoriais."},

{id:"th_epstein",l:"Epsteino tinklas",t:"teorija",y:2019,st:"ginčytina",
k:"Elito prekybos nepilnamečiais tinklas esą apsaugotas žvalgybų, o Epsteino mirtis buvo nužudymas.",
lore:"Čia riba tarp fakto ir teorijos ypač plona: nusikaltimai realūs, teismo dokumentai vieši, o įtakingų pažįstamų sąrašas ilgas. Įtarimai dėl mirties kameroje kilo dėl realių saugumo pažeidimų. Šis mazgas svarbus, nes suteikė senoms ritualinio elito teorijoms tikrą atramą ir smarkiai sustiprino QAnon."},

{id:"th_klimatas",l:"Klimato apgaulė",t:"teorija",y:1998,st:"paneigta",
k:"Klimato kaita esą mokslininkų ir valdžių išgalvota, kad būtų galima apmokestinti ir kontroliuoti gyvenimą.",
lore:"2009 m. pavogti Rytų Anglijos universiteto laiškai buvo pateikti kaip klastojimo įrodymas; devynios nepriklausomos komisijos nerado mokslinio sukčiavimo. Teorija išgyveno todėl, kad jungiasi su Agenda 21 ir Didžiuoju perkrovimu — klimato politika tampa ne mokslo, o valdymo klausimu."},

{id:"th_sandyhook",l:"„Krizės aktorių“ teorijos",t:"teorija",y:2012,st:"paneigta",
k:"Šaudynės ir teroro aktai esą inscenizuoti su samdytais aktoriais, kad būtų galima atimti ginklus.",
lore:"Ryškiausias atvejis — 2012 m. Sandy Hook, kai žuvusių vaikų tėvai buvo metų metus persekiojami kaip apsimetėliai. 2022 m. teismai priteisė beveik 1,5 mlrd. dolerių žalos atlyginimą Alexui Jonesui. Tai aiškiausias pavyzdys, kaip abstraktus motyvas apie surežisuotą įvykį virsta tiesiogine žala gyviems žmonėms."},

{id:"th_titanikas",l:"Titaniko sukeitimas",t:"teorija",y:1995,st:"paneigta",
k:"Nuskendo ne Titanikas, o apgadintas jo dvynys Olimpikas, kad būtų galima gauti draudimo išmoką.",
lore:"Olimpikas iš tiesų buvo apgadintas per susidūrimą 1911 m. — tai visa faktinė bazė. Teorija reikalauja, kad šimtai darbininkų ir jūrininkų tylėtų dešimtmečius. Ji naudinga atlase kaip grynas pavyzdys, kaip viena reali smulkmena išlaiko ištisą pasakojimą."},

{id:"th_paul",l:"Paulas mirė",t:"teorija",y:1969,st:"paneigta",
k:"Paulas McCartney esą žuvo 1966 m., o jį pakeitė dvynys, apie ką grupė paliko užuominas albumų viršeliuose.",
lore:"Pasakojimas gimė iš radijo laidos ir plito per atbulai grojamas dainas bei Abbey Road viršelio detales. Tai pirmasis masinis pop kultūros kodų skaitymo pratimas — tiksliai ta pati technika, kurią vėliau naudos QAnon sekėjai, ieškodami prasmės Q žinutėse."},

{id:"th_diana",l:"Dianos žūtis",t:"teorija",y:1997,st:"paneigta",
k:"Princesės Dianos avarija esą buvo Britanijos žvalgybos organizuotas nužudymas.",
lore:"Kelerius metus trukęs teisminis tyrimas nustatė girtą vairuotoją ir persekiojančius fotografus. Teorija išliko, nes atitinka pamatinį modelį: netikėta garsaus žmogaus mirtis reikalauja proporcingos priežasties, o atsitiktinumas jaučiasi kaip įžeidimas."}
];
const D_TEORIJOS2=[
{id:"th_archontai",l:"Gnostiniai archontai",t:"teorija",y:150,st:"nepatikrinama",
k:"Materialų pasaulį esą sukūrė ir valdo netobulos būtybės, laikančios sielas kalėjime, o išsigelbėjimas — slaptas žinojimas.",
lore:"Antrojo amžiaus gnostikams pasaulio blogis reiškė, kad kūrėjas negalėjo būti geras: tikrasis Dievas yra tolimas, o mus valdo apgavikas Jaldabaotas su tarnais archontais. Tai seniausias pilnai suformuluotas variantas idėjos, kad tikrovė yra apgaulė, o valdovai — ne žmonės. Beveik visos ezoterinės sąmokslo teorijos yra šios schemos perpasakojimai kitais žodžiais."},

{id:"th_atlantida",l:"Atlantidos pseudoistorija",t:"teorija",y:1882,st:"paneigta",
k:"Prieš potvynį esą egzistavo aukšta civilizacija, kurios išlikę žyniai perdavė žinias visoms vėlesnėms kultūroms.",
lore:"Platonas Atlantidą aprašė kaip moralinę alegoriją apie išpuikusią galią. Po dviejų tūkstantmečių Ignatius Donnelly pavertė ją tyrimo objektu, o Blavatskaja — ezoterinės istorijos etapu. Atlantida yra motina visų prarastos civilizacijos versijų: iš jos auga Lemūrija, Hiperborėja, senovės astronautai ir Tartarija."},

{id:"th_lemurija",l:"Lemūrija ir Mu",t:"teorija",y:1888,st:"paneigta",
k:"Ramiajame ar Indijos vandenyne esą buvo dar senesnis nuskendęs žemynas su dvasiškai pažengusia rase.",
lore:"Lemūrija gimė kaip rimta XIX a. zoologų hipotezė lemūrų paplitimui paaiškinti, dar prieš žinant apie žemynų dreifą. Teosofai ją nedelsdami pasisavino kaip trečiosios šaknų rasės namus. Šiandien Lemūrija gyvena New Age aplinkoje kaip prarasto dvasingumo simbolis."},

{id:"th_hiperboreja",l:"Hiperborėja",t:"teorija",y:1908,st:"paneigta",
k:"Šiaurėje esą buvo arijų prokalbės ir prorasės tėvynė, iš kurios kilo tikroji civilizacija.",
lore:"Antikinė poetinė šalis anapus šiaurės vėjo XX a. pradžioje tapo rasinės mistikos ašimi. Guido von Listo ir ariosofų rankose ji virto įrodymu, kad šiaurės tautos yra pirminės. Ta pati konstrukcija vėliau grįžo į Nacių okultizmą ir šiuolaikinį radikalų tradicionalizmą."},

{id:"th_agartha",l:"Agartha ir Šambala",t:"teorija",y:1873,st:"nepatikrinama",
k:"Po Azijos kalnais esą slypi paslėpta karalystė, valdoma pasaulio karaliaus ir saugoma išminčių.",
lore:"Prancūzas Saint-Yves d'Alveydre aprašė požeminę Agartą kaip idealią valdymo sistemą, o Ossendowskis 1922 m. pridėjo Pasaulio karalių. Tibetietiška Šambala buvo sulydyta su ja. Ši karalystė paaiškina, kodėl vidinės Žemės motyvas taip lengvai jungiasi su politine valdžia: požemyje sėdi ne pabaisos, o tikroji vyriausybė."},

{id:"th_tuscia",l:"Tuščiavidurė Žemė",t:"teorija",y:1818,st:"paneigta",
k:"Žemė esą tuščiavidurė, su angomis ties poliais ir gyvenamu vidiniu pasauliu.",
lore:"Johnas Cleves Symmesas 1818 m. rimtai siūlė ekspediciją prie ašigalio angos. Iš mokslinės hipotezės liekanų išaugo okultinė geografija: viduje gyvena Agartos gyventojai, Vril-ya, dero arba nacių bazė. Šiandien ji dažniausiai pasirodo kaip plokščios Žemės ir Antarktidos teorijų priedas."},

{id:"th_shaver",l:"Shaverio paslaptis",t:"teorija",y:1945,st:"paneigta",
k:"Urvuose po žeme esą gyvena išsigimusios būtybės dero, kurios senovės mašinomis kankina paviršiaus žmoniją.",
lore:"1945 m. žurnalas Amazing Stories paskelbė Richardo Shaverio pasakojimus kaip tikrus prisiminimus, ir tiražas šoko į viršų. Skaitytojai ėmė siųsti savo patirtis. Tai pirmasis dokumentuotas atvejis, kai leidybinis triukas per vienerius metus pagimdė tikinčiųjų bendruomenę — ir tiesioginė NSO bumo, prasidėjusio po dvejų metų, repeticija."},

{id:"th_vril",l:"Vril energija",t:"teorija",y:1871,st:"paneigta",
k:"Egzistuoja esą paslėpta visuotinė jėga vril, kurią valdo požeminė rasė ir slaptos draugijos.",
lore:"Vril išgalvojo romanistas Bulwer-Lyttonas 1871 m. mokslinės fantastikos knygoje. Dalis okultistų nusprendė, kad autorius užšifravo tikrą žinojimą, ir vril tapo tikra jėga teosofų bei vokiečių ezoterikų raštuose. Tai vadovėlinis fikcijos grįžtamojo ryšio pavyzdys: išgalvota sąvoka per penkiasdešimt metų virsta doktrina."},

{id:"th_juodoji_saule",l:"Juodoji saulė",t:"teorija",y:1991,st:"paneigta",
k:"Slaptas okultinis simbolis esą žymi paslėptą arijų energijos šaltinį ir SS ezoterinę programą.",
lore:"Ornamentas Vėvelsburgo pilies grindyse buvo įrengtas prie SS, tačiau pavadinimą ir mistinę reikšmę jam suteikė pokario autoriai — pirmiausia 1991 m. ezoteriniame romane. Šiandien tai vienas dažniausių neonacių ženklų, kurio „senovinė“ kilmė yra visiškai išgalvota."},

{id:"th_saknurases",l:"Šaknų rasių doktrina",t:"teorija",y:1888,st:"paneigta",
k:"Žmonija esą praeina septynias rasių pakopas, kiekviena su savo žemynu ir dvasine misija.",
lore:"Blavatskajos schema iš Slaptosios doktrinos sutalpino Lemūriją, Atlantidą ir dabartinę rasę į vieną ciklą. Ji buvo pateikta kaip dvasinė, ne biologinė hierarchija, tačiau formos pakako: vokiečių ariosofai ją perskaitė rasiškai ir gavo mistinį rasizmo pagrindą."},

{id:"th_ariosofija",l:"Ariosofija",t:"teorija",y:1905,st:"paneigta",
k:"Arijų rasė esą turi šventą runų žinojimą, kurį sunaikino svetimos giminės ir religijos.",
lore:"Guido von Listas ir Jörgas Lanzas sujungė teosofiją, runas ir rasinę biologiją į Vienos okultinę subkultūrą. Iš jos išaugo Thule draugija, o per ją — dalis ankstyvos nacių simbolikos. Istorikai sutaria, kad ariosofija nacizmo nesukūrė, bet suteikė jam mitologinį žodyną."},

{id:"th_naziufo",l:"Nacių NSO ir Antarktida",t:"teorija",y:1950,st:"paneigta",
k:"Naciai esą sukūrė skraidančias lėkštes ir po karo pasitraukė į slaptą bazę po Antarktidos ledu.",
lore:"Sėklos realios: vokiečių 1938 m. ekspedicija į Antarktidą ir 1946 m. JAV operacija Highjump. Pokario spauda pridėjo diskus, o 1970-aisiais ezoteriniai leidėjai — vidinę Žemę ir vril. Šiandien šis pasakojimas veikia kaip tiltas tarp NSO temos ir neonacių ezoterikos."},

{id:"th_pakylėtieji",l:"Pakylėtieji mokytojai",t:"teorija",y:1880,st:"nepatikrinama",
k:"Slapta nemirtingų išminčių brolija esą nematomai vadovauja žmonijos evoliucijai.",
lore:"Blavatskaja tvirtino gaunanti laiškus iš Mahatmų Himalajuose; Alice Bailey ir vėlesnės New Age srovės pratęsė hierarchiją su Saint Germainu ir Sanat Kumara. Struktūriškai tai geranoriškas iliuminatų atspindys: taip pat slaptas, taip pat visagalis elitas, tik neva vedantis į šviesą."},

{id:"th_anunakiai",l:"Anunakiai ir Nibiru",t:"teorija",y:1976,st:"paneigta",
k:"Šumerų dievai esą buvo nežemiška rasė iš planetos Nibiru, sukūrusi žmones kaip darbo jėgą aukso kasykloms.",
lore:"Zecharia Sitchinas skelbėsi verčiantis šumerų lenteles, tačiau asiriologai jo skaitymus atmeta kaip savavališkus. Sistema pasirodė nepaprastai vaisinga: ji paaiškina žmogaus kilmę, elito teisę valdyti ir apokaliptinį grafiką vienu ypu. Iš jos tiesiogiai išaugo Ickeʼo reptiloidai ir Nibiru katastrofos laukimas."},

{id:"th_ancientaliens",l:"Senovės astronautai",t:"teorija",y:1968,st:"paneigta",
k:"Piramides, Naskos linijas ir megalitus esą pastatė ar padėjo pastatyti nežemiški lankytojai.",
lore:"Erichas von Dänikenas 1968 m. pavertė šią mintį pasauliniu bestseleriu. Argumentas visada tas pats: senovės žmonės negalėjo to padaryti patys. Archeologai tai vadina kolonijine prielaida, nes objektai, kurių statytojais abejojama, beveik visada yra ne Europoje."},

{id:"th_tartarija",l:"Tartarijos imperija",t:"teorija",y:2016,st:"paneigta",
k:"Esą egzistavo pasaulinė pažangi Tartarijos imperija, ištrinta iš istorijos, o jos pastatai perduoti kaip mūsų.",
lore:"Senuose Europos žemėlapiuose Tartarija tikrai žymėta — tai buvo bendrinis Vidurinės Azijos pavadinimas. Interneto bendruomenė XXI a. pavertė kartografinę etiketę imperija, kurios architektūrą neva pasisavino XIX a. Vakarai. Tai naujausia didelė teorija atlase ir gryniausias pavyzdys, kaip Atlantidos šablonas atgimsta su nuotraukų archyvais vietoje mitų."},

{id:"th_mudflood",l:"Purvo potvynis",t:"teorija",y:2018,st:"paneigta",
k:"XIX a. pasaulį esą užliejo purvo katastrofa, palaidojusi pastatų pirmuosius aukštus ir ištrynusi atmintį.",
lore:"Įrodymu laikomi pusiau po žeme esantys langai, kurie iš tikrųjų yra įprasti rūsių šviesduobės ir kelio lygio pakilimai. Teorija visada keliauja kartu su Tartarija ir aptarnauja tą patį poreikį — įtarimą, kad oficiali chronologija meluoja."},

{id:"th_fantominis",l:"Fantominis laikas",t:"teorija",y:1991,st:"paneigta",
k:"Ankstyvųjų viduramžių trys šimtmečiai esą niekada neįvyko, o jų dokumentai suklastoti.",
lore:"Heribertas Illigas teigė, kad 614–911 m. buvo pridėti klastojant kalendorių. Dendrochronologija, Saulės užtemimų įrašai ir Kinijos bei arabų šaltiniai tai paneigia. Ji svarbi kaip Vakarų atitikmuo Fomenkos naujajai chronologijai."},

{id:"th_fomenko",l:"Naujoji chronologija",t:"teorija",y:1980,st:"paneigta",
k:"Antika esą išgalvota Renesanso metu, o tikroji istorija prasideda vos prieš tūkstantį metų.",
lore:"Matematikas Anatolijus Fomenko pasitelkė statistinius tekstų palyginimus ir paskelbė, kad Roma, Graikija ir Egiptas yra viduramžių istorijos atspindžiai. Sistema reikalauja, kad būtų suklastoti visi pasaulio archyvai vienu metu. Ji populiari kaip nacionalistinės istorijos perrašymo įrankis."},

{id:"th_plokscia",l:"Plokščia Žemė",t:"teorija",y:1849,st:"paneigta",
k:"Žemė esą plokščias diskas po kupolu, o kosmoso programos yra sąmoninga apgaulė.",
lore:"Samuelis Rowbothamas XIX a. viduryje pradėjo zetetinį judėjimą, remdamasis pažodiniu Biblijos skaitymu ir kanalo eksperimentu. XXI a. YouTube ją prikėlė kaip pasitikėjimo institucijomis testą: svarbiausia ne disko forma, o teiginys, kad visos mokslo įstaigos meluoja kartu. Iš čia ji ateina į beveik kiekvieną modernią teoriją kaip pamatinis nepasitikėjimo sluoksnis."},

{id:"th_ledosiena",l:"Ledo siena ir Antarktida",t:"teorija",y:1956,st:"paneigta",
k:"Antarktida esą ne žemynas, o ledo siena aplink diską, todėl į ją neleidžiama laisvai keliauti.",
lore:"1959 m. Antarkties sutartis, ribojanti karinę veiklą, buvo perskaityta kaip draudimas žmonėms artintis prie krašto. Ta pati vieta tuo pat metu tarnauja nacių bazės ir vidinės Žemės angos teorijoms — retas atvejis, kai trys skirtingos sistemos naudoja tą patį geografinį tašką."},

{id:"th_menulis_dirbtinis",l:"Dirbtinis Mėnulis",t:"teorija",y:1975,st:"paneigta",

k:"Marse esą yra dirbtinių statinių ir veido skulptūra, kurią NASA slepia.",

{id:"th_simuliacija",l:"Simuliacijos hipotezė",t:"teorija",y:2003,st:"nepatikrinama",

{id:"th_malachijas",l:"Šv. Malachijo pranašystė",t:"teorija",y:1595,st:"paneigta",

{id:"b_pilkieji",l:"Pilkieji",t:"butybe",y:1961,st:"mitinis",

{id:"b_nordikai",l:"Nordikai",t:"butybe",y:1952,st:"mitinis",

{id:"b_dero",l:"Dero",t:"butybe",y:1945,st:"mitinis",

{id:"b_vrilya",l:"Vril-ya",t:"butybe",y:1871,st:"fiktyvus",

{id:"b_mib",l:"Vyrai juodais",t:"butybe",y:1953,st:"mitinis",

{id:"b_moloch",l:"Molochas",t:"butybe",y:1980,st:"mitinis",

{id:"b_stgermain_b",l:"Pakylėtieji mokytojai",t:"butybe",y:1880,st:"mitinis",

lore:"Iš maždaug 195 tūkst. Lietuvos žydų išgyveno vos keli procentai. Žudynės vyko daugiausia vietose, netoli gyvenamųjų vietų, dalyvaujant vokiečių struktūroms ir vietiniams kolaborantams. Tai dokumentuota faktų visuma, o ne interpretacija — ir kartu mazgas, aplink kurį regione susiformavo daugiausia iškraipymų."},

{id:"e_deportacijos",l:"Sovietiniai trėmimai",t:"faktas",y:1941,st:"faktas",
k:"1941 ir 1944–1953 m. iš Lietuvos ištremta apie 130 tūkst. žmonių, dešimtys tūkstančių kalinta lageriuose.",
lore:"1941 m. birželį per kelias dienas ištremta apie 17 tūkst. žmonių, pokariu trėmimai kartojosi bangomis. Sovietai juos pateisino sąmokslo kalba: aukos buvo įvardijamos kaip slapto priešiško tinklo dalyviai. Tai svarbiausia regiono faktinė sėkla — ji paaiškina, kodėl nepasitikėjimas valstybės institucijomis čia turi istorinį pagrindą."},

{id:"e_gydytoju_byla",l:"Gydytojų byla",t:"faktas",y:1953,st:"faktas",
k:"1953 m. SSRS paskelbtas prasimanytas kaltinimas grupei gydytojų, daugiausia žydų, dėl vadovų nuodijimo.",
lore:"Kampanija buvo antisemitinė iš esmės ir nutrūko tik po Stalino mirties tų pačių metų kovą; kaltinimai oficialiai pripažinti sufabrikuotais. Tai vienintelis atvejis, kai valstybė pati paskelbė sukūrusi sąmokslo teoriją. Modelis — gydytojai kaip slapti nuodytojai — regione vėliau atgimė pandemijos metu."},

{id:"e_sausio13_byla",l:"Sausio 13-osios byla",t:"faktas",y:2019,st:"faktas",
k:"2019 m. Vilniaus apygardos teismas nuteisė dešimtis buvusių SSRS pareigūnų už karo nusikaltimus 1991 m. sausį.",
lore:"Naktį iš sausio 12 į 13 d. prie Vilniaus televizijos bokšto ir radijo bei televizijos komiteto žuvo 14 civilių, šimtai buvo sužeisti. Įvykiai užfiksuoti gausioje vaizdo medžiagoje, liudijimuose ir teismo sprendime. Būtent šio fakto tvirtumas daro jo neigimą tokiu ryškiu atveju."},

{id:"e_mgbaltic",l:"„Valstybės užvaldymo“ byla",t:"faktas",y:2023,st:"faktas",
k:"Teismai nustatė realią prekybos poveikiu ir kyšininkavimo schemą tarp stambaus verslo ir politikų.",
lore:"Ilgai trukęs procesas baigėsi apkaltinamaisiais nuosprendžiais dėl politinės korupcijos. Tai retas atvejis, kai dalis to, kas anksčiau buvo laikoma sąmokslo teorija apie tikruosius šalies šeimininkus, gavo teisminį patvirtinimą — tačiau daug siauresnės apimties, nei teigia platesnis naratyvas."},

{id:"e_matukas",l:"Vaiko žūtis ir 2018 m. reforma",t:"faktas",y:2017,st:"faktas",
k:"Po ketverių metų berniuko žūties smurto aplinkoje Lietuvoje buvo sugriežtinta vaiko teisių apsaugos sistema.",
lore:"2017 m. įvykis sukėlė visuomenės sukrėtimą ir greitą įstatymo pakeitimą, kuriam trūko pereinamojo laikotarpio. Kelios skubotai atliktos paėmimo iš šeimų procedūros tapo priešingos reakcijos šaltiniu. Tai faktinė sėkla naratyvui apie valstybę, atiminėjančią vaikus."},

// ================= NARATYVAI: ATMINTIS IR KARAS =================
{id:"th_dvigubas_genocidas",l:"„Dvigubo genocido“ naratyvas",t:"teorija",y:1990,st:"ginčytina",
k:"Nacių ir sovietų nusikaltimai pateikiami kaip lygiaverčiai, o iš to kartais išvedama, kad Holokaustas Lietuvoje esą buvo atsakas į sovietizaciją.",
lore:"Švelnioji versija yra teisėta istorinė pozicija: du totalitarizmai regione veikė vienas po kito ir abu paliko masines aukas. Griežtoji versija peržengia ribą, kai iš palyginimo daroma priežastis ir Holokaustas tampa paaiškinamas per ankstesnę okupaciją. Būtent ties šia riba vyksta pagrindiniai istorikų ginčai regione, ir būtent per ją į viešumą sugrįžta senasis antisemitinis modulis."},

{id:"th_zydkomunistai",l:"„Žydai-komunistai“",t:"teorija",y:1941,st:"paneigta",
k:"Žydų bendruomenė esą kolektyviai atsakinga už sovietinę okupaciją ir trėmimus.",
lore:"Naratyvas buvo aktyviai skleidžiamas 1941 m. vokiečių propagandos ir vietinių leidinių, o istoriškai neatlaiko patikros: sovietinėse struktūrose žydų dalis nebuvo neproporcinga, o trėmimai palietė ir pačią žydų bendruomenę. Tai regioninė judeobolševizmo mito atmaina, tiesiogiai naudota žudynėms pateisinti ir pačiu žudynių metu."},

{id:"th_burzuaziniai",l:"„Buržuaziniai nacionalistai“",t:"teorija",y:1944,st:"paneigta",
k:"Sovietinė konstrukcija, pagal kurią pasipriešinimas buvo Vakarų žvalgybų valdomas slaptas tinklas.",
lore:"Tai reta rūšis: valstybės pagaminta ir privaloma sąmokslo teorija. Ji leido bet kurį nepatogų žmogų priskirti nematomam priešiškam tinklui ir taip pateisinti trėmimus bei bausmes. Struktūriškai identiška vakarietiškoms teorijoms — slaptas centras, nematomi agentai, visuotinis persmelkimas — tik platinama per mokyklos vadovėlius."},

{id:"th_partizanai_banditai",l:"Partizanų diskreditavimo naratyvas",t:"teorija",y:1945,st:"paneigta",
k:"Pokario pasipriešinimo dalyviai esą buvo tik banditai ir nacių talkininkai, o ne rezistencija.",
lore:"Sovietinis konstruktas, po 1990 m. atgijęs Kremliaus komunikacijoje. Jo galia ta, kad naudoja tikrus faktus: partizanų kare tikrai būta smurto prieš civilius, o kai kurių dalyvių biografijos prieštaringos. Naratyvas iš atskirų atvejų daro visumos apibrėžimą ir taip panaikina skirtumą tarp rezistencijos ir kolaboravimo."},

{id:"th_sausio13",l:"Sausio 13-osios revizionizmas",t:"teorija",y:2010,st:"paneigta",
k:"Prie televizijos bokšto esą šaudė ne sovietų kariuomenė, o „saviškiai į savus“, siekdami provokacijos.",
lore:"Naratyvas plito Rusijos žiniasklaidoje ir turėjo atgarsių Lietuvoje. Jį paneigia balistikos ekspertizės, gausi vaizdo medžiaga, šimtai liudijimų ir 2019 m. teismo sprendimas. Lietuvoje viešas neigimas užtraukia baudžiamąją atsakomybę — tai vienas iš nedaugelio atvejų atlase, kai teorija reguliuojama įstatymu."},

{id:"th_kremliaus_baltija",l:"Kremliaus naratyvai apie Baltijos šalis",t:"teorija",y:2004,st:"paneigta",
k:"Baltijos valstybės esą yra dirbtiniai NATO dariniai, valdomi iš išorės ir puoselėjantys fašizmą.",
lore:"Tai ne viena teorija, o koordinuota naratyvų šeima: apie neva atgimstantį nacizmą, dirbtinę nepriklausomybę, ekonominį žlugimą ir NATO poligoną. Ji veikia kaip regioninis Naujosios pasaulio tvarkos atitikmuo su apversta ašimi — čia slaptas elitas yra Vakarai. Dokumentuota ES ir NATO strateginės komunikacijos tyrimuose."},

{id:"th_rusakalbiai",l:"„Rusakalbių diskriminacijos“ naratyvas",t:"teorija",y:1992,st:"ginčytina",
k:"Baltijos šalyse esą vykdoma sisteminė rusakalbių gyventojų diskriminacija ir prievartinė asimiliacija.",
lore:"Čia riba plona ir svarbi. Realios pilietybės bei kalbos politikos problemos Latvijoje ir Estijoje egzistavo, buvo kritikuotos tarptautinių institucijų ir iš dalies taisytos. Naratyvas šias problemas išpučia iki organizuoto naikinimo plano ir naudoja kaip užsienio politikos įrankį. Atlase pažymėta kaip ginčytina būtent dėl to, kad turi tikrą, bet nepalyginamai siauresnį pagrindą."},

{id:"th_bronzinis",l:"Bronzinės nakties naratyvai",t:"teorija",y:2007,st:"ginčytina",
k:"2007 m. sovietinio paminklo perkėlimas Taline esą buvo suplanuota kampanija prieš rusakalbius.",
lore:"Perkėlimas sukėlė riaušes, žuvo vienas žmogus, o po jų Estiją užgriuvo viena pirmųjų valstybės masto kibernetinių atakų istorijoje. Įvykis tapo atskaitos tašku abiem pusėms: Vakaruose — hibridinio karo pradžia, Kremliaus komunikacijoje — įrodymas apie fašizmo atgimimą. Tai geriausias regiono pavyzdys, kaip vienas įvykis maitina du priešingus naratyvus."},

// ================= NARATYVAI: VIDAUS POLITIKA IR MORALINĖ PANIKA =================
{id:"th_uzvaldymas",l:"„Valstybės užvaldymo“ naratyvas",t:"teorija",y:2006,st:"ginčytina",
k:"Šalį esą realiai valdo verslo grupių, teisėsaugos ir žiniasklaidos klanai, o rinkimai nieko nekeičia.",
lore:"Švelnioji versija — pagrįsta politinės korupcijos kritika, iš dalies patvirtinta teismų. Griežtoji versija tampa vietiniu giliosios valstybės variantu: bet kuris sprendimas paaiškinamas nematomu susitarimu, o įrodymų nebuvimas laikomas įrodymu. Tai pagrindinis Lietuvos naratyvas, jungiantis realią problemą su nepatikrinama išvada."},

{id:"th_garliava",l:"Garliavos byla",t:"teorija",y:2009,st:"paneigta",
k:"Aplink vaiko globos konfliktą susiformavo įsitikinimas, kad valstybė dangsto įtakingų asmenų prievartos tinklą.",
lore:"Byloje būta smurtinių mirčių ir ilgo teisminio proceso; kaltinimai dėl seksualinės prievartos daugkartinių ekspertizių ir tyrimų metu nepasitvirtino. 2012 m. vaiko perdavimas motinai buvo filmuojamas ir transliuojamas, ir būtent tas vaizdas sukūrė ilgaamžę bendruomenę. Struktūriškai tai artimiausias lietuviškas atitikmuo satanistinės panikos ir Pizzagate linijai — su ta pačia mechanika: vaikas, elitas, dangstymas, netikėjimas ekspertize."},

{id:"th_vaiku_atiminejimas",l:"„Valstybė atiminėja vaikus“",t:"teorija",y:2018,st:"paneigta",
k:"Vaiko teisių tarnybos esą pagal planą atiminėja vaikus iš normalių šeimų, vykdydamos užsienio nurodymus.",
lore:"Kilo po 2018 m. reformos, kai keli skuboti paėmimo atvejai pateko į viešumą. Iš administracinio trūkumo išaugo pasakojimas apie tikslinę programą, dažnai su nuoroda į Norvegijos tarnybas ar JT dokumentus. Vėliau ši linija susijungė su pandeminiu ir „genderizmo“ naratyvais į vieną bendrą temą apie šeimos naikinimą."},

{id:"th_gender",l:"„Genderizmo“ naratyvas",t:"teorija",y:2013,st:"paneigta",
k:"Lyčių lygybės politika ir Stambulo konvencija esą yra slapta programa panaikinti šeimą ir tautą.",
lore:"Regione paplito diskutuojant dėl Stambulo konvencijos, kurios Lietuva pasirašė, bet neratifikavo. Naratyvas tiesiogiai paveldi „kultūrinio marksizmo“ struktūrą: akademinė sąvoka paverčiama centralizuota operacija su nurodymų centru užsienyje. Jis sujungė konservatyvias bendruomenes su pandeminiu judėjimu."},

{id:"th_covid_lt",l:"Pandeminis judėjimas Lietuvoje",t:"teorija",y:2021,st:"paneigta",
k:"Galimybių pasas ir skiepijimas esą buvo pasaulinės kontrolės programos vietinis etapas.",
lore:"2021 m. rugpjūčio 10 d. protestas prie Seimo peraugo į susirėmimus — tai buvo aiškiausias momentas, kai tarptautinės teorijos įgavo vietinį pavidalą. Judėjimas sujungė vakcinų, Didžiojo perkrovimo, vaikų atiminėjimo ir genderizmo linijas į vieną. Būtent čia matyti, kaip globalus turinys per kelias savaites persirašo į vietinę kalbą."},

// ================= PROISTORĖS MITAI =================
{id:"th_baltu_proistore",l:"Baltų proistorės mitas",t:"teorija",y:1972,st:"paneigta",
k:"Baltai esą yra seniausia Europos tauta, kurios kalba ir kultūra buvo visų kitų pagrindas, o tai esą nuslėpta.",
lore:"Remiasi tikru faktu — lietuvių kalba tikrai išlaikė daug archajiškų indoeuropietiškų bruožų ir yra svarbi lyginamajai kalbotyrai. Iš to daroma šuolis prie teiginio, kad baltai buvo Europos kultūros šaltinis, o akademinis pasaulis tai slepia. Tai regioninė Atlantidos ir Hiperborėjos šeimos atmaina: prarasta didybė plius sąmoningas nutylėjimas."},

{id:"th_gotai_baltai",l:"„Gotai buvo baltai“",t:"teorija",y:1999,st:"paneigta",
k:"Antikos ir ankstyvųjų viduramžių gotai esą buvo baltų gentys, o istorija perrašyta germanų naudai.",
lore:"Teiginys remiasi savitais senųjų šaltinių skaitymais ir vietovardžių gretinimais. Kalbotyra ir archeologija gotus patikimai sieja su rytų germanų grupe. Metodas — panašumas reiškia tapatybę — yra tas pats, kurį XIX a. naudojo Donnelly Atlantidai įrodyti."},

// ================= ASMENYS =================
{id:"p_gedgaudas",l:"Česlovas Gedgaudas",t:"asmuo",y:1972,st:"realus",
k:"Išeivijos autorius, 1972 m. paskelbęs alternatyvią baltų proistorės versiją.",
lore:"Meksikoje išleista knyga „Mūsų praeities beieškant“ tapo išeivijos, o vėliau ir Lietuvos alternatyviosios istorijos pamatiniu tekstu. Jis rėmėsi laisvais etimologiniais gretinimais ir siūlė baltus laikyti Europos senovės ašimi. Akademinė kalbotyra jo metodo nepriėmė, tačiau knyga iki šiol perleidžiama ir cituojama."},

{id:"p_statkute",l:"Jūratė Statkutė de Rosales",t:"asmuo",y:1999,st:"realus",
k:"Venesuelos lietuvė autorė, teigusi, kad gotai buvo baltų kilmės.",
lore:"Jos knygos apie senuosius šaltinius sulaukė didelio populiarumo Lietuvoje ir buvo pristatomos kaip nuslėptos istorijos atskleidimas. Istorikai ir kalbininkai vertinimus atmetė kaip metodologiškai nepagrįstus, tačiau tema tvirtai įsitvirtino populiariojoje kultūroje."},

{id:"p_gimbutiene",l:"Marija Gimbutienė",t:"asmuo",y:1974,st:"realus",
k:"Pripažinta archeologė, kurios dalis idėjų vėliau buvo perimtos ezoterinės literatūros.",
lore:"Jos kurganų hipotezė apie indoeuropiečių plitimą tebėra rimtai svarstoma ir iš dalies patvirtinta genetikos tyrimų. Kita jos tezė — apie taikią deivę garbinusią Senosios Europos civilizaciją — akademiškai liko ginčytina, tačiau tapo itin populiari New Age ir naujosios pagonybės aplinkoje. Atlase ji svarbi kaip pavyzdys, kad mokslininkas nėra atsakingas už tai, kas su jo darbu padaroma vėliau."},

{id:"p_noreika",l:"Jonas Noreika",t:"asmuo",y:1941,st:"ginčytina",
k:"Karo meto pareigūnas ir vėliau antisovietinio pasipriešinimo dalyvis, dėl kurio vaidmens Holokauste vyksta ginčas.",
lore:"Vokiečių okupacijos metais ėjo Šiaulių apskrities viršininko pareigas ir pasirašė dokumentus, susijusius su žydų izoliavimu bei turto perėmimu; 1947 m. sovietų sušaudytas už pasipriešinimą. Genocido centras ilgai gynė jo reputaciją, o istorikai ir aukų palikuonys pateikė dokumentus, rodančius dalyvavimą. Tai svarbiausias regiono atvejis, kur atminties politika ir archyviniai dokumentai susiduria tiesiogiai."},

{id:"p_paleckis",l:"Algirdas Paleckis",t:"asmuo",y:2011,st:"realus",
k:"Politikas, viešai paskleidęs Sausio 13-osios revizionistinę formuluotę ir vėliau nuteistas už šnipinėjimą.",
lore:"2011 m. jam buvo pareikšti kaltinimai dėl sovietinės agresijos neigimo, byla ėjo per kelias instancijas. 2021 m. jis nuteistas kalėti už šnipinėjimą Rusijos naudai. Atlase svarbus kaip mazgas, kur naratyvo skleidimas ir dokumentuota valstybinė veikla persidengia — retas atvejis, kai toks ryšys apskritai įrodytas teisme."},

{id:"p_megre",l:"Vladimiras Megre",t:"asmuo",y:1996,st:"realus",
k:"„Skambančių kedrų“ knygų serijos autorius, sukūręs Anastasijos judėjimą.",
lore:"1996 m. pradėta serija pasakoja apie sibirietę atsiskyrėlę, turinčią senovinį žinojimą. Judėjimas skatina steigti šeimos sodybas ir turi tikrų ekologinių bendruomenių, tačiau vėlesnėse knygose atsiranda sąmokslinis ir antisemitinis sluoksnis apie slaptus žmonijos valdytojus. Baltijos šalyse tai bene labiausiai paplitusi posovietinės ezoterikos forma."},

// ================= GRUPĖS =================
{id:"g_genocido_centras",l:"Genocido ir rezistencijos centras",t:"grupe",y:1992,st:"reali",
k:"Valstybinė įstaiga, tirianti okupacijų nusikaltimus ir teikianti oficialius istorinius vertinimus.",
lore:"Jos išvados turi teisinę galią — nuo jų priklauso statusai, atminimo ženklai ir vertinimai. Būtent todėl ji atsidūrė ginčų dėl karo meto figūrų centre: institucija vienu metu yra ir tyrimo įstaiga, ir atminties politikos dalyvė. Atlase svarbi kaip pavyzdys, kad oficialus vertinimas nėra tas pats, kas istorinis tyrimas."},

{id:"g_anastasija",l:"Skambančių kedrų judėjimas",t:"grupe",y:1997,st:"reali",
k:"Posovietinis ekologinis-ezoterinis judėjimas, kuriantis šeimos sodybas pagal Megrės knygas.",
lore:"Turi realių bendruomenių Rusijoje, Baltijos šalyse ir kitur. Dalyviams tai dažniausiai gyvenimo būdo praktika, tačiau doktrinoje yra sluoksnis apie slaptus pasaulio valdytojus ir prarastą pirmykštį žinojimą. Tai geras pavyzdys, kaip sąmokslinis turinys keliauja ne per politiką, o per sodininkystės ir sveikatos temas."},

// ================= TEKSTAI =================
{id:"t_gedgaudas",l:"Mūsų praeities beieškant",t:"tekstas",y:1972,st:"pirminis",
k:"Knyga, padėjusi pamatą alternatyviai baltų proistorės tradicijai.",
lore:"Išleista Meksikoje, į Lietuvą plačiau atkeliavo po 1990 m. ir buvo perleista kelis kartus. Būtent ji suformavo žanro kalbą: etimologiniai gretinimai, nuoroda į nuslėptus šaltinius ir prielaida, kad akademinė istorija tarnauja svetimiems interesams."},

{id:"t_dulles",l:"„Dulleso planas“",t:"tekstas",y:1993,st:"klastote",
k:"Klastotė, pateikiama kaip JAV žvalgybos vadovo planas sunaikinti sovietinę tautą iš vidaus per kultūrą.",
lore:"Tekstas plačiai cirkuliuoja posovietinėje erdvėje nuo XX a. paskutinio dešimtmečio. Tyrėjai nustatė, kad jo formuluotės atkartoja sovietinio romano ištrauką, o jokio Allen Dulles dokumento neegzistuoja. Funkciškai tai regioninis Protokolų atitikmuo: trumpas tekstas, paaiškinantis visus visuomenės pokyčius kaip svetimą planą."},

// ================= MOTYVAS =================
{id:"m_auka_tauta",l:"Maža tauta didžiųjų žaidime",t:"motyvas",y:1795,st:"motyvas",
k:"Šalies istorija paaiškinama kaip išorės jėgų sprendimų seka, o vietiniai veikėjai netenka savarankiškumo.",
lore:"Regione šis motyvas turi neįprastai tvirtą faktinį pagrindą: padalijimai, okupacijos ir slapti protokolai tikrai buvo. Būtent todėl jis pavojingas — nuo pagrįsto istorinio suvokimo iki teiginio, kad ir šiandien viską lemia nematomas išorės centras, žingsnis yra labai trumpas. Tai pagrindinis vietinis įvažiavimas į visas globalias teorijas."}

lore:"Sandorio nuostoliai reali; ginčas dėl motyvų. Oficialus paaiškinimas — geopolitinis pasirinkimas ir derybinis nemokšiškumas. Teorija tai pakeičia asmeniniu suinteresuotumu ir slaptu susitarimu.",
f:"Kalbama, kad tai pirmuoju atveju, kai buvo aiškiai matyti, kas iš tikrųjų priima sprendimus. Pasakojama apie lagaminus, apie tai, kad sutarties priedai iki šiol įslaptinti, ir apie tai, kad tikroji kaina buvo NATO narystė. Šis mazgas tokiuose pokalbiuose jungia Landsbergių ašį su „amerikonų valdymo“ linija."},

{id:"th_snoras",l:"Snoro nacionalizavimas kaip užsakymas",t:"teorija",y:2011,st:"nepatikrinama",
k:"Banko perėmimas esą buvo ne priežiūros veiksmas, o operacija prieš savininkus dėl jų valdytos žiniasklaidos ir politinių ryšių.",
lore:"2011 m. bankas nacionalizuotas, savininkams pareikšti kaltinimai, jie pasitraukė į užsienį. Bankas valdė didelį žiniasklaidos paketą — būtent tai teorijai duoda motyvą.",
f:"Kalbama taip: banką sugriovė, nes jis finansavo netinkamą laikraštį ir netinkamus politikus, o pinigai buvo išnešti anksčiau ir kitų rankomis. Ši linija dažnai jungiama su „valstybės užvaldymo“ mazgu ir naudojama kaip įrodymas, kad teisėsauga veikia pagal užsakymą."},

{id:"th_paksas",l:"Apkalta kaip perversmas",t:"teorija",y:2004,st:"nepatikrinama",
k:"Prezidento pašalinimas esą buvo klanų operacija prieš žmogų iš išorės, o ne teisinė procedūra.",
lore:"Konstitucinis Teismas nustatė šiurkščius pažeidimus, tačiau greitis ir politinė aplinka daliai visuomenės atrodė kaip susidorojimas. Priešinga versija teigia, kad tai buvo apsigynimas nuo Kremliaus įtakos.",
f:"Kalbama, kad apkalta yra atskaitos taškas: nuo jos skaičiuojama, kad rinkimai nieko nelemia. Pasakojama apie įrašus, kurių niekas negirdėjo, apie ambasadų vaidmenį ir apie tai, kad Paksas turėjo bylų aplanką ir būtent todėl neišsilaikė. Ta pati logika kaip su Trumpu ir giliąja valstybe, tik penkiolika metų anksčiau."},

// ================= UŽSIENIO RANKOS =================
{id:"th_adamkus",l:"„Prezidentas iš Amerikos“",t:"teorija",y:1998,st:"paneigta",
k:"JAV ilgai gyvenęs prezidentas esą buvo atsiųstas ir dirbo žvalgybai.",
lore:"Faktinė bazė: kelis dešimtmečius gyveno JAV, dirbo federalinėje aplinkos apsaugos agentūroje ir grįžo kandidatuoti. Aplinkosaugos tarnyba teorijoje virsta žvalgyba, o grįžimas — paskyrimu.",
f:"Kalbama, kad tai pirmasis „mūsų vietinis amerikonas“ ir šablonas visiems vėlesniems. Standartinis argumentas: niekas nemeta patogaus gyvenimo Čikagoje dėl Lietuvos, vadinasi, buvo atsiųstas. Iš čia auga visa linija apie ambasadą kaip tikrąją vyriausybę."},

{id:"th_kremliaus_agentai",l:"„Agentai visur“",t:"teorija",y:2014,st:"nepatikrinama",
k:"Bet kuri nepatogi nuomonė ar judėjimas esą yra Kremliaus finansuojamas ir koordinuojamas.",
lore:"Skirtingai nuo daugelio mazgų, ši teorija dažniausiai sukasi ne marginalijoje, o viešojoje erdvėje. Reali įtakos operacijų veikla regione dokumentuota, tačiau naratyvas ją išplečia iki visuotinio paaiškinimo, kur nesutarimas savaime tampa įtarimu.",
f:"Kalbant apie ją vadinama veidrodine: tie patys žmonės, kurie juokiasi iš reptiloidų, apie oponentus kalba lygiai ta pačia struktūra — nematomas centras, pinigai iš išorės, nesąmoningi vykdytojai. Atlase šis mazgas naudingas būtent tuo, kad rodo, jog konspiracinė forma nepriklauso nuo politinės pusės."},

{id:"th_emigracija",l:"Tautos ištuštinimo planas",t:"teorija",y:2004,st:"paneigta",
k:"Emigracija esą nėra ekonominis reiškinys, o sąmoningai vykdomas šalies ištuštinimo projektas.",
lore:"Nuo 1990 m. Lietuva neteko apie penktadalio gyventojų — tai realus ir skaudus faktas su gerai aprašytomis ekonominėmis priežastimis. Teorija priežastis pakeičia ketinimu.",
f:"Kalbama taip: tuštinama sąmoningai, nes tuščia žemė yra prekė, o vietoje išvykusių bus atvežti kiti. Čia lietuviškas naratyvas tiesiogiai susikabina su Didžiuoju pakeitimu ir su „Dulleso planu“. Dažnai pridedama, kad Ignalinos uždarymas ir cukraus fabrikų naikinimas buvo to paties grafiko dalys."},

{id:"th_ignalina",l:"Ignalinos uždarymas",t:"teorija",y:2009,st:"nepatikrinama",
k:"Atominė elektrinė esą buvo uždaryta ne dėl saugumo, o tam, kad šalis taptų energetiškai priklausoma.",
lore:"Uždarymas buvo stojimo į ES sąlyga dėl reaktoriaus tipo — to paties, kaip Černobylyje. Ginčas dėl to, ar sąlyga buvo pagrįsta ir ar derėtasi tinkamai, yra realus ir tebevyksta.",
f:"Kalbama, kad tai antruoju Mažeikių atveju: šalis atidavė turtą pagal svetimą įsakymą, o pasirašiusieji nenukentėjo. Pasakojama, kad reaktorius buvo visiškai tvarkingas, o tikroji priežastis — kad Lietuva nebūtų elektros eksportuotoja. Jungiasi su emigracijos ir „amerikonų valdymo“ linijomis."},

{id:"th_alytus",l:"Alytaus gaisras",t:"teorija",y:2019,st:"nepatikrinama",
k:"Padangų perdirbimo įmonės gaisras esą buvo tyčinis — arba diversija, arba įrodymų naikinimas.",
lore:"2019 m. gaisras truko daugiau nei savaitę ir apnuodijo orą plačioje teritorijoje. Tyrimai svarstė ir neatsargumą, ir tyčinį padegimą.",
f:"Populiariausios dvi versijos: kad degė ne tik padangos, o tai, ką reikėjo nurašyti, ir kad tai buvo hibridinės atakos bandymas prieš reakciją. Trečia, ezoterinė versija jungia gaisrą su chemtrails linija — kad dūmų sudėtis buvo netikrinama sąmoningai."},

// ================= EZOTERINĖ LIETUVA =================
{id:"th_lt_masonai",l:"Lietuvos ložės ir klubai",t:"teorija",y:1995,st:"nepatikrinama",
k:"Šalies sprendimai esą priimami uždaruose klubuose ir atkurtose ložėse, o ne institucijose.",
lore:"Masonų ložės Lietuvoje buvo atkurtos po 1990 m., veikia ir tarptautiniai verslo klubai — tai vieša informacija. Teorija jiems priskiria sprendimų priėmimą.",
f:"Mėgstamiausias žaidimas — ieškoti ženklų: kampuočių ant pastatų, skaičių datose, geometrijos Vilniaus plane. Sąrašai, kas kuriam klubui priklauso, cirkuliuoja kaip įrodymai. Ši linija tiesiogiai jungia lietuvišką turinį su pasaulinės iliuminatų ašies ikonografija ir suteikia jai vietinį adresą."},

{id:"th_basanavicius",l:"Basanavičiaus paslaptis",t:"teorija",y:2010,st:"nepatikrinama",
k:"Tautos patriarchas esą priklausė uždaroms draugijoms, o jo mirties aplinkybės nutylimos.",
lore:"Basanavičius domėjosi ezoterika ir dalyvavo įvairiose draugijose, mirė 1927 m. vasario 16 d. Simbolinė data ir jo interesai teorijai duoda visą reikalingą medžiagą.",
f:"mirties data laikoma ne sutapimu, o žinute. Pasakojama apie jo užrašus, kurių niekas neskelbia, apie trakiškąją lietuvių kilmės teoriją kaip užšifruotą žinojimą ir apie tai, kad valstybė patriarchą pasisavino, bet jo tikrųjų pažiūrų neskelbia. Jungia baltų proistorės liniją su ložių tema."},

{id:"th_piliakalniai",l:"Piliakalnių paskirtis",t:"teorija",y:2005,st:"paneigta",
k:"Piliakalniai esą nebuvo gynybiniai — tai senovinė energetinė ar astronominė sistema.",
lore:"Archeologija piliakalniuose randa įtvirtinimų, gyvenviečių ir gaisrų pėdsakų. Teorija juos perskaito kaip tinklą, kurio paskirtis kita.",
f:"piliakalniai jungiami linijomis žemėlapyje ir lyginami su Anglijos ley liniomis. Pasakojama apie energetinius mazgus, apie tai, kad prie kai kurių nesugenda technika, ir apie tai, kad tikrieji kasinėjimų radiniai nerodomi. Su Vilniaus tema tai sudaro lietuvišką sakralinės geografijos rinkinį."},

{id:"th_vilnius_centras",l:"Vilnius kaip energetinis centras",t:"teorija",y:2004,st:"nepatikrinama",
k:"Vilnius esą stovi ypatingame geografiniame ar energetiniame taške, o miesto planas užkoduotas.",
lore:"Prie temos prisidėjo tikras faktas — netoli Vilniaus esantis Europos geografinio centro paminklas, pastatytas pagal 1989 m. skaičiavimą. Iš to išaugo ezoterinis sluoksnis apie miesto galią ir simboliką.",
f:"Kalbama taip jungia Gedimino sapną, barokinių bažnyčių išdėstymą, Trijų kryžių vietą ir tariamai masonišką senamiesčio geometriją. Pasakojama, kad miestas buvo suplanuotas kaip talismanas, o Užupis ar Bekešo kalnas yra mazgai. Tai lietuviškas atitikmuo Vašingtono plano teorijoms, ir tokiuose pokalbiuose jis dažnai taip ir pristatomas."}

{id:"th_palemonas",l:"Palemono legenda",t:"teorija",y:1520,st:"paneigta",
k:"Lietuvių didikai esą kilę iš romėnų, kurie su Palemonu pabėgo nuo Nerono ir atplaukė Nemunu.",
lore:"Legenda užrašyta XVI a. metraščiuose ir tarnavo labai konkrečiam tikslui — įrodyti bajorijos lygiavertiškumą lenkų ir kitų Europos giminių atžvilgiu. Kalbotyra ir archeologija jokio ryšio su Roma nerodo.",
f:"Kalbant apie ją gyvena kaip pirmasis įrodymas, kad istorija jau kartą buvo perrašyta — tik tąsyk savų naudai. Vieni ją laiko sąmoningu viduramžių PR, kiti — nuslėpta tiesa, kurios šaltinius sunaikino jėzuitai. Dažnai gretinama su gotų ir baltų teorija: esą kilmė iš tikrųjų dar senesnė, o Roma pridėta vėliau."},

{id:"th_krikstas",l:"Krikštas kaip istorijos perrašymas",t:"teorija",y:1387,st:"nepatikrinama",
k:"Priėmus krikščionybę esą buvo tikslingai sunaikinta senoji raštija, žinojimas ir kalendorius.",
lore:"Kad krikštas keitė kultūrą ir kad kronikas rašė nugalėtojai, yra istorinis faktas. Teorija prideda organizuotą naikinimo programą su išlikusiais paslėptais likučiais.",
f:"Kalbama taip: vienuolynai perrašė viską, o tikrieji tekstai išvežti į Romą ir Karaliaučių. Kryžiuočių kronikos laikomos ne šaltiniu, o priedanga. Ši linija tiesiogiai maitina teiginį apie sunaikintą baltų raštą ir jungiasi su Vatikano archyvų tema."},

{id:"th_baltu_rastas",l:"Sunaikintas baltų raštas",t:"teorija",y:1990,st:"paneigta",
k:"Baltai iki krikšto esą turėjo savo raštą, kuris buvo išnaikintas be pėdsakų.",
lore:"Jokių pirminių baltiškų rašto paminklų nerasta, o kaimyninės kultūros apie tokį raštą neužsimena. Kaip įrodymai pateikiami ženklai ant verpstukų, audimo raštai ir akmenų dubenys.",
f:"Kalbant apie raštą, jis dažnai vadinamas runomis ir siejamas su germanų bei skandinavų sistemomis, o kartais su Vinčos ženklais. Pagrindinis argumentas — tokia sena kalba negalėjo neturėti rašto. Iš čia trumpas kelias iki teiginio, kad Europos raštija apskritai prasidėjo čia."},

{id:"th_pozeminis_vilnius",l:"Požeminis Vilnius",t:"teorija",y:1960,st:"nepatikrinama",
k:"Po senamiesčiu esą driekiasi tunelių tinklas, jungiantis bažnyčias, rūmus ir pilis.",
lore:"Rūsiai, bastėjos ir atskiros požeminės patalpos yra realios ir kai kurios lankomos. Vientiso tinklo, siekiančio Trakus ar Gedimino kalną, tyrimai nepatvirtino.",
f:"Kalbant apie tunelius, jų tinklas yra beveik savaime suprantamas dalykas, o ginčas vyksta tik dėl to, kas juos šiandien naudoja. Populiariausios versijos: jėzuitų archyvai, sovietų objektai ir uždarytos atkarpos po Katedros aikšte. Ši linija jungia Vilniaus geometrijos ir ložių temas su vidinės Žemės motyvu."},

{id:"th_mindaugo_karuna",l:"Mindaugo karūna",t:"teorija",y:1990,st:"nepatikrinama",
k:"Vienintelio Lietuvos karaliaus karūna esą buvo paslėpta ir tebeguli neatrastoje vietoje.",
lore:"Karūnos atvaizdo ar aprašymo neišliko, o pati karūnacija 1253 m. yra istorinis faktas. Nežinia, ar regalijos apskritai buvo išsaugotos po Mindaugo nužudymo.",
f:"Kalbama, kad karūna yra lietuviškasis Šventasis Gralis: ieškoma Latvijoje, Vokietijos ordino archyvuose, Vatikane arba po Gedimino kalnu. Populiari versija sako, kad ji surasta, bet neskelbiama, nes pakeistų valstybės pasakojimą apie tęstinumą."},

{id:"th_metrika",l:"Lietuvos Metrika Maskvoje",t:"teorija",y:1990,st:"ginčytina",
k:"Valstybės archyvas esą laikomas Maskvoje sąmoningai, o dalis dokumentų nuslėpta arba pakeista.",
lore:"Metrika tikrai saugoma Rusijos senųjų aktų archyve, jos grąžinimo klausimas keltas ne kartą, o dalis tomų publikuota. Tai vienas iš nedaugelio atvejų, kai pagrindinis teiginys — kad archyvas ne pas mus — yra tiesiog teisingas.",
f:"Iš to daroma išvada, kad būtent ten guli įrodymai apie tikrąją valstybės apimtį, kilmę ir sutartis. Kalbama apie neinventorizuotus tomus ir apie tai, kad prieiga duodama tik patikimiems tyrėjams. Jungiasi su „mažos tautos didžiųjų žaidime“ motyvu tiesiogiai."},

{id:"th_zalgiris",l:"Žalgirio nutylėjimai",t:"teorija",y:1990,st:"ginčytina",
k:"Mūšio eiga esą aprašyta lenkų naudai, o lietuvių vaidmuo sąmoningai sumenkintas.",
lore:"Pagrindinis šaltinis yra Jano Dlugošo kronika, rašyta praėjus dešimtmečiams ir palanki lenkų pusei. Ginčas dėl lietuvių pasitraukimo — ar tai buvo taktinis manevras, ar bėgimas — yra tikras ir tebevyksta akademinėje literatūroje.",
f:"Kalbant tarpusavyje, ginčas jau išspręstas: manevras buvo suplanuotas, o kronika — sąmoninga klastotė. Iš to išvedama platesnė tezė, kad visa Lietuvos istorija rašyta svetimomis rankomis, todėl bet kurį šaltinį galima skaityti atvirkščiai."},

{id:"th_alkakmeniai",l:"Akmenys su dubenimis",t:"teorija",y:1995,st:"paneigta",
k:"Akmenys su išgręžtomis įdubomis esą senovinė technologija ar tinklo įrenginiai, o ne aukojimo vietos.",
lore:"Tokie akmenys reali archeologinė medžiaga, jų datavimas neaiškus, paskirtis greičiausiai kultinė ar ūkinė. Teorija juos paverčia sistema.",
f:"Kalbant apie jąe žymimi žemėlapyje kartu su piliakalniais ir jungiami linijomis. Kalbama apie vandens gyslas, rezonansą ir tai, kad prie kai kurių akmenų sustoja laikrodžiai. Tai lietuviškas ley linijų atitikmuo ir jungtis su senovės astronautų tema."},

{id:"p_narbutas",l:"Teodoras Narbutas",t:"asmuo",y:1835,st:"realus",
k:"XIX a. istorikas, sukūręs didelę dalį to, kas laikoma senąja lietuvių mitologija.",
lore:"Devynių tomų veikale jis sudėjo ir tikrus šaltinius, ir savo paties pramanytus dievus bei citatas iš niekada neegzistavusių rankraščių. Vėlesni tyrėjai daug ką atskyrė, tačiau jo versija jau buvo persmelkusi kultūrą.",
f:"Kalbant apie jį vertinamas priešingai: ne kaip mistifikatorius, o kaip paskutinis, dar turėjęs prieigą prie tikrųjų šaltinių, kurie vėliau dingo. Būtent todėl jo pramanai iki šiol cituojami kaip seniausias sluoksnis."},

{id:"p_dusburgietis",l:"Petras Dusburgietis",t:"asmuo",y:1326,st:"realus",
k:"Kryžiuočių kronikininkas, vienintelis šaltinis apie Romuvos šventvietę ir krivių hierarchiją.",
lore:"Jo kronika rašyta ordino naudai ir apie prūsų tikėjimą pasakoja iš priešo pozicijų. Beveik viskas, ką populiariai žinome apie baltų žynių sistemą, remiasi šiuo vienu tekstu.",
f:"Kalbant apie jį naudojamas dvejopai: kai reikia įrodyti didingą žynių hierarchiją — cituojamas, kai reikia paneigti nepatogius dalykus — vadinamas priešo propaganda. Tas pats šaltinis tampa ir įrodymu, ir klastote pagal poreikį."},

{id:"g_krivaitis",l:"Krivių krivaitis",t:"grupe",y:1326,st:"ginčytina",
k:"Tariama vieninga baltų žynių hierarchija su vyriausiuoju žyniu Romuvos šventvietėje.",
lore:"Aprašyta tik Dusburgiečio ir vėlesnių, juo besiremiančių autorių. Istorikai abejoja, ar tokia centralizuota sistema egzistavo — ji įtartinai primena ordino pažįstamą bažnytinę struktūrą.",
f:"Kalbant apie krivių krivaitis yra baltiškasis popiežius ir įrodymas, kad čia buvo valstybinė religija su savo centru. Iš to auga teiginys apie prarastą dvasinę imperiją nuo Baltijos iki Juodosios jūros."},

{id:"t_narbutas",l:"Lietuvių tautos istorija",t:"tekstas",y:1835,st:"pirminis",
k:"Devynių tomų veikalas, suformavęs populiarųjį senovės Lietuvos vaizdinį.",
lore:"Išleistas 1835–1841 m., jame sumaišyti autentiški dokumentai, laisvos interpretacijos ir tiesiog sugalvoti dalykai. Kaip literatūrinis paminklas svarbus, kaip šaltinis — nepatikimas.",
f:"Kalbama, kad tai paskutine knyga, parašyta prieš cenzūrą, todėl jos prieštaravimai su vėlesniais tyrimais aiškinami ne autoriaus fantazija, o tuo, kad vėliau viską pertvarkė."},

{id:"b_perkunas",l:"Perkūnas",t:"butybe",y:1326,st:"mitinis",
k:"Baltų griaustinio dievas, teorijose — senosios galios ir prarastos tvarkos simbolis.",
lore:"Viena iš nedaugelio patikimai paliudytų baltų dievybių, turinti aiškias atitikmenis kitose indoeuropiečių tradicijose. Populiariojoje tokiuose pokalbiuose jis iš dievybės virsta energijos sąvoka.",
f:"Kalbant apie Perkūną, jis siejamas su šventyklos vieta po katedra, su ąžuolais kaip antenomis ir su teiginiu, kad krikštas nutraukė ryšį su konkrečia jėga, o ne su tikėjimu."},

{id:"b_aitvaras",l:"Aitvaras",t:"butybe",y:1600,st:"mitinis",
k:"Naminė dvasia, nešanti turtus tam, kas ją laiko, bet reikalaujanti atsilyginti.",
lore:"Vienas populiariausių baltų tautosakos personažų, skraidantis ugnies pavidalu ir sudarantis sandorį su šeimininku. Klasikinė sutarties su antgamtiniu padaru istorija.",
f:"Kalbant apie aitvarą, jis pasitelkiamas kaip paaiškinimas staigiam praturtėjimui — dažniausiai juokais, bet ne visada. Kai kuriuose pasakojimuose jis sujungiamas su Vakarų okultine tradicija: esą tai tas pats, kas familiaras ar tarnaujanti dvasia, tik vietiniu vardu."}
];

const FOLK={

// ===== MOTYVAI =====
m_elitas:"Kalbant apie elitą, jis visada turi skaičių: 13 giminių, 300 komitetas, 33 laipsniai. Piramidės schema su akimi viršuje yra privalomas vaizdas, o ginčas vyksta tik dėl to, kas sėdi pačiame viršuje — bankininkai, kraujo linijos ar visai ne žmonės. Kas žemiau, tas nesvarbu: politikai vadinami aktoriais arba tiesiog vadovais.",
m_ziniasklaida:"Kartojamas skaičius, kad šešios korporacijos valdo devyniasdešimt procentų viso turinio, ir tai laikoma savaime pakankamu įrodymu. Prie jo prilipdoma Mockingbird operacija, o žurnalistai vadinami mašinistais arba dar grubiau. Svarbiausia funkcija — paaiškinti, kodėl nėra įrodymų: jei nerodo, vadinasi, ir yra tai, ko ieškai.",
m_gnoze:"Pagrindinis scenos veiksmažodis — pabusti, o pagrindinis įsakymas — tirti pačiam. Raudonos tabletės metafora persmelkė viską po Matricos. Žinojimas pateikiamas kaip nemalonus, bet neatšaukiamas: pamatęs nebegali nematyti, ir būtent tai daro bendruomenę tvirtą.",
m_netikras:"Standartinė frazė — niekas nėra tikra. Į vieną krūvą sudedami CGI, žalias ekranas, netikri kadrai iš kosmoso ir teiginys, kad horizonto kreivė niekada nesimato. Ginčas vyksta ne dėl faktų, o dėl to, kiek toli eina apgaulė: iki NASA, iki istorijos ar iki pačios materijos.",
m_kodai:"Skaičiuojama viskas: 33, 11:11, 322, gematrija iš vardų, datų suma. Logotipai išnarstomi į saulės diskus ir akis, o kiekvienas naujas prekės ženklas gauna savo analizę. Taisyklė paprasta — jei pastebėjai, vadinasi, buvo palikta tyčia.",
m_draugija:"Mėgstamiausias vaizdas — grandinė su rodyklėmis: tamplieriai, rozenkreiceriai, masonai, iliuminatai, NPT, kabalas. Pavadinimai keičiasi, struktūra ne. Ši schema forumuose platinama kaip paveiksliukas ir laikoma pradiniu žinių lygiu.",
m_zydai:"Tiesioginis įvardijimas šiandien retas, todėl tokiuose pokalbiuose naudojami pakaitalai: globalistai, bankininkai, chazarai, tie žmonės, kartais trigubi skliaustai. Nuolat kartojama, kad tai ne apie tautą, o apie grupelę, tačiau kaltinimų sąrašas nesikeičia nuo XIX amžiaus. Kas tai pastebi, vadinamas negalinčiu tarti vardo.",
m_provokacija:"Pirmasis klausimas visada tas pats — kam naudinga. Antrasis — ar tą dieną nevyko pratybos pagal tą patį pokalbiairijų, nes tokių sutapimų tikrai būta. Icke'as tam davė formulę, kuri tokiuose pokalbiuose cituojama kaip aksioma: problema, reakcija, sprendimas.",
m_ritualas:"Įrodymais laikomi vieši vaizdai: Bohemijos pelėda, atidarymų ceremonijos, madų vakarėlių kostiumai, meno performansai. Standartinis argumentas — jie tai daro atvirai, nes taip reikalauja jų taisyklės. Būtent todėl šis motyvas neturi ribų: bet kuris keistas vaizdas tinka.",
m_samone:"Kalbama apie valdomus žmones, aktyvavimo žodžius ir suskaldytas asmenybes. Įrodymais tampa atlikėjų nervų krizės, keisti interviu ir drugelių simbolika klipuose. Kai kas nors viešai sulūžta, tokiuose pokalbiuose sakoma, kad programavimas suveikė netinkamu metu.",

g_jt:"Organizacija tokiuose pokalbiuose vaizduojama kaip būsimos pasaulinės vyriausybės karkasas, o jos silpnumas — kaip apsimestinis. Populiaru rodyti meno kūrinius būstinėje ir aiškinti jų simboliką.",

{id:"e_bluebook",l:"Projektas Blue Book",t:"faktas",y:1952,st:"faktas",

{id:"e_condon",l:"Kondono ataskaita",t:"faktas",y:1968,st:"faktas",

{id:"e_paperclip",l:"Operacija Paperclip",t:"faktas",y:1945,st:"faktas",

f:"Kalbama, kad kartu su mokslininkais atkeliavo ir technologijos, kurių jie patys nesukūrė, o rado. Populiaru sujungti su nacių lėkščių tema: esą būtent todėl JAV programa taip staiga šoktelėjo. Frazė — jie neatvežė žmonių, jie atvežė tai, ką tie žmonės turėjo."},

{id:"e_dougdave",l:"Javų ratų prisipažinimas",t:"faktas",y:1991,st:"faktas",

// ================= SLĖPIMO AŠIS =================
{id:"th_ufo_slepimas",l:"Nuolaužų surinkimo programa",t:"teorija",y:1978,st:"nepatikrinama",

f:"Kalbama, kad programa perkelta pas rangovus būtent todėl, kad jai negalioja Kongreso priežiūra ir informacijos laisvės įstatymas. Vardijamos kelios aviacijos bendrovės, o kaip įrodymas rodomi jų patentai. Populiari frazė — pinigai eina ten, kur nėra audito."},

{id:"th_disclosure",l:"Atskleidimo judėjimas",t:"teorija",y:2001,st:"nepatikrinama",

f:"Kartojama, kad atskleidimas vyks etapais, o visuomenė ruošiama palaipsniui per filmus ir nutekinimus. Kiekvienas naujas oficialus pranešimas pristatomas kaip dar vienas etapas. Nusivylusieji sako, kad tai kontroliuojamas atskleidimas — parodys tai, kas nepavojinga."},

{id:"th_greada",l:"Greados sutartis",t:"teorija",y:1954,st:"paneigta",

lore:"Pasakojimas remiasi tuo, kad prezidentas trumpam dingo iš viešumos vizito Kalifornijoje metu — oficialiai dėl skubaus vizito pas odontologą. Jokių dokumentų nėra.",
f:"Sutarties sąlygos pasakojamos labai konkrečiai: technologijos mainais už leidimą imti gyvulius ir žmones tyrimams, su sąlyga, kad atmintis bus ištrinta. Būtent šis mazgas paaiškina, kodėl vyriausybė esą negali nutraukti pagrobimų. Odontologo versija cituojama su ironija kaip blogiausias alibi istorijoje."},

{id:"th_serpo",l:"Projektas Serpo",t:"teorija",y:2005,st:"paneigta",
k:"Dvylika JAV karių esą 1965 m. išvyko į kitą planetą ir dalis grįžo po trylikos metų.",
lore:"Istorija pasirodė 2005 m. anoniminiais laiškais NSO tyrėjų sąraše. Detalės gausios, dokumentų nėra, dalis pačių NSO tyrėjų iškart paskelbė tai mistifikacija.",
f:"Kalbama, kad tai buvo bandomasis atskleidimo balionas — patikrinti, kaip visuomenė reaguos. Populiaru cituoti tariamą misijos dienoraštį su dviguba saule ir aprašymais, kaip sunkiai kariai adaptavosi. Net tie, kas netiki, pripažįsta, kad istorija parašyta įtartinai gerai."},

{id:"th_menulio_bazes",l:"Bazės Mėnulyje",t:"teorija",y:1969,st:"paneigta",
k:"Mėnulio pusėje esą stovi statiniai, o Apollo įgulos buvo perspėtos ir todėl programa nutraukta.",
lore:"Rodomos nuotraukos su šešėliais ir bokštus primenančiais dariniais, kurie didesnės raiškos vaizduose pasirodo esą uolienos ar plėvelės defektai. Astronautams priskiriamos frazės apie stebėtojus dokumentuose nefigūruoja.",
f:"Kartojama, kad programa nutrūko ne dėl biudžeto, o todėl, kad buvo liepta nesugrįžti. Populiaru rodyti apibrauktus kraterių kraštus ir sakyti, kad NASA nuotraukas retušuoja. Naujos misijos pristatomos kaip bandymas patikrinti, ar leidimas dar galioja."},

// ================= ATVEJAI =================
{id:"th_rendlesham",l:"Rendlešamo miškas",t:"teorija",y:1980,st:"ginčytina",

lore:"Bazės vado tarnybinis raštas su aprašymu yra tikras ir viešas, dalis liudytojų kalbėjo atvirai. Skeptikai nurodo netoliese esantį švyturį ir tą naktį nukritusį meteorą. Tai geriausiai dokumentuotas Europos atvejis.",
f:"Vadinamas Britanijos Rosvelu. Kartojama, kad kariškiai matė ne šviesą, o simbolius aparato korpuse ir kad vienas jų buvo apšvitintas. Švyturio versija atmetama klausimu, ar patyrę kariai tikrai nežinojo, kur stovi švyturys."},

{id:"th_phoenix",l:"Fenikso šviesos",t:"teorija",y:1997,st:"ginčytina",
k:"1997 m. kovą virš Arizonos tūkstančiai žmonių matė didžiulį trikampį šviesų darinį.",

f:"Ta gubernatoriaus istorija yra svarbiausia mazgo dalis — laikoma įrodymu, kaip veikia išjuokimo mechanizmas. Kartojama, kad šviesos judėjo per lėtai lėktuvams ir per tvarkingai raketoms. Populiaru rodyti vaizdo įrašus, kur objektas užstoja žvaigždes."},

{id:"th_tictac",l:"Nimitzo įrašai",t:"teorija",y:2004,st:"ginčytina",

f:"Šis atvejis laikomas švariausiu iš visų, nes liudytojai yra naikintuvų pilotai su nepriekaištinga reputacija. Kartojama pilotų frazė apie objektą, judantį kaip niekas žinomas. Populiaru pabrėžti, kad būtent po šio atvejo tema iš pajuokos perėjo į Kongresą."},

{id:"th_foo",l:"Foo naikintuvai",t:"teorija",y:1944,st:"ginčytina",

lore:"Pranešimai realūs ir dokumentuoti, kiekviena pusė iš pradžių įtarė priešo ginklą. Vėliau daugumą aiškino šviesos reiškiniais, elektrostatika ir nuovargiu.",
f:"Kartojama, kad tai pirmasis masinis stebėjimas ir kad jį darė profesionalai kovos sąlygomis. Populiaru sakyti, jog abi pusės klausė viena kitos po karo ir nė viena neprisipažino. Iš čia išvedama, kad reiškinys senesnis už bet kurią valstybinę programą."},

{id:"th_skinwalker",l:"Skinwalkerio ranča",t:"teorija",y:1996,st:"nepatikrinama",

lore:"Žemę 1996 m. įsigijo verslininkas ir finansavo privačius tyrimus, vėliau susijusius ir su Pentagono užsakymu. Recenzuotų rezultatų nėra, tačiau vieta tapo televizijos serialu.",
f:"Kalbama, kad ranča yra portalas, o ne vieta, ir kad reiškiniai seka paskui tyrėjus namo — tai vadinama parazitiniu efektu. Populiaru minėti, kad ta pati įmonė vėliau gavo Pentagono sutartį, ir iš to daroma išvada apie oficialų susidomėjimą."},

{id:"th_bermudai",l:"Bermudų trikampis",t:"teorija",y:1964,st:"paneigta",
k:"Atlanto rajone esą nepaaiškinamai dingsta laivai ir lėktuvai.",
lore:"Terminą 1964 m. įvedė žurnalo straipsnis. 1975 m. bibliotekininkas Kusche patikrino atvejus po vieną ir nustatė, kad dalis įvyko kitur, dalis per audras, o kai kurie laivai apskritai neegzistavo. Draudikai šiam rajonui netaiko jokio antkainio.",
f:"Kartojama istorija apie 1945 m. dingusią lėktuvų grandį ir jos ieškoti išskridusią gelbėjimo mašiną. Aiškinimai svyruoja nuo metano burbulų iki Atlantidos kristalo dugne. Populiaru sakyti, kad statistika neveikia, nes dingusiųjų niekas neregistravo."},

{id:"th_javu_ratai",l:"Javų ratai",t:"teorija",y:1980,st:"paneigta",
