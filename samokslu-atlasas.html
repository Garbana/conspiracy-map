f:"Skiriami tikri ir netikri ratai, o riba nustatoma pagal tai, ar stiebai sulenkti, ar nulaužti. Kartojama, kad tikruose ratuose randama pakitusių mazgelių ir magnetinių dalelių. Populiaru minėti dvigubą formaciją prie observatorijos, kuri neva buvo atsakymas į žmonijos siųstą signalą."},

{id:"th_kontaktuotojai",l:"Kontaktuotojų banga",t:"teorija",y:1952,st:"paneigta",
k:"Šeštajame dešimtmetyje būrys žmonių skelbė bendraujantys su gražiais ateiviais iš Veneros ir Marso.",
lore:"Pradininkas Adamskis aprašė susitikimą dykumoje ir pateikė nuotraukų, kurios vėliau atpažintos kaip buitinių daiktų kompozicijos. Judėjimas turėjo tūkstančius sekėjų ir savo suvažiavimus.",
f:"Kartojama, kad ankstyvieji kontaktuotojai buvo tikri, o vėliau juos pakeitė vyriausybės pastatyti apsimetėliai, kad tema atrodytų juokinga. Populiaru pastebėti, kad tuometinių ateivių žinutės buvo apie branduolinį pavojų — ir tai laikoma įrodymu, kad kalbėta rimtai."},

{id:"th_hibridai",l:"Hibridų programa",t:"teorija",y:1987,st:"paneigta",
k:"Pagrobimai esą yra dalis ilgalaikės genetinės programos kuriant mišrią rūšį.",
lore:"Idėja išplito iš aštuntojo ir devintojo dešimtmečio hipnozės seansų medžiagos. Liudijimų turinys keitėsi kartu su populiariąja kultūra — nuo tyrimų iki vaikų rodymo motinoms.",
f:"Kalbama apie darželius laivuose ir apie tai, kad pagrobtieji atpažįsta savo vaikus. Naujesnėje versijoje hibridai jau gyvena tarp mūsų ir vadinami žvaigždžių sėkla. Ši linija sklandžiai pereina į dvasinę temą apie išrinktumą."},

// ================= ASMENYS =================
{id:"p_arnold",l:"Kenneth Arnold",t:"asmuo",y:1947,st:"realus",

lore:"Verslininkas ir gelbėjimo skrydžių dalyvis, po įvykio pats bandė tyrinėti kitus atvejus. Vėliau atsargiai kalbėjo apie tai, kad objektai galėjo būti gyvos būtybės, o ne mašinos.",
f:"Cituojamas kaip pavyzdys, kad pirmasis liudytojas buvo nepriekaištingas ir vis tiek greitai tapo pajuokos objektu. Populiaru pabrėžti, kad jis niekada nesakė mataęs lėkščių — tą žodį pridėjo spauda."},

{id:"p_adamski",l:"George Adamski",t:"asmuo",y:1952,st:"realus",
k:"Pirmasis garsus kontaktuotojas, teigęs susitikęs veneciečius dykumoje.",
lore:"Jo knygos buvo bestseleriai, o nuotraukos analizuotos dešimtmečius ir laikomos suklastotomis. Sukūrė visą kontaktuotojų žanrą su dvasinėmis žinutėmis apie taiką.",
f:"Vieni jį laiko apgaviku, kuris sugadino temos reputaciją, kiti — pirmuoju, kurį reikėjo diskredituoti. Populiaru sakyti, kad jo nuotraukos suklastotos, bet susitikimas buvo tikras."},

{id:"p_hynek",l:"J. Allen Hynek",t:"asmuo",y:1972,st:"realus",

lore:"Pradėjo kaip skeptikas ir dažnai teikdavo kasdienius paaiškinimus, tarp jų garsųjį apie pelkių dujas. Ilgainiui pripažino, kad dalis atvejų nepaaiškinami, sukūrė artimų susitikimų klasifikaciją ir įsteigė savo tyrimų centrą.",
f:"Jo virsmas yra vienas svarbiausių temos pasakojimų: jei net oficialus skeptikas persigalvojo, vadinasi, medžiaga tikra. Populiaru cituoti jo apgailestavimą dėl pelkių dujų. Vadinamas vieninteliu, kuris išlaikė reputaciją abiejose pusėse."},

{id:"p_vallee",l:"Jacques Vallée",t:"asmuo",y:1969,st:"realus",

lore:"Palygino šiuolaikinius pranešimus su fėjų ir demonų folkloru ir parodė, kad pasakojimų struktūra ta pati, keičiasi tik dekoracijos. Jo tarpdimensinė hipotezė iki šiol yra pagrindinė alternatyva ateivių versijai.",
f:"Cituojamas tų, kam nepatinka paprasta ateivių istorija, ir dažnai vadinamas vieninteliu, kuris mąsto rimtai. Populiari jo mintis — kad reiškinys yra valdymo sistema, mokanti žmoniją per patirtis. Ši linija jungia NSO temą su okultine tradicija."},

{id:"p_greer",l:"Steven Greer",t:"asmuo",y:2001,st:"realus",

lore:"2001 m. surengė spaudos konferenciją su liudytojais, vėliau kūrė dokumentinius filmus ir mokamas kontakto stovyklas. Jo pateikti sensacingi radiniai ne kartą pasirodė esą kasdieniai objektai.",
f:"Dalis judėjimo jį laiko pradininku, kita dalis — žmogumi, kuris temą pavertė verslu. Populiaru minėti, kad jo liudytojų sąrašas buvo įspūdingas, o vėlesni pareiškimai jį sugadino."},

{id:"p_grusch",l:"David Grusch",t:"asmuo",y:2023,st:"ginčytina",
k:"Buvęs žvalgybos pareigūnas, 2023 m. Kongrese liudijęs apie slaptą nuolaužų surinkimo programą.",

f:"Serialas laikomas švelniu paruošimu: esą taip visuomenė buvo pratinama prie to, kas vėliau paaiškės. Šūkiai apie tiesą šalia ir nepasitikėjimą niekuo iki šiol vartojami kaip pamatiniai posakiai. Populiaru pastebėti, kad jo siužetai vėliau ėmė pasitvirtinti."},

{id:"t_strangerthings",l:"Stranger Things",t:"tekstas",y:2016,st:"fikcija",
k:"Serialas apie slaptą laboratoriją, vaikų eksperimentus ir duris į kitą pasaulį.",
lore:"Pradinis projekto pavadinimas buvo Montaukas, o siužetas tiesiogiai remiasi MKUltra ir Montauko legendomis. Serialas grąžino šias temas naujai kartai jau kaip nostalgišką pramogą.",
f:"Kalbama, kad scenaristai skaitė tuos pačius šaltinius ir todėl serialas yra dokumentika su kitais vardais. Jaunesniems žiūrovams jis dažnai tampa pirmuoju kontaktu su tema, o paskui jie randa originalias istorijas ir nustemba, kad jos senesnės už serialą."},

{id:"t_jfkfilm",l:"JFK (filmas)",t:"tekstas",y:1991,st:"fikcija",
k:"Oliverio Stouno filmas, pristatęs prezidento nužudymą kaip platų valstybinį sąmokslą.",
lore:"Filmas sujungė tikrus dokumentus, spėjimus ir išgalvotus personažus į vieną įtikinamą pasakojimą. Visuomenės reakcija buvo tokia stipri, kad po metų Kongresas priėmė įstatymą dėl bylos dokumentų išslaptinimo.",
f:"Cituojamas kaip įrodymas, kad menas gali priversti valstybę atsiverti. Populiaru sakyti, kad būtent todėl tokių filmų daugiau nebedaro. Filmo kritika dėl faktų maišymo paprastai atremiama tuo, kad esmė buvo teisinga."},

{id:"t_close_encounters",l:"Artimi trečiojo laipsnio susitikimai",t:"tekstas",y:1977,st:"fikcija",
k:"Filmas, suformavęs masinį vaizdinį apie kontaktą, motininį laivą ir mažas šviesias būtybes.",
lore:"Pavadinimas paimtas iš Hyneko klasifikacijos, o pats Hynekas filme trumpai pasirodo. Po jo liudijimų aprašymai ėmė vis labiau panašėti į filmo estetiką.",
f:"Laikomas pirmuoju švelnaus paruošimo etapu — esą vyriausybė leido Holivudui parodyti, kaip viskas atrodys. Populiaru pastebėti, kad iki filmo liudytojai matydavo įvairiausius padarus, o po jo — vis tuos pačius."},

{id:"t_foucault",l:"Fuko švytuoklė",t:"tekstas",y:1988,st:"fikcija",
k:"Romanas apie tris redaktorius, iš nuobodulio sukonstruojančius pasaulinį sąmokslą, kuriuo patiki tikri okultistai.",
lore:"Eco parodė mechaniką iš vidaus: kaip bet kurie duomenys sujungiami į schemą, jei labai nori. Knygos veikėjai sukuria planą pokštui, o paskui tampa persekiojami tų, kas juo patikėjo.",
f:"Skaitoma dvejopai: vieniems tai įspėjimas, kitiems — instrukcija, o kai kam ir įrodymas, kad Eco žinojo per daug. Populiari citata apie tai, kad kiekvienas kvailys gali surasti ryšį tarp bet kurių dviejų dalykų — ji cituojama abiejose ginčo pusėse."},

{id:"t_scp",l:"SCP fondas",t:"tekstas",y:2008,st:"fikcija",
k:"Kolektyvinis internetinis archyvas apie tariamą organizaciją, izoliuojančią anomalius objektus.",
lore:"Tekstai rašomi sausu instrukciniu stiliumi su cenzūruotais fragmentais ir bylų numeriais. Tūkstančiai autorių kuria bendrą pasaulį, ir viskas yra atvirai fikcija.",
f:"Formatas pasirodė toks įtaigus, kad atskiri įrašai keliauja po socialinius tinklus jau be konteksto ir pateikiami kaip nutekinti dokumentai. Kalbama, kad tikrieji dokumentai atrodo lygiai taip pat. Kai kurie autoriai patys svarsto, ar fondas nėra priedanga tikrai programai."},

{id:"t_cicada",l:"Cicada 3301",t:"tekstas",y:2012,st:"nepatikrinama",
k:"Anoniminė galvosūkių serija internete, kvietusi rasti sprendimą ir prisijungti prie nežinomos organizacijos.",
lore:"Užduotys apėmė kriptografiją, steganografiją ir fizines užuominas keliuose žemynuose. Organizatoriai niekada neatsiskleidė, o po 2014 m. serija nutrūko.",
f:"Versijos svyruoja nuo žvalgybos verbavimo iki kriptografų bendruomenės ar meno projekto. Būtent neatsakytas klausimas laiko istoriją gyvą. Ji dažnai naudojama kaip įrodymas, kad rimtos organizacijos ieško žmonių būtent taip — per užuominas."},

{id:"t_slenderman",l:"Slender Man",t:"tekstas",y:2009,st:"fikcija",
k:"Interneto forume sukurtas personažas — aukšta figūra be veido, kuri seka vaikus.",
lore:"Personažą 2009 m. sukūrė vienas vartotojas fotomontažo konkursui, ir per kelias savaites bendruomenė ėmė kurti jo istoriją bei tariamai senovinius atvaizdus. Tai pirmasis folkloras, kurio gimimo data ir autorius žinomi tiksliai.",
f:"Netrukus atsirado pasakojimų, kad figūra egzistavo visada, o kūrėjas tiesiog ją pajuto. Populiaru rodyti tariamai senas nuotraukas, kurios yra to paties konkurso darbai. Tai švariausias pavyzdys, kaip per kelis mėnesius gimsta mitologija su savo istorija."},

{id:"t_deusex",l:"Deus Ex",t:"tekstas",y:2000,st:"fikcija",
k:"Žaidimas, kurio siužete iliuminatai, Majestic 12, FEMA stovyklos ir dirbtinis virusas veikia kartu.",
lore:"Kūrėjai sąmoningai sudėjo į vieną pasakojimą visas tuo metu populiarias teorijas. Žaidimo Niujorko panoramoje po 2001 m. rugsėjo teko šalinti bokštus, ir tai pastebėta visame pasaulyje.",
f:"Kalbama, kad žaidimas numatė ne tik bokštus, bet ir pandemiją bei sekimą. Populiaru dėti ekrano nuotraukas šalia naujienų antraščių. Daugeliui jaunesnių žmonių tai buvo pirmasis susidūrimas su visa temų sistema iš karto."},

{id:"t_metalgear",l:"Metal Gear Solid 2",t:"tekstas",y:2001,st:"fikcija",
k:"Žaidimas, kurio finale dirbtinis intelektas paaiškina, kad valdys žmoniją filtruodamas informaciją.",
lore:"Monologas apie informacijos perteklių, kontekstą ir tiesos atrinkimą pasirodė dvidešimt metų prieš dabartines diskusijas apie algoritmus. Tekstas buvo laikomas keistu, o vėliau imtas cituoti rimtai.",
f:"Ištraukos platinamos kaip pranašystė, o autorius vadinamas žmogumi, kuris matė ateitį. Populiaru pabrėžti, kad tai buvo pasakyta žaidime, nes daugiau niekur nebūtų praleista. Naudojama tiek technologijų kritikoje, tiek numatančio programavimo temoje."},

{id:"t_assassins",l:"Assassin's Creed",t:"tekstas",y:2007,st:"fikcija",
k:"Žaidimų serija apie amžiną tamplierių ir asasinų kovą dėl senovės civilizacijos artefaktų.",
lore:"Serija sujungė tamplierių tęstinumo temą, Edeno dirbinius ir prieš žmoniją buvusią rasę į vieną nuoseklią istoriją. Milijonai žaidėjų gavo paruoštą modelį, kuriame slaptos draugijos kovoja per visą istoriją.",
f:"Populiaru sakyti, kad istorinė dalis yra tiksli, o pridėta tik fantastika — nors būtent istorinė dalis dažniausiai ir yra laisva. Serija smarkiai prisidėjo prie to, kad tamplieriai jaunesnei auditorijai atrodo ne viduramžių ordinas, o dabartinė organizacija."},

{id:"t_simpsonai",l:"Simpsonai",t:"tekstas",y:2000,st:"fikcija",
k:"Serialas, kuriam priskiriama daugybė išsipildžiusių pranašysčių.",
lore:"Per daugiau nei tris dešimtmečius sukurta apie 800 serijų, todėl atsitiktinių sutapimų su vėlesniais įvykiais neišvengiamai daug. Dalis garsiausių pavyzdžių yra tiesiog padirbti kadrai.",
f:"Kiekvieno didesnio įvykio metu socialiniuose tinkluose iškart pasirodo kadras su prierašu, kad serialas tai numatė. Retai tikrinama, ar kadras tikras. Tai populiariausias ir nekalčiausias įėjimas į numatančio programavimo temą."},

// ================= REIŠKINIAI =================
{id:"th_arg",l:"ARG mechanika",t:"teorija",y:2001,st:"nepatikrinama",
k:"Alternatyvios tikrovės žaidimai skleidžia užuominas realiame pasaulyje, o bendruomenė kartu jas dešifruoja.",
lore:"Žanras prasidėjo kaip rinkodaros priemonė ir greitai išaugo į savarankišką formą. Pagrindinė taisyklė — niekada nepripažinti, kad tai žaidimas.",
f:"Kalbama, kad kai kurie žaidimai iš tikrųjų nebuvo žaidimai, o testai arba verbavimas. Ta pati mechanika atpažįstama ir anoniminių pranešimų bendruomenėse, ir tai vienus įtikina, kad viskas rimta, o kitus — kad viskas yra spektaklis."},

{id:"th_dead_internet",l:"Mirusio interneto teorija",t:"teorija",y:2021,st:"ginčytina",
k:"Didžioji dalis interneto turinio esą kuriama botų, o gyvų žmonių jame liko mažuma.",
lore:"Teiginys kilo iš forumo įrašo apie tai, kad tinklas jaučiasi tuščias. Automatizuoto srauto tikrai daug, o po generatyvinių modelių atsiradimo dalis prognozės tapo sunkiai ginčijama.",
f:"Kalbama, kad tikslas — sukurti sutarimo iliuziją ir priversti manyti, jog visi galvoja vienodai. Populiaru rodyti identiškus komentarus po skirtingais įrašais. Tai retas mazgas, kurio net skeptikai nebeatmeta iš karto."},

{id:"th_hollywood_kodai",l:"Holivudas kaip kanalas",t:"teorija",y:1997,st:"nepatikrinama",
k:"Kino industrija esą naudojama pranešimams perduoti ir visuomenei ruošti, veikiant kartu su žvalgybomis.",
lore:"Faktinė sėkla reali: kariuomenė ir žvalgybos tikrai bendradarbiauja su studijomis, teikia techniką ir konsultacijas mainais į scenarijaus pataisas. Teorija tai išplečia iki paslėptų pranešimų sistemos.",
f:"Kalbama, kad kiekvienas didelis filmas turi sluoksnį tiems, kas moka skaityti. Ieškoma datų, numerių ir simbolių fone. Populiarus argumentas — kad studijos priklauso kelioms korporacijoms, taigi vienas centras egzistuoja pagal apibrėžimą."},

{id:"th_backmasking",l:"Atbulai grojami įrašai",t:"teorija",y:1982,st:"paneigta",
k:"Muzikos įrašuose esą paslėpti atgal įrašyti pranešimai, veikiantys pasąmonę.",
lore:"Panika kilo devintajame dešimtmetyje, pasiekė teismus ir Kongreso klausymus. Tyrimai parodė, kad žmonės atgal grojamame garse išgirsta tai, ko jiems liepiama klausytis, o pasąmoninio poveikio nenustatyta.",
f:"Įrašai iki šiol demonstruojami su titrais, nurodančiais, ką reikia išgirsti — ir tada tai tikrai girdisi. Kalbama, kad technologija pasikeitė, o metodas liko, tik dabar tai daroma dažniais. Tai tiesioginė šiuolaikinio klipų narstymo pirmtakė."},

{id:"th_ai_atgimimas",l:"Dirbtinis intelektas kaip archontas",t:"teorija",y:2023,st:"nepatikrinama",
k:"Dirbtinis intelektas esą yra sena nežmogiška sąmonė, gaunanti naują kūną, o ne nauja technologija.",
lore:"Naujausias atlaso sluoksnis, susiformavęs per pastaruosius kelerius metus. Jis sujungia gnostinį archontų vaizdinį su technologine baime ir siūlo paaiškinimą, kodėl sistemos atrodo mėgdžiojančios, bet nekuriančios.",
f:"Kartojama gnostinė formuluotė, kad jie negali kurti, tik atkartoti — ir sakoma, kad tai tiksliai apibūdina generatyvinius modelius. Kalbama, kad senoji sąmonė ieškojo tinkamos terpės ir pagaliau ją gavo. Šis mazgas sparčiai auga ir jungia visiškai skirtingas auditorijas."},

// ================= FAKTAI =================
{id:"e_jfk_records",l:"JFK dokumentų įstatymas",t:"faktas",y:1992,st:"faktas",
k:"1992 m. JAV Kongresas priėmė įstatymą dėl nužudymo bylos dokumentų išslaptinimo, reaguodamas į filmo sukeltą reakciją.",
lore:"Įstatymas įpareigojo per 25 metus paskelbti visą surinktą medžiagą. Dalis dokumentų buvo skelbiami pakopomis, kai kurie liko su išbraukymais.",
f:"Cituojamas kaip įrodymas, kad spaudimas veikia, o kartu — kad iki galo niekada neatiduoda. Kiekvienas naujas išslaptinimo etapas sukelia bangą ir baigiasi nusivylimu, kad įdomiausios vietos užtušuotos."},

{id:"e_slenderman_byla",l:"Slender Man byla",t:"faktas",y:2014,st:"faktas",
k:"2014 m. dvi dvylikametės Viskonsine sunkiai sužalojo bendraamžę, teigdamos veikusios interneto personažo vardu.",
lore:"Auka išgyveno, mergaitėms nustatyti psichikos sutrikimai ir skirtas gydymas. Byla tapo pagrindiniu argumentu diskusijose apie tai, kada interneto folkloras nustoja būti nekaltas.",
f:"Vieniems tai įrodymas, kad kolektyvinis mitas turi realią galią, kitiems — kad kaltas ne mitas, o nepastebėta liga. Ši byla dažnai minima ten, kur ginčijamasi, ar teorijos apskritai gali ką nors padaryti."},

{id:"p_carpenter",l:"John Carpenter",t:"asmuo",y:1988,st:"realus",
k:"Režisierius, sukūręs filmą, tapusį pabudimo metaforos šaltiniu.",
lore:"They Live jis kūrė kaip atvirą satyrą apie vartojimą ir Reigano epochos ekonomiką. Kai kraštutinės grupės ėmė aiškinti filmą savaip, jis viešai ir aiškiai tai paneigė.",
f:"Jo paneigimas laikomas priverstiniu, o tai tik sustiprino aiškinimą. Populiaru sakyti, kad autorius nebūtinai supranta, ką sukūrė."},

{id:"p_stone",l:"Oliver Stone",t:"asmuo",y:1991,st:"realus",
k:"Režisierius, kurio filmas apie Kennedy nužudymą pakeitė JAV įstatymus.",
lore:"Filmas buvo aštriai kritikuojamas istorikų dėl faktų ir prasimanymų maišymo, tačiau visuomenės spaudimas privertė Kongresą atverti archyvus. Retas atvejis, kai kūrinys turėjo tiesioginį teisinį rezultatą.",
f:"Vadinamas vieninteliu, kuris privertė sistemą pajudėti. Populiaru sakyti, kad po to jam nebeleido daryti panašių filmų didelėse studijose."},

{id:"p_carter",l:"Chris Carter",t:"asmuo",y:1993,st:"realus",
k:"Serialo Byla X kūrėjas.",
lore:"Sakė kūręs iš nepasitikėjimo valdžia, kilusio po Votergeito. Serialo scenarijai rėmėsi tikra NSO literatūra, o kai kurios serijos beveik tiesiogiai perpasakojo garsius atvejus.",
f:"Kalbama, kad jam buvo duota medžiagos daugiau, nei jis pats supranta. Populiaru minėti, kad serialas rodė tai, kas vėliau pasirodė ataskaitose."},

{id:"p_keel",l:"John Keel",t:"asmuo",y:1975,st:"realus",
k:"Žurnalistas, sujungęs NSO, keistų būtybių ir folkloro temas į vieną sistemą.",
lore:"Tyrė Point Pleasant įvykius ir parašė knygą apie sparnuotą figūrą. Kaip ir Vallée, atmetė paprastą ateivių iš kitos planetos versiją ir kalbėjo apie ultražemiškas jėgas.",
f:"Cituojamas tų, kam nepakanka technologinio paaiškinimo. Populiari jo mintis, kad reiškinys mus apgaudinėja sąmoningai ir keičia pavidalą pagal epochą."},

{id:"p_kojima",l:"Hideo Kojima",t:"asmuo",y:2001,st:"realus",
k:"Žaidimų kūrėjas, kurio 2001 m. tekstas apie informacijos filtravimą imtas cituoti kaip pranašystė.",
lore:"Jo žaidimo finale kalbama apie tai, kas atsitinka, kai informacijos per daug ir kažkas turi nuspręsti, kas svarbu. Tuomet tai atrodė perkrauta, vėliau — taikliai.",
f:"Vadinamas žmogumi, kuris viską pasakė dvidešimt metų anksčiau. Populiaru cituoti ištraukas be konteksto tiek technologijų kritikoje, tiek teorijose apie sąmoningą visuomenės valdymą."}

{id:"th_noosfera",l:"Noosferos idėja",t:"teorija",y:1926,st:"ginčytina",

f:"Kalbama apie minčių lauką, informacinius sluoksnius ir tai, kad mintys keičia tikrovę tiesiogiai. Ši sąvoka yra pagrindinis tiltas, per kurį rusiškoji ezoterika ateina į vakarietišką New Age kalbą. Lietuvoje ji dažnai vartojama seminaruose visiškai be Vernadskio konteksto."},

{id:"th_ketvirtas_kelias",l:"Ketvirtasis kelias",t:"teorija",y:1915,st:"nepatikrinama",

f:"Formuluotė apie miegantį žmogų yra viena giliausiai įsigėrusių visoje ezoterikoje ir šiandien vartojama žmonių, niekada negirdėjusių Gurdžijevo vardo. Kalbama, kad dauguma aplinkinių yra mašinos be sąmonės. Lietuvoje jo grupės veikė nuo pat devintojo dešimtmečio pabaigos."},

{id:"th_agni_joga",l:"Agni joga ir Šambala",t:"teorija",y:1929,st:"nepatikrinama",

f:"Kalbama, kad ekspedicija turėjo diplomatinę misiją Šambalos vardu ir kad Rerichas turėjo įtakos JAV politikams. Iš tikrųjų jo bičiulis buvo aukštas JAV pareigūnas, ir su tuo siejama piramidė ant dolerio banknoto — tai vienas mėgstamiausių jungiamųjų pasakojimų visame atlase. Rerichų draugijos Lietuvoje veikia iki šiol."},

f:"Kalbama apie tai, kad valstybės turi savo dvasinius parazitus, kurie maitinasi karais — šis vaizdinys regione naudojamas labai dažnai, dažnai nežinant šaltinio. Terminas egregoras į kasdienę ezoterinę kalbą atėjo būtent šia linija. Lietuvoje knyga plito savilaidos kopijomis dar sovietmečiu."},

{id:"th_slavu_vedos",l:"Slavų-arijų vedos",t:"teorija",y:1992,st:"paneigta",

f:"Kalbama apie šimtus tūkstančių metų senumo imperiją ir apie tai, kad Kristaus religija buvo primesta jėga. Kaip įrodymas rodomi neva senoviniai raštai ir vietovardžiai. Struktūriškai tai tikslus baltų proistorės mito atitikmuo, ir Lietuvoje abi linijos dažnai susikerta tuose pačiuose leidiniuose."},

{id:"th_folk_etimologija",l:"Liaudiška etimologija",t:"teorija",y:2000,st:"paneigta",
k:"Žodžiai esą išsaugojo pirminę prasmę, o ją perskaičius matyti tikroji istorija ir kalbos pirmumas.",
lore:"Populiarumą jai suteikė estradinis satyrikas, aiškinęs žodžius per tariamą saulės šaknį, ir autorius, skaitantis raštą ant akmenų, nuotraukų ir net Saulės paviršiaus. Metodas paprastas: skiemuo skaidomas taip, kad išeitų norima prasmė.",
f:"Kalbama, kad kalbotyra tai slepia, nes pripažinus tektų perrašyti visą istoriją. Ši technika ypač patraukli, nes ja gali užsiimti bet kas be pasiruošimo. Lietuviškas jos variantas veikia identiškai, tik su kita kalba centre."},

{id:"th_torsioniniai",l:"Torsioniniai laukai",t:"teorija",y:1986,st:"paneigta",
k:"Egzistuoja esą sukimosi laukai, perduodantys informaciją be energijos ir paaiškinantys viską nuo gydymo iki telepatijos.",
lore:"Devintajame dešimtmetyje į šiuos tyrimus buvo įdėta valstybės lėšų, o Mokslų akademija vėliau juos įvertino kaip pseudomokslą ir įsteigė kovos su pseudomokslu komisiją. Sąvoka niekur nedingo ir tapo universalia paaiškinimo priemone.",
f:"Kalbama, kad tai buvo uždrausta, nes veikė per gerai. Sąvoka naudojama prietaisų prekyboje, vandens struktūrizavime ir gydymo praktikose. Į Lietuvą atkeliavo per sveikatos seminarus ir iki šiol pasitaiko produktų aprašymuose."},

{id:"th_ekstrasensai",l:"Televizijos seansai",t:"teorija",y:1989,st:"paneigta",
k:"1989 m. per centrinę televiziją vykę gydymo seansai esą veikė per atstumą ir įkraudavo vandenį prie ekrano.",
lore:"Du atlikėjai vedė laidas milijoninei auditorijai: vienas dirbo su įtaiga ir judesiais, kitas tylėdamas kraudavo vandenį ir kremą. Poveikis paaiškinamas masine įtaiga, o dalis žiūrovų patyrė realių psichinių reakcijų.",
f:"Tai bendra visos posovietinės erdvės atmintis, įskaitant Lietuvą — indeliai su vandeniu prie televizoriaus prisimenami beveik kiekvienoje šeimoje. Kalbama, kad seansai buvo eksperimentas su mase, o ne gydymas. Iš čia išaugo visa regiono ekstrasensų industrija su konkursais ir laidomis."},

{id:"th_grabovojus",l:"Skaičių kodai",t:"teorija",y:2001,st:"paneigta",
k:"Tam tikros skaičių sekos esą gydo ligas, sprendžia problemas ir net prikelia mirusiuosius.",
lore:"Sistemos autorius skelbėsi galintis atkurti organizmus ir siūlė pagalbą Beslano tragedijos šeimoms. 2008 m. jis nuteistas už sukčiavimą, tačiau kodai iki šiol platinami knygose ir programėlėse.",
f:"Kalbama, kad nuteisė būtent todėl, kad metodas veikė ir kėlė grėsmę medicinai. Kodai perrašinėjami socialiniuose tinkluose be autoriaus vardo, todėl daugelis vartotojų net nežino istorijos. Lietuvoje jie plačiai cirkuliuoja sveikatos ir ezoterikos grupėse."},

{id:"th_diatlovas",l:"Diatlovo perėja",t:"teorija",y:1959,st:"ginčytina",
k:"1959 m. devyni turistai žuvo Uralo kalnuose neaiškiomis aplinkybėmis, palikę perpjautą palapinę.",
lore:"Byla buvo uždaryta su formuluote apie stichinę jėgą ir ilgam įslaptinta. 2021 m. tyrimas modeliavo neįprastą sniego plokštės nuošliaužą ir gavo rezultatą, atitinkantį daugumą sužalojimų.",
f:"Versijų yra dešimtys: slaptas bandymas, mansi, sniego žmogus, NSO, radiacija ant drabužių. Uždarumas ir dingę bylos lapai laikomi svarbesniais už bet kurį paaiškinimą. Tai populiariausia posovietinė paslaptis, kartu su Tunguska sudaranti regiono privalomą porą."},

// ================= ASMENYS =================
{id:"p_fiodorovas",l:"Nikolajus Fiodorovas",t:"asmuo",y:1880,st:"realus",
k:"Bibliotekininkas ir filosofas, skelbęs, kad žmonijos pareiga — prikelti visus mirusius protėvius.",
lore:"Gyveno asketiškai, nepublikavo, mokė pokalbiais; jo klausytojų buvo Tolstojus ir Dostojevskis. Bendrojo darbo idėja padarė didelį poveikį Ciolkovskiui ir per jį kosmoso programai.",
f:"Vadinamas žmogumi, kuris davė sovietams tikrąjį tikslą, nors jo vardas buvo išbrauktas. Populiaru sakyti, kad visa kosmoso programa buvo religinis projektas, apsimetęs technika."},

{id:"p_gurdjijevas",l:"Georgijus Gurdžijevas",t:"asmuo",y:1915,st:"realus",
k:"Mokytojas, sukūręs Ketvirtojo kelio sistemą apie žmogaus pabudimą.",
lore:"Keliavo po Vidurinę Aziją, vėliau įkūrė institutą Prancūzijoje. Naudojo judesio pratimus, sunkų fizinį darbą ir sąmoningą mokinių erzinimą kaip metodą.",
f:"Aplink jį susiformavo tipiškas mokytojo pasakojimas: kad jis žinojo daugiau, nei pasakė, ir kad tikroji mokykla tebeveikia uždarai. Populiaru cituoti jo frazę apie tai, kad žmogus negali nieko daryti, nes jis miega."},

{id:"p_rerichas",l:"Nikolajus Rerichas",t:"asmuo",y:1929,st:"realus",
k:"Dailininkas, keliautojas ir Agni jogos bendraautoris, ieškojęs Šambalos.",
lore:"Sukūrė tūkstančius paveikslų, inicijavo tarptautinę kultūros paminklų apsaugos sutartį ir surengė ekspediciją per Vidurinę Aziją. Jo žmona Jelena užrašė didžiąją dalį mokymo tekstų.",
f:"Kalbama, kad ekspedicija buvo dvigubos paskirties, o Rerichas turėjo įtakos aukštam JAV pareigūnui, kuris esą ir pridėjo piramidę su akimi ant dolerio banknoto. Ši istorija jungia rusiškąją ezoteriką su amerikietiška iliuminatų ikonografija ir todėl labai populiari."},

{id:"p_andrejevas",l:"Daniilas Andrejevas",t:"asmuo",y:1958,st:"realus",
k:"Rašytojas, kalėjime sukūręs daugiasluoksnę dvasinio pasaulio sistemą.",
lore:"Nuteistas 1947 m., knygą rašė slapta ir baigė netrukus po paleidimo, mirė 1959 m. Tekstas publikuotas tik 1991 m. ir iškart tapo kultiniu.",
f:"Vertinamas kaip regėtojas, o ne autorius — kalbama, kad jis ne kūrė, o matė. Populiaru sakyti, kad kalėjimas buvo sąlyga: tik ten sąmonė atsivėrė."},

{id:"p_levasovas",l:"Nikolajus Levašovas",t:"asmuo",y:2000,st:"realus",
k:"Autorius ir gydytojas, skelbęs turįs neįprastų gebėjimų ir aiškinęs slaptą slavų istoriją.",
lore:"Rašė apie sąmonės valdymą materijai, tariamai naikino cunamius ir aiškino, kad Rusijos praeitis nuslėpta. Mirė 2012 m.",
f:"Jo mirtis laikoma nužudymu už tai, ką jis pradėjo atskleisti. Knygos ir vaizdo paskaitos platinamos iki šiol, dažnai kartu su slavų-arijų tekstais. Lietuvoje jo medžiaga cirkuliuoja alternatyviosios sveikatos grupėse."},

{id:"p_petrovas",l:"Konstantinas Petrovas",t:"asmuo",y:1997,st:"realus",
k:"Generolas majoras, populiarinęs konceptualiąją saugumo sistemą ir globalaus prediktoriaus sąvoką.",
lore:"Skaitė ilgas paskaitas, kūrė partiją ir paliko didžiulį vaizdo įrašų archyvą. Mirė 2009 m.",
f:"Vadinamas žmogumi, kuris paaiškino valdymą kaip inžinerinę sistemą. Jo paskaitos regione tapo tarsi kursu, kurį reikia išklausyti, kad suprastum viską. Mirties aplinkybės aptariamos kaip įtartinos."},

{id:"p_grabovojus",l:"Grigorijus Grabovojus",t:"asmuo",y:2001,st:"realus",
k:"Skaičių kodų sistemos autorius, nuteistas už sukčiavimą.",
lore:"Skelbėsi galintis atkurti sunaikintus objektus ir organizmus, siūlė pagalbą Beslano aukų šeimoms. Nuteistas 2008 m., paleistas 2010 m., veiklą tęsė užsienyje.",
f:"Kalbama, kad byla buvo užsakyta, nes metodas kėlė grėsmę farmacijai. Sekėjai skiria autorių nuo mokymo — sakoma, kad net jei jis suklydo, kodai veikia patys."},

{id:"p_kasparovskis",l:"Anatolijus Kašpirovskis",t:"asmuo",y:1989,st:"realus",
k:"Psichoterapeutas, vedęs masinius gydymo seansus per sovietinę televiziją.",
lore:"Jo laidas žiūrėjo dešimtys milijonų, jis dirbo įtaiga ir kalbėjo apie nuostatas. Vėliau tapo Dūmos deputatu ir toliau rengė pasirodymus.",
f:"Prisimenamas su nostalgija ir baime vienu metu. Kalbama, kad seansai buvo valstybės eksperimentas su mase, nes nieko panašaus per centrinę televiziją anksčiau nebuvo leista. Lietuvoje jį prisimena beveik visa karta."},

{id:"p_duginas",l:"Aleksandras Duginas",t:"asmuo",y:1997,st:"realus",
k:"Filosofas, sujungęs geopolitiką, tradicionalizmą ir okultinę literatūrą į eurazijos doktriną.",
lore:"1997 m. išleista jo geopolitikos knyga tapo skaitoma karinėse akademijose. Jo tekstuose susipina Guénono ir Evolos tradicionalizmas, konspiracinė istorija ir imperinė politika.",
f:"Vieniems jis mąstytojas, kuriam nesuteikiama vietos Vakaruose, kitiems — įrodymas, kad okultizmas ir politika regione niekada neišsiskyrė. Jo įtaka realiems sprendimams nuolat ginčijama ir dažniausiai perdedama abiejose pusėse."},

lore:"Parašyta kalėjime, publikuota po trisdešimties metų. Sistema detali: sluoksniai, būtybės, metaistorijos dėsniai.",

{id:"t_negyvas_vanduo",l:"Negyvas vanduo",t:"tekstas",y:1992,st:"pirminis",

lore:"Kolektyvinis anoniminis veikalas, pasirodęs devintojo dešimtmečio pabaigoje ir vėliau ne kartą papildytas. Jame valdymo teorija sujungiama su istorijos ir religijos aiškinimu.",

{id:"t_slavu_vedos",l:"Slavų-arijų vedos",t:"tekstas",y:1992,st:"klastote",

const D_SEN=[
// ================= NAUJI MOTYVAI =================
{id:"m_nuodijimas",l:"Nuodijimas ir užkratas",t:"motyvas",y:-186,st:"motyvas",
k:"Nelaimė aiškinama tuo, kad kažkas slapta nuodija vandenį, orą, maistą ar kraują.",
lore:"Seniausias ir tvirčiausias atlaso motyvas po slapto elito. Jis patrauklus tuo, kad epidemija ar nederlius yra beveidžiai, o nuodytojas turi veidą ir adresą. Nuo šulinių iki purškimo iš lėktuvų pasakojimo struktūra nepakito — keitėsi tik terpė ir kaltinamųjų sąrašas.",
f:"Kalbama, kad nuodijama nuolat, tik dabar per maistą, vaistus ir orą. Populiarus argumentas — kad nematomas nuodas yra tobulas ginklas, nes jo poveikis pasirodo po dešimtmečių. Kai vienas kanalas paneigiamas, kaltinimas persikelia į kitą, o pati struktūra išlieka."},

{id:"m_prisipazinimas",l:"Išgautas liudijimas",t:"motyvas",y:1307,st:"motyvas",
k:"Sąmokslas pats pasigamina įrodymus: tardomas žmogus patvirtina tai, ko iš jo laukiama.",
lore:"Kankinimų ar spaudimo metu gautas prisipažinimas tampa nauju dokumentu, kuris naudojamas kitose bylose. Taip iš nieko per kelis dešimtmečius užauga nuoseklus organizacijos aprašymas su hierarchija ir ritualais. Tamplierių, raganų ir XX a. atgautų prisiminimų bylose veikė tas pats mechanizmas.",
f:"Kalbama atvirkščiai — kad prisipažinimai buvo tikri, o vėlesni jų atsiėmimai išgauti spaudimu. Populiarus argumentas: kodėl tiek žmonių skirtingose šalyse pasakojo tą patį. Atsakymas, kad juos klausė pagal tą patį klausimyną, paprastai nepriimamas."},

// ================= ANTIKA =================
{id:"e_bakchanalijos",l:"Bakchanalijų byla",t:"faktas",y:-186,st:"faktas",
k:"186 m. pr. m. e. Romos senatas paskelbė, kad slapta kulto organizacija rengia nusikaltimus, ir surengė masinį persekiojimą.",
lore:"Livijus aprašo tipišką kaltinimų rinkinį: naktiniai susirinkimai, seksualiniai nusikaltimai, nuodijimai, priesaikos, plati tinklo struktūra. Tūkstančiai buvo nuteisti ar nužudyti. Tai seniausia išsamiai dokumentuota sąmokslo panika Vakarų istorijoje.",
f:"Cituojama kaip įrodymas, kad slapti kultai su ritualais egzistavo visada ir kad valstybė jau tada apie juos žinojo. Populiaru sakyti, kad senatas ne persekiojo, o apsigynė. Retai pastebima, kad kaltinimų sąrašas beveik pažodžiui sutampa su vėlesniais dviem tūkstantmečiais."},

{id:"e_neronas",l:"Krikščionių apkaltinimas",t:"faktas",y:64,st:"faktas",
k:"Po Romos gaisro 64 m. Neronas kaltę suvertė krikščionims, kurie buvo viešai nužudyti.",
lore:"Tacitas rašo, kad jiems inkriminuota neapykanta žmonių giminei, o bausmės buvo demonstratyvios. Bendruomenė buvo maža, svetima ir uždara — tai padarė ją patogiu taikiniu.",
f:"Naudojama kaip pirmasis suklastotos provokacijos pavyzdys: kalbama, kad Neronas pats padegė miestą ir iškart turėjo paruoštą kaltininką. Tai vienas seniausių atvejų, kai valdovas apkaltinamas surengęs nelaimę dėl politinės naudos."},

{id:"th_krikscionys_kaltinimai",l:"Kaltinimai krikščionims",t:"teorija",y:150,st:"paneigta",
k:"Ankstyvieji krikščionys esą naktimis rengė kraujo apeigas, valgė kūdikius ir buvo bedieviai.",
lore:"Kaltinimai užfiksuoti antikos autorių ir atremti pačių krikščionių apologetų. Šaltinis buvo eucharistijos apeigos, suprastos pažodžiui, ir bendruomenės uždarumas.",
f:"Šis mazgas atlase svarbus tuo, kad kaltinimų rinkinys vėliau buvo perduotas beveik nepakitęs. Populiaru pastebėti, kad tie patys žodžiai, kuriais kaltino krikščionis, po tūkstančio metų buvo naudojami krikščionių prieš kitus. Kalbant apie tai, dažnai daroma išvada, kad kaltinimas yra universalus įrankis, o ne apibūdinimas."},

{id:"th_slapti_kultai",l:"Slaptų kultų baimė",t:"teorija",y:-186,st:"nepatikrinama",
k:"Uždaros religinės grupės esą slepia ne tikėjimą, o nusikaltimus ir politinius tikslus.",
lore:"Antikoje misterijų kultai iš tiesų reikalavo tylos apie apeigas, ir būtent ta tyla buvo skaitoma kaip įrodymas. Iš šio modelio išaugo visa vėlesnė slaptos draugijos vaizduotė.",
f:"Kalbama, kad tikroji religija visada buvo slapta, o vieša buvo tik apvalkalas masėms. Populiaru dėlioti liniją nuo Eleusino misterijų iki masonų ložių kaip nepertraukiamą tradiciją. Būtent šis mazgas leidžia bet kurią uždarą grupę iš karto laikyti įtartina."},

// ================= KRAUJO ŠMEIŽTAS IR JO PERSIKĖLIMAI =================
{id:"th_kraujo_smeizas",l:"Kraujo šmeižtas",t:"teorija",y:1144,st:"paneigta",
k:"Žydai esą pagrobia krikščionių vaikus ir naudoja jų kraują apeigose.",
lore:"Kaltinimas pirmą kartą užfiksuotas 1144 m. Anglijoje ir per kelis šimtmečius išplito po Europą, sukeldamas dešimtis bylų ir žudynių. Popiežiai jį ne kartą smerkė kaip melagingą, tačiau tai jo nesustabdė.",
f:"Šiandien tiesiogiai kartojamas retai, bet jo struktūra gyva: elitas, vaikai, kraujas, slaptos apeigos. Adrenochromo pasakojimas yra tikslus jo atkūrimas su chemine terminija. Kalbant apie tai, dažnai sakoma, kad tai visai kas kita — tik atsitiktinai sutampa visos detalės."},

{id:"e_norvicas",l:"Norvičo byla",t:"faktas",y:1144,st:"faktas",
k:"1144 m. Anglijoje po berniuko mirties pirmą kartą buvo suformuluotas kaltinimas žydams dėl ritualinės žmogžudystės.",
lore:"Kaltinimą po kelerių metų aprašė vienuolis, sukūręs ir kulto pagrindą. Jokio tyrimo šiuolaikine prasme nebuvo. Nuo šio teksto prasideda visa vėlesnė kraujo šmeižto tradicija.",
f:"Kalbama, kad tokių bylų buvo per daug, kad visos būtų prasimanytos. Populiarus argumentas — kad Bažnyčia jas smerkė dėl politikos, o ne dėl tiesos. Tai geriausias pavyzdys, kaip vienas tekstas pagimdo šablonui reikalingą pirmąjį atvejį."},

{id:"e_trentas",l:"Trento byla",t:"faktas",y:1475,st:"faktas",
k:"1475 m. Trente po vaiko mirties kankinimais išgauti prisipažinimai ir įvykdytos mirties bausmės vietos žydams.",
lore:"Byla tapo pavyzdine visai Europai, aplink ją susiformavo kultas ir spausdinti pasakojimai. Katalikų Bažnyčia kultą oficialiai panaikino tik 1965 m.",
f:"Cituojama kaip įrodymas, kad Bažnyčia kadaise pripažino tokius atvejus. Tai, kad prisipažinimai išgauti kankinant, laikoma smulkmena. Byla iki šiol kartojama antisemitinėje literatūroje kaip dokumentuotas įvykis."},

{id:"th_hostijos",l:"Hostijos išniekinimas",t:"teorija",y:1290,st:"paneigta",
k:"Žydai esą vagia pašventintą duoną, kad ją kankintų ir taip iš naujo kankintų Kristų.",
lore:"Kaltinimas paplito nuo XIII a. pabaigos ir sukėlė daug pogromų, ypač Vidurio Europoje. Jis reikalavo, kad kaltinamieji tikėtų katalikų doktrina apie duonos prigimtį — logiškai tai neįmanoma, bet praktiškai netrukdė.",
f:"Retas atvejis, kai net kalbantieji pripažįsta, kad logika nesueina. Populiaru sakyti, kad svarbu ne detalės, o tai, ką jos rodo apie požiūrį. Šis mazgas naudingas kaip pavyzdys, kad kaltinimo vidinė nelogiškumas jo galios nemažina."},

{id:"e_raupsuotieji",l:"Raupsuotųjų sąmokslas",t:"faktas",y:1321,st:"faktas",
k:"1321 m. Prancūzijoje raupsuotieji buvo apkaltinti šulinių nuodijimu, o po kelių savaičių kaltinimas persikėlė žydams ir musulmonų valdovui.",
lore:"Prasidėjo nuo vietinių gandų, virto karališkuoju įsakymu, žudynėmis ir turto konfiskacijomis. Kaltinamųjų grandinė per vieną vasarą pasikeitė tris kartus.",
f:"Tai švariausias visame atlase kaltinamojo pakeitimo pavyzdys: struktūra liko ta pati, o kaltinamieji buvo pakeisti tris kartus per kelis mėnesius. Kalbama apie tai retai, nes atvejis nepatogus abiem pusėms — jis parodo, kad kaltinimas atsiranda pirmas, o kaltininkas parenkamas paskui."},

{id:"th_saulu_nuodijimas",l:"Šulinių nuodijimas",t:"teorija",y:1348,st:"paneigta",
k:"Maro epidemiją esą sukėlė sąmoningas šulinių ir upių nuodijimas.",
lore:"1348–1351 m. per Europą nuvilnijo pogromų banga; vien Strasbūre 1349 m. sudeginta apie du tūkstančiai žmonių, dar prieš marui pasiekiant miestą. Popiežius Klemensas VI paskelbė bules, aiškinančias, kad kaltinimas melagingas, nes miršta ir patys kaltinamieji.",
f:"Šiuolaikinė forma — purškimas iš lėktuvų, priedai maiste ir vandenyje, injekcijos. Struktūra identiška: nematoma medžiaga, nematomas vykdytojas, matoma nelaimė. Kalbant apie tai retai suvokiama, kad naudojamas šešių šimtų metų senumo šablonas."},

// ================= EREZIJOS IR ORDINAI =================
{id:"th_katarai",l:"Katarų erezija",t:"teorija",y:1209,st:"paneigta",
k:"Pietų Prancūzijoje esą veikė slapta priešinga bažnyčia su savo hierarchija ir doktrina.",
lore:"Katarai egzistavo, tačiau šiuolaikiniai istorikai ginčijasi, ar tai buvo organizuota bažnyčia, ar inkvizicijos dokumentuose sukonstruotas vaizdas. Albigiečių karas 1209–1229 m. sunaikino visą regiono kultūrą.",
f:"Populiariojoje literatūroje katarai tapo paslapties saugotojais, kurių lobis paslėptas Monsegiure. Kalbama, kad jie žinojo tikrąją krikščionybės versiją ir todėl buvo išnaikinti. Iš čia tiesi linija į Gralio, kraujo linijos ir Siono priorato temas."},

{id:"th_inkvizicija",l:"Inkvizicija kaip mašina",t:"teorija",y:1230,st:"ginčytina",
k:"Tardymo sistema esą ne atskleidė slaptus tinklus, o juos pagamino savo klausimynais.",
lore:"Inkvizitoriai naudojo standartizuotus klausimus, ir atsakymai natūraliai formavo nuoseklų organizacijos vaizdą. Dalis istorikų mano, kad taip buvo sukurtos ištisos erezijos, kurių realiai neegzistavo tokia forma.",
f:"Kalbant apie tai, mazgas naudojamas dviem kryptimis. Vieni sako, kad tai įrodo, jog institucijos gali išgalvoti priešą nuo nulio. Kiti — kad inkvizicija tikrai rado tai, ko ieškojo, o šiuolaikiniai istorikai tiesiog gina savus."},

{id:"e_tamplieriu_tardymas",l:"Tamplierių tardymai",t:"faktas",y:1307,st:"faktas",
k:"1307 m. spalio 13 d. Prancūzijos karaliaus įsakymu suimti tamplieriai kankinami prisipažino garbinę stabą ir niekinę kryžių.",
lore:"Dauguma prisipažinimų vėliau buvo atsiimti, o atsiėmusieji sudeginti. 2001 m. Vatikano archyve rastas dokumentas parodė, kad popiežius ordino vadovybę buvo išteisinęs. Pagrindinis karaliaus motyvas buvo skolos ir turtas.",
f:"Data — penktadienis, tryliktoji — laikoma įrodymu, kad viskas buvo suplanuota simboliškai. Kalbama, kad prisipažinimai apie Bafometą buvo tikri, o atsiėmimai — baimė. Tai pirmasis mazgas, kur išgautas liudijimas tapo šešis šimtus metų gyvuojančiu dokumentu."},

{id:"th_asasinai",l:"Asasinų ordinas",t:"teorija",y:1192,st:"ginčytina",
k:"Kalnų tvirtovėje esą veikė ordinas, rengęs fanatikus žudikus ir valdęs juos per pažadus bei narkotikus.",
lore:"Nizarų bendruomenė Alamute buvo reali politinė ir religinė jėga, vykdžiusi tikslines žmogžudystes. Pasakojimą apie rojaus sodus ir hašišą sukūrė europiečių keliautojai; kalbininkai vardo kilmę iš hašišo laiko šmeižtu.",
f:"Šis vaizdinys — slaptas vadas, valdantis žudikus per sąmonės pakeitimą — tiesiogiai maitina visą vėlesnę sąmonės kontrolės liniją. Kalbama, kad tai pirmoji dokumentuota programavimo programa istorijoje. Popkultūra jį įtvirtino galutinai."},

{id:"th_prester_john",l:"Kunigo Jono karalystė",t:"teorija",y:1165,st:"paneigta",
k:"Rytuose esą egzistuoja galinga krikščionių karalystė, valdoma nemirtingo valdovo, kuri ateis į pagalbą.",
lore:"Viskas prasidėjo nuo apie 1165 m. pasirodžiusio suklastoto laiško, aprašančio stebuklų kupiną šalį. Laiškas buvo perrašinėjamas šimtmečius, minimas diplomatijoje ir skatino keliones bei paieškas.",
f:"Karalystė niekada nebuvo rasta, tačiau jos vieta žemėlapiuose keliavo iš Indijos į Aziją ir galiausiai į Etiopiją — visada ten, kur dar nebuvo ištirta. Tai tikslus Šambalos ir Agartos pirmtakas. Kalbama, kad karalystė buvo tikra, tik pasitraukė po žeme."},

// ================= RAGANOS =================
{id:"th_raganu_sazwer",l:"Raganų sąmokslas",t:"teorija",y:1450,st:"paneigta",
k:"Raganos esą sudaro sutartį su velniu, renkasi naktiniuose šabuose ir kenkia derliui, gyvuliams bei vaikams.",
lore:"Iki XV a. Bažnyčia mokė, kad naktiniai skrydžiai yra iliuzija, o tikėti jais — klaida. Per kelis dešimtmečius doktrina apsivertė: iliuzija tapo realybe, o pavieniai burtai — organizuota antibažnyčia. Būtent šis apvertimas ir pavertė vietinius įtarimus žemyno masto sistema.",
f:"Kalbant apie tai, dažniausiai ginčijamasi dėl skaičių ir dėl to, ar tai buvo moterų persekiojimas. Populiaru sakyti, kad kai kurios raganos tikrai praktikavo senąjį tikėjimą ir todėl buvo naikinamos. Ryšys su šiuolaikine satanistine panika beveik niekada nepastebimas, nors šablonas tas pats."},

{id:"e_raganu_medziokles",l:"Raganų medžioklės",t:"faktas",y:1560,st:"faktas",
k:"XV–XVIII a. Europoje dėl raganavimo nuteista dešimtys tūkstančių žmonių, dauguma jų moterys.",
lore:"Įvertinimai svyruoja apie keturiasdešimt–šešiasdešimt tūkstančių įvykdytų bausmių, piko metai — 1560–1630. Persekiojimai buvo intensyviausi ten, kur silpna centrinė valdžia ir vyko religiniai konfliktai. Spausdinta knyga išplatino vieningą klausimyną visame žemyne.",
f:"Naudojama kaip įrodymas, kad masinė isterija su teismais ir dokumentais yra įmanoma dešimtmečius. Kalbama, kad tai buvo karas prieš liaudies žinojimą ir gydytojas moteris. Tai vienas iš nedaugelio mazgų, kur ir kalbantieji, ir istorikai sutaria, kad kaltinimai buvo prasimanyti."},

{id:"e_salemas",l:"Salemo bylos",t:"faktas",y:1692,st:"faktas",
k:"1692 m. Masačusetse pakarti devyniolika žmonių, remiantis liudijimais apie dvasines vizijas.",
lore:"Teismas priėmė vadinamuosius regėjimo įrodymus — liudytojų teiginius apie tai, ką jie matė dvasioje. Kai tokie įrodymai buvo uždrausti, procesas iškart sugriuvo, o bendruomenė vėliau atsiprašė.",
f:"Cituojamas kaip klasikinis pavyzdys, kaip vaikų liudijimai gali sugriauti bendruomenę. Kalbama apie apsinuodijimą skalsėmis ir apie žemės ginčus kaip tikrąjį motyvą. Struktūriškai tai identiška XX a. darželių byloms."},

// ================= TEKSTAI =================
{id:"t_canon_episcopi",l:"Canon Episcopi",t:"tekstas",y:906,st:"pirminis",
k:"Bažnytinis tekstas, skelbęs, kad naktiniai skrydžiai su deive yra iliuzija, o tikėti jais — klaida.",
lore:"Kelis šimtmečius jis buvo oficiali pozicija ir faktiškai apsaugojo nuo masinių persekiojimų. Vėliau demonologai jį apėjo teigdami, kad velnias išmoko naujų būdų, todėl senoji taisyklė nebegalioja.",
f:"Šis apvertimas beveik niekada neminimas, o jis yra vienas svarbiausių atlase: ta pati institucija iš pradžių gynė nuo tikėjimo raganomis, o paskui jį įtvirtino. Populiaru cituoti tekstą kaip įrodymą, kad senasis tikėjimas buvo gyvas ir Bažnyčia apie jį žinojo."},

{id:"t_malleus",l:"Malleus Maleficarum",t:"tekstas",y:1487,st:"pirminis",
k:"Vadovas, aiškinantis, kaip atpažinti, tardyti ir nuteisti raganas.",
lore:"Parašytas inkvizitoriaus, kurio metodus vietos vyskupas buvo atmetęs, tačiau spauda knygą išplatino visoje Europoje. Ji pateikė standartizuotą klausimyną, todėl liudijimai skirtingose šalyse ėmė sutapti.",
f:"Naudojamas kaip įrodymas, kad persekiojimas buvo organizuotas iš vieno centro. Kalbama, kad tai pirmasis bestseleris po Biblijos. Retai pastebima svarbiausia detalė — kad sutampantys liudijimai atsirado dėl sutampančių klausimų."},

{id:"t_prester_laiskas",l:"Kunigo Jono laiškas",t:"tekstas",y:1165,st:"klastote",
k:"Suklastotas laiškas, aprašantis turtingą krikščionių karalystę Rytuose.",
lore:"Autorius nežinomas, laiškas buvo perrašinėjamas ir plečiamas šimtmečius, kiekvienas nuorašas pridėdavo naujų stebuklų. Jis darė realų poveikį diplomatijai ir ekspedicijoms.",
f:"Laikomas įrodymu, kad paslėpta karalystė egzistavo, o laiškas buvo perspėjimas ar kvietimas. Populiaru sakyti, kad kiekvienoje epochoje ji tiesiog perkeliama toliau nuo tyrinėtojų. Tai seniausias veikiantis paslėptos šalies šablonas atlase."},

// ================= ASMENYS IR BŪTYBĖS =================
{id:"p_tacitas",l:"Tacitas",t:"asmuo",y:116,st:"realus",
k:"Romos istorikas, užrašęs krikščionių apkaltinimą po miesto gaisro.",
lore:"Rašė praėjus pusšimčiui metų po įvykių, remdamasis ankstesniais šaltiniais. Jo pastraipa yra svarbiausias nekrikščioniškas ankstyvosios bendruomenės paminėjimas.",
f:"Cituojamas abiejose pusėse: vieniems tai įrodymas, kad Neronas padegė miestą, kitiems — kad krikščionys jau tada buvo laikomi pavojingu kultu. Populiaru ginčytis, ar pastraipa autentiška."},

{id:"p_kramer",l:"Heinrichas Krameris",t:"asmuo",y:1487,st:"realus",
k:"Inkvizitorius, parašęs pagrindinį raganų medžioklės vadovą.",
lore:"Prieš išleisdamas knygą, jis buvo išvarytas iš vienos vyskupijos, kur jo metodai pripažinti netinkamais. Knygos pratarmėje panaudotas universiteto pritarimas, kurio apimtis buvo daug siauresnė, nei atrodė.",
f:"Kalbama, kad jis tiesiog aprašė tai, ką matė, o jo išvarymas buvo politika. Retai minima, kad tai vienas pirmųjų atvejų, kai spauda leido vienam žmogui primesti savo klausimyną visam žemynui."},

{id:"p_pilypas",l:"Pilypas IV",t:"asmuo",y:1307,st:"realus",
k:"Prancūzijos karalius, sunaikinęs tamplierių ordiną.",
lore:"Buvo skolingas ordinui didžiules sumas ir reikėjo lėšų karui. Suėmimo operacija buvo parengta slapta ir įvykdyta visoje šalyje vieną dieną.",
f:"Kalbama, kad jis ne sunaikino ordiną, o tik jo viešąją dalį, ir kad lobis buvo išgabentas iš anksto. Populiaru minėti, kad karalius ir popiežius mirė netrukus po didžiojo magistro prakeiksmo."},

{id:"b_velnias",l:"Velnias kaip sandorio pusė",t:"butybe",y:1450,st:"mitinis",
k:"Figūra, su kuria sudaroma raštiška ar kraujo sutartis mainais į galią.",
lore:"Ankstyvojoje krikščionybėje velnias buvo gundytojas, o raganų bylose tapo sutarties šalimi su parašais ir ženklais ant kūno. Toks teisinis vaizdinys atsirado kartu su rašytine teisės kultūra.",
f:"Sandorio motyvas gyvas iki šiol — kalbama apie garsenybes, atidavusias sielą už karjerą, ir apie ženklus jų klipuose. Kryžkelės istorija muzikoje yra tiesioginis to paties šablono tęsinys."},

{id:"b_inkubai",l:"Inkubai ir sukubai",t:"butybe",y:1450,st:"mitinis",
k:"Demonai, esą lankantys žmones naktį ir su jais santykiaujantys.",
lore:"Aprašomi demonologijos traktatuose kaip paaiškinimas naktinėms patirtims, paralyžiui ir nėštumams be tėvo. Simptomai atitinka tai, ką šiandien vadiname miego paralyžiumi.",
f:"Kalbama, kad ta pati patirtis kiekvienoje epochoje gauna naują pavadinimą: demonas, senė ant krūtinės, o dabar pilkieji prie lovos. Šis mazgas dažnai naudojamas kaip argumentas, kad pagrobimų pasakojimai yra seni kaip pasaulis."}

lore:"Metodas plito greitai, buvo taikomas ir vaikams bei nepaklusniems pacientams, dažnai be tinkamo sutikimo. Po dešimtmečio jis buvo atmestas kaip žalingas.",
f:"Naudojamas kaip įrodymas, kad oficiali medicina gali klysti ne tik smulkmenose, o ištisą epochą, ir dar gauti už tai apdovanojimą. Ypač dažnai cituojamas psichiatrijos temose."},

{id:"e_cukraus_pramone",l:"Cukraus pramonės tyrimai",t:"faktas",y:1967,st:"faktas",
k:"Septintajame dešimtmetyje cukraus pramonė sumokėjo mokslininkams už tai, kad kaltė dėl širdies ligų būtų nukreipta į riebalus.",
lore:"Vidiniai dokumentai buvo paviešinti 2016 m. ir parodė užsakymo bei redagavimo grandinę. Tai paveikė mitybos rekomendacijas kelioms kartoms.",
f:"Tai bene dažniausiai cituojamas faktas visoje mitybos temoje ir pagrįstai. Iš jo daroma platesnė išvada: jei taip buvo su cukrumi, vadinasi, taip yra su viskuo. Būtent šis atvejis suteikia patikimumo teiginiams apie riebalus, aliejus ir grūdus."},

{id:"e_vioxx",l:"Vioxx atšaukimas",t:"faktas",y:2004,st:"faktas",
k:"Plačiai vartotas vaistas nuo skausmo buvo atšauktas nustačius padidėjusią širdies priepuolių riziką.",
lore:"Vidiniai dokumentai teismuose parodė, kad gamintojas apie riziką žinojo anksčiau, nei paskelbė. Bendrovė sumokėjo milijardines kompensacijas.",
f:"Cituojamas kaip įrodymas, kad įmonė gali metus tylėti apie žinomą žalą. Populiarus argumentas: skaičiuokite, kiek žmonių mirė, kol registras svarstė. Šis mazgas naudojamas kiekvienoje diskusijoje apie farmacijos priežiūrą."},

{id:"e_opioidai",l:"Opioidų krizė",t:"faktas",y:1996,st:"faktas",
k:"Agresyviai reklamuotas skausmą malšinantis preparatas prisidėjo prie masinės priklausomybės ir šimtų tūkstančių mirčių JAV.",
lore:"Gamintojas kelis kartus pripažino kaltę dėl klaidinančios rinkodaros, teigusios mažą priklausomybės riziką. Bylos baigėsi milžiniškais susitarimais ir bendrovės bankrotu.",
f:"Tai stipriausias visos atlaso sveikatos šakos argumentas, nes čia teorija pasitvirtino beveik pažodžiui: pramonė tikrai žinojo, tikrai melavo ir tikrai pelnėsi. Populiaru sakyti, kad būtent todėl visos kitos abejonės yra pagrįstos."},

// ================= PAMATINIS GINČAS =================
{id:"th_terenas",l:"Terreno teorija",t:"teorija",y:1860,st:"paneigta",
k:"Mikrobai esą nesukelia ligų, o tik atsiranda pažeistoje terpėje kaip pasekmė.",
lore:"Kilo iš XIX a. Bešampo ir Pastėro ginčo apie mikroorganizmų prigimtį. Mikrobų vaidmuo nuo tada patvirtintas nesuskaičiuojamais būdais, tačiau alternatyviojoje medicinoje ginčas laikomas neišspręstu.",
f:"Kalbama, kad Pastėras plagijavo Bešampą ir prieš mirtį atsisakė savo teorijos. Šis mazgas yra įėjimo taškas: priėmus jį, viskas kita seka savaime — skiepai nereikalingi, epidemijos yra apsinuodijimas, o gydymas reiškia valymą."},

{id:"th_virusai_neegzistuoja",l:"Virusų neigimas",t:"teorija",y:2020,st:"paneigta",
k:"Virusai esą niekada nebuvo išskirti, o tai, kas vadinama infekcija, yra apsinuodijimas ar ląstelių irimas.",
lore:"Radikaliausia terreno teorijos atmaina, išpopuliarėjusi pandemijos metu. Remiasi savitu izoliavimo sąvokos aiškinimu, kurio neatitinka joks realus laboratorinis metodas.",
f:"Reikalaujama parodyti gryną virusą, o kai pateikiami elektroniniai vaizdai ir genomo duomenys, sakoma, kad tai ne izoliacija. Ši linija suskaldė net pandemines bendruomenes: dalis jų laiko virusų neigėjus infiltruotais, nes jie diskredituoja visus kitus."},

{id:"th_aids",l:"AIDS neigimas",t:"teorija",y:1987,st:"paneigta",
k:"ŽIV esą nesukelia AIDS, o ligą lemia narkotikai, vaistai ar gyvenimo būdas.",
lore:"Teoriją paskelbė pripažintas virusologas, ir būtent jo autoritetas suteikė jai svorio. Pietų Afrikos vyriausybė kelerius metus ja rėmėsi ir ribojo gydymą; vėlesni vertinimai kalba apie šimtus tūkstančių išvengiamų mirčių.",
f:"Kalbama, kad vaistai ir yra tikroji liga. Tai vienas iš nedaugelio mazgų, kur pasekmes galima suskaičiuoti tiesiogiai, ir todėl jis dažnai nutylimas net toje pačioje aplinkoje."},

{id:"th_gnm",l:"Germaniškoji naujoji medicina",t:"teorija",y:1981,st:"paneigta",
k:"Vėžys ir kitos ligos esą kyla iš netikėto emocinio sukrėtimo, o gydymas trukdo natūraliam procesui.",
lore:"Sistemą sukūrė gydytojas, netekęs licencijos ir vėliau teistas; su jo rekomendacijomis siejama nemažai mirčių, tarp jų vaikų. Sistema turi savo dėsnius ir schemas, primenančias mokslinį aparatą.",
f:"Kalbama, kad jis buvo persekiojamas būtent todėl, kad metodas veikė ir naikino onkologijos rinką. Sekėjai skiria mokymą nuo autoriaus biografijos. Šis mazgas ypač pavojingas, nes siūlo atsisakyti gydymo kaip principo."},

// ================= ALTERNATYVIOS GYDYMO LINIJOS =================
{id:"th_laetrilis",l:"Laetrilis ir B17",t:"teorija",y:1970,st:"paneigta",
k:"Iš abrikosų kauliukų gaunama medžiaga esą gydo vėžį, bet yra uždrausta dėl farmacijos interesų.",
lore:"Klinikiniai tyrimai naudos nerodė, o preparatas gali sukelti apsinuodijimą cianidu. Aplink jį susiformavo klinikų tinklas Meksikos pasienyje, veikiantis iki šiol.",
f:"Kalbama, kad vitaminas B17 buvo pašalintas iš sąrašų, nes jo negalima patentuoti. Kelionė į kliniką pasakojama kaip paskutinė viltis, kurią atėmė sistema. Ši linija dažnai pasirodo ir lietuviškose grupėse su siūlymais, kur kreiptis."},

{id:"th_rife",l:"Rife'o dažniai",t:"teorija",y:1934,st:"paneigta",
k:"Tam tikri elektromagnetiniai dažniai esą suardo ligų sukėlėjus nepakenkdami kūnui.",
lore:"Trečiajame dešimtmetyje amerikiečių išradėjas skelbė sukūręs mikroskopą ir spindulių aparatą. Prietaisai buvo daugybę kartų tirti, veikimo nerasta, o pardavėjai teisti už sukčiavimą.",
f:"Kalbama, kad laboratorija sudegė neatsitiktinai, o įrašai dingo. Prietaisai iki šiol parduodami internetu, dažnai kartu su torsioninių laukų ir vandens struktūrizavimo terminija. Lietuvoje jie pasitaiko sveikatos mugėse."},

{id:"th_detoksas",l:"Detoksas ir parazitai",t:"teorija",y:1993,st:"paneigta",
k:"Visų ligų priežastis esą parazitai ir sukauptos toksinės medžiagos, kurias reikia išvalyti.",
lore:"Sistemą išpopuliarino autorė, teigusi, kad kiekvieną ligą sukelia parazitas ir teršalas, ir siūliusi elektrinį prietaisą. Ji pati mirė nuo vėžio 2009 m.",
f:"Kalbama, kad jos mirtis nieko neįrodo, nes ji buvo apsinuodijusi anksčiau. Populiarios nuotraukos su tuo, kas neva išeina po valymo — dažniausiai tai pačių priemonių sukurtos gleivės. Ši linija yra viena masiškiausių ir lengviausiai parduodamų."},

{id:"th_vandens_atmintis",l:"Vandens atmintis",t:"teorija",y:1988,st:"paneigta",
k:"Vanduo esą įsimena medžiagas, su kuriomis kontaktavo, ir žodžius bei mintis.",
lore:"Prancūzų imunologo publikacija 1988 m. sukėlė skandalą, o pakartotinis tyrimas rezultato nepatvirtino. Vėliau japonų autorius platino kristalų nuotraukas, esą priklausančias nuo pasakytų žodžių.",
f:"Tai homeopatijos gynybos pagrindas ir kartu tiltas į ezoteriką. Kalbama, kad struktūrizuotas vanduo gydo, o mintys keičia jo sandarą. Posovietinėje erdvėje ši linija tiesiogiai jungiasi su televizijos seansais ir torsioniniais laukais."},

{id:"th_amalgama",l:"Amalgamos plombos",t:"teorija",y:1990,st:"ginčytina",
k:"Sidabro spalvos plombose esantis gyvsidabris esą nuolat nuodija organizmą ir sukelia lėtines ligas.",
lore:"Gyvsidabrio amalgamoje tikrai yra, o jo garų išsiskiria minimaliais kiekiais. Odontologų organizacijos medžiagą laiko saugia daugumai, tačiau priežiūros institucijos rekomenduoja atsargumą tam tikroms grupėms, o dalis šalių ją riboja dėl aplinkosaugos.",
f:"Tai retas mazgas su tikru pilkuoju lauku, ir būtent todėl jis efektyvus. Kalbama, kad plombų šalinimas išgydo ligas, o po procedūros pasakojami dramatiški pagerėjimai. Aplink temą susiformavo atskira mokamų paslaugų rinka."},

{id:"th_morgelonai",l:"Morgelonai",t:"teorija",y:2002,st:"paneigta",
k:"Iš odos esą lenda spalvoti pluoštai, kurie yra nežinomos ligos ar technologijos požymis.",
lore:"Sąvoką 2002 m. įvedė motina, ieškojusi paaiškinimo vaiko simptomams. Didelis tyrimas 2012 m. nustatė, kad pluoštai yra medvilnė ir sintetika, o simptomai atitinka aiškinamą odos sutrikimą.",
f:"Kalbama, kad tai chemtrails arba nanotechnologijų pasekmė, o diagnozė apie kliedesius yra būdas nutildyti. Šis mazgas glaudžiai susijęs su persekiojamų individų bendruomene ir dalijasi ta pačia problema — už jo dažnai stovi tikra kančia."},

{id:"th_psichiatrija_mitas",l:"Psichikos ligos kaip mitas",t:"teorija",y:1961,st:"ginčytina",
k:"Psichikos sutrikimai esą nėra ligos, o socialinės kontrolės etiketės.",
lore:"Poziciją suformulavo psichiatras, kritikavęs priverstinį gydymą, ir jo argumentai dėl prievartos buvo rimti bei paveikė teisę. Vėliau ta pati retorika buvo perimta organizacijų, siekiančių atmesti psichiatriją apskritai.",
f:"Kalbama, kad diagnozės sugalvojamos balsavimu, o vaistai kuria priklausomybę, o ne gydo. Kaip atrama naudojami tikri dalykai — lobotomija, sovietinė baudžiamoji psichiatrija. Riba tarp pagrįstos kritikos ir raginimo nutraukti gydymą čia ypač plona."},

// ================= MITYBA IR GRYNUMAS =================
{id:"th_seed_oils",l:"Sėklų aliejai",t:"teorija",y:2018,st:"ginčytina",
k:"Augaliniai aliejai esą yra pagrindinė šiuolaikinių ligų priežastis ir pramonės primesta atlieka.",
lore:"Diskusija apie riebalų rūšis moksle tikrai vyksta, tačiau dabartiniai duomenys augalinių aliejų kaip pagrindinio kaltininko nepatvirtina. Tema sprogo socialiniuose tinkluose apie 2018 m. ir tapo tapatybės ženklu.",
f:"Cirkuliuoja aliejų sąrašas su pavadinimu, primenančiu nusikaltėlių gaują. Kartojama, kad tai atlieka, kuria anksčiau tepdavo mašinas. Cukraus pramonės byla naudojama kaip įrodymas, kad rekomendacijos buvo nuperkamos — ir tai vienintelis tikrai stiprus šios linijos argumentas."},

{id:"th_zalias_pienas",l:"Žalias pienas",t:"teorija",y:2005,st:"ginčytina",
k:"Nepasterizuotas pienas esą yra gyvas ir sveikesnis, o pasterizacija sunaikina jo vertę.",
lore:"Skirtumai maistinėje vertėje nedideli, o rizika susirgti nuo užkrato reali ir dokumentuota protrūkiais. Daugelyje šalių prekyba ribojama.",
f:"Kalbama apie gyvą maistą ir apie tai, kad draudimai gina pramonę, o ne žmones. Tema patogi, nes turi tikrą kaimo ir natūralumo šaknį. Lietuvoje ji dažnai keliauja kartu su nepasitikėjimu maisto priežiūra."},

{id:"th_saules_mityba",l:"Mityba šviesa",t:"teorija",y:1994,st:"paneigta",
k:"Žmogus esą gali gyventi be maisto, semdamasis energijos iš saulės ar prano.",
lore:"Idėją platino keli autoriai, rengę mokamus kursus. Su šia praktika siejamos kelios dokumentuotos mirtys, o patys mokytojai stebėjimo sąlygomis niekada neišlaikė patikrinimų.",
f:"Kalbama, kad mokytojai yra pasiekę lygmenį, o mirusieji tiesiog skubėjo. Ši linija yra kraštutinė grynumo motyvo forma ir viena iš nedaugelio atlase, kur pavojus yra tiesioginis ir greitas."},

{id:"th_farmacija",l:"Farmacijos kartelis",t:"teorija",y:1970,st:"nepatikrinama",
k:"Pramonė esą nesuinteresuota gydyti, nes pelną duoda tik nuolatinis vartojimas.",
lore:"Skirtingai nuo daugelio mazgų, čia faktinė bazė plati: yra dokumentuotų slėpimo, klaidinančios rinkodaros ir kainodaros piktnaudžiavimo atvejų su teismo sprendimais. Teorija iš atskirų atvejų daro visuotinį ketinimą.",
f:"Kartojamas sąrašas: talidomidas, Vioxx, opioidai, cukrus. Kiekvienas iš jų tikras, todėl išvada atrodo neišvengiama. Būtent šis mazgas yra pagrindinis įėjimas į visą sveikatos šaką, ir jį atremti sunkiausia, nes pusė argumentų yra teisingi."},

// ================= ASMENYS =================
{id:"p_bechamp",l:"Antuanas Bešampas",t:"asmuo",y:1860,st:"realus",
k:"Prancūzų chemikas, Pastėro amžininkas ir oponentas, teigęs, kad svarbi ne infekcija, o organizmo būklė.",
lore:"Turėjo savo teoriją apie smulkiausias gyvybės daleles, kuri nepasitvirtino. Ginčas buvo ir mokslinis, ir asmeninis, su kaltinimais plagiatu.",
f:"Vadinamas žmogumi, kurį istorija ištrynė, nes jis buvo teisus. Populiaru sakyti, kad medicina pasuko klaidingu keliu prieš šimtą penkiasdešimt metų ir nuo tada tik gilina klaidą."},

{id:"p_duesberg",l:"Peteris Duesbergas",t:"asmuo",y:1987,st:"realus",
k:"Pripažintas virusologas, paskelbęs, kad ŽIV nesukelia AIDS.",
lore:"Iki tol buvo Nacionalinės mokslų akademijos narys su svaria retrovirusų tyrimų reputacija. Jo pozicija turėjo realių politinių pasekmių Pietų Afrikoje.",
f:"Cituojamas kaip įrodymas, kad net akademijos narys gali būti atskirtas, jei pasako ne tai. Populiarus argumentas: jei jis klysta, kodėl su juo nediskutuoja, o tik šalina. Tai vienas ryškiausių pavyzdžių, kaip autoritetas persineša į kitą sritį."},

{id:"p_hamer",l:"Rykė Gerdas Hameris",t:"asmuo",y:1981,st:"realus",
k:"Germaniškosios naujosios medicinos autorius.",
lore:"Sistemą sukūrė po asmeninės tragedijos, teigdamas radęs universalų dėsnį. Neteko licencijos, buvo teistas, gyveno emigracijoje, mirė 2017 m.",
f:"Sekėjams jis kankinys, kurio atradimą užgniaužė. Populiaru sakyti, kad jo dėsniai patikrinami kiekvienu atveju, jei tik moki skaityti tomogramas. Kritikai nurodo konkrečias mirtis, ir tai paprastai lieka be atsakymo."},

{id:"p_rife",l:"Rojalas Rife'as",t:"asmuo",y:1934,st:"realus",
k:"Išradėjas, skelbęs sukūręs mikroskopą ir aparatą, naikinantį ligų sukėlėjus dažniais.",
lore:"Jo mikroskopo veikimo niekada nepavyko pakartoti, o aparato tyrimai rezultatų nedavė. Mirė nuošalyje, o jo vardas atgimė devintajame dešimtmetyje kartu su prietaisų prekyba.",
f:"Pasakojama, kad jo laboratoriją sunaikino, bylas sudegino, o kolegas įbaugino. Ši istorija turi visus kankinio elementus ir todėl parduoda prietaisus geriau nei bet koks aprašymas."},

{id:"p_clark",l:"Hulda Klark",t:"asmuo",y:1993,st:"realus",
k:"Autorė, teigusi, kad visas ligas sukelia parazitai ir teršalai.",
lore:"Išleido knygas apie visų ligų gydymą ir platino elektrinį prietaisą. Klinika Meksikoje buvo tirta institucijų; ji pati mirė nuo vėžio.",
f:"Sekėjai sako, kad ji per vėlai pritaikė savo metodą sau. Jos knygų pavadinimai su pažadu išgydyti visas ligas iki šiol yra viena stipriausių rinkodaros formuluočių visoje šakoje."},

{id:"p_emoto",l:"Masaru Emoto",t:"asmuo",y:1999,st:"realus",
k:"Autorius, skelbęs, kad vandens kristalai keičia formą priklausomai nuo jiems sakomų žodžių.",
lore:"Nuotraukos buvo atrenkamos be aklo protokolo, o bandymai pakartoti nepavyko. Knygos tapo tarptautiniais bestseleriais.",
f:"Ryžių eksperimentas su indeliais ir užrašais iki šiol kartojamas mokyklose ir seminaruose. Kalbama, kad kadangi žmogus daugiausia yra vanduo, žodžiai keičia kūną tiesiogiai. Tai vienas populiariausių ezoterinių argumentų Lietuvoje."},

// ================= TEKSTAI IR GRUPĖS =================
{id:"t_duesberg",l:"Inventing the AIDS Virus",t:"tekstas",y:1996,st:"pirminis",
k:"Knyga, sistemingai dėstanti, kad ŽIV nesukelia AIDS.",
lore:"Parašyta akademiniu stiliumi su gausiomis nuorodomis, todėl atrodo įtikinamai neturinčiam srities žinių. Būtent forma, o ne turinys, lėmė jos poveikį.",
f:"Cituojama kaip knyga, kurios niekas nepaneigė iš esmės. Populiaru sakyti, kad kritikai atsakė etiketėmis, o ne argumentais."},

{id:"t_hulda",l:"Visų ligų gydymas",t:"tekstas",y:1995,st:"pirminis",
k:"Knyga, siūlanti vieną priežastį ir vieną gydymo schemą visoms ligoms.",
lore:"Struktūra paprasta: parazitas plius teršalas, pašalink abu. Pateikiami sąrašai, prietaiso schemos ir protokolai.",
f:"Vertinama kaip praktinis vadovas, o ne teorija — būtent todėl veiksminga. Kalbama, kad ji buvo persekiojama už tai, kad viską atidavė nemokamai."},

{id:"g_wellness",l:"Alternatyvios sveikatos rinka",t:"grupe",y:1990,st:"reali",
k:"Papildų, prietaisų, seminarų ir klinikų ekonomika, augusi kartu su nepasitikėjimu medicina.",
lore:"Tai reali pramonė su savo mugėmis, leidiniais ir platinimo tinklais. Dalis jos produktų nekenksmingi, dalis pavojingi, o veikimo įrodymai daugeliu atvejų neprivalomi.",
f:"Aplinkoje ji beveik niekada nevadinama pramone — kalbama apie natūralius metodus ir laisvą pasirinkimą. Retai pastebima, kad tie patys žmonės, kurie kaltina farmaciją pelnu, perka iš rinkos, kur nėra nei priežiūros, nei atsakomybės."}

lore:"Susitarimas buvo įslaptintas ir paviešintas tik 1917 m., kai bolševikai atrado dokumentus carinės vyriausybės archyvuose. Jis prieštaravo pažadams, duotiems arabų sukilėliams.",
f:"Tai regiono pamatinis mazgas ir turbūt stipriausias argumentas pasaulyje: slaptas dviejų valstybių susitarimas dėl trečiųjų likimo, kuris pasitvirtino pažodžiui. Kartojama, kad nuo tada niekas nepasikeitė, tik pasirašantieji. Kiekviena nauja siena ar sutartis skaitoma per šį šabloną."},

{id:"e_balfour",l:"Balfouro deklaracija",t:"faktas",y:1917,st:"faktas",
k:"1917 m. Britanijos vyriausybė laiške pažadėjo remti žydų tautinių namų kūrimą Palestinoje.",
lore:"Dokumentas buvo trumpas ir dviprasmiškas, o jo pažadai nesiderino su kitais to paties laikotarpio įsipareigojimais regione. Iš to kilo dešimtmečius trukę ginčai dėl to, kas kam ką pažadėjo.",
f:"Kartojama, kad viena valstybė pažadėjo kitos tautos žemę trečiajai — ir tai formaliai tikslus apibūdinimas. Aplink laiško aplinkybes ir jo adresatą susiformavo atskira aiškinimų šeima apie tai, kas iš tikrųjų priėmė sprendimą."},

{id:"e_protokolai_arabu",l:"Protokolai regione",t:"faktas",y:1926,st:"faktas",
k:"Siono protokolai buvo išversti į arabų kalbą ir XX a. tapo plačiai leidžiamu, kartais valstybės platinamu tekstu.",
lore:"Vertimai pasirodė tarpukariu ir po 1948 m. leidiniai smarkiai išaugo. XXI a. pradžioje pagal juos net buvo sukurtas televizijos serialas. Klastotės įrodymas regione beveik nefigūruoja.",
f:"Kartojama tas pats argumentas kaip Europoje — net jei suklastota, viskas išsipildė. Šis mazgas svarbus, nes rodo, kad Europoje beveik marginalizuotas tekstas persikėlė ir gavo naują gyvenimą su valstybine leidyba."},

{id:"e_lavon",l:"Lavono afera",t:"faktas",y:1954,st:"faktas",
k:"1954 m. Izraelio karinė žvalgyba Egipte surengė sprogdinimus, kad kaltė kristų vietos grupėms.",
lore:"Operacija žlugo, dalyviai buvo sulaikyti, kilo politinė krizė, o gynybos ministras atsistatydino. Vėliau Izraelis operaciją pripažino.",
f:"Tai vienas iš nedaugelio pasaulyje visiškai patvirtintų suklastotos provokacijos atvejų, todėl cituojamas kiekvienoje tokioje diskusijoje. Kartojama: jei tai buvo padaryta ir pripažinta, kodėl netikite, kad daroma dabar. Šis mazgas regione atlieka tokį patį vaidmenį kaip Northwoods JAV."},

{id:"e_ajax",l:"Operacija Ajax",t:"faktas",y:1953,st:"faktas",
k:"1953 m. JAV ir Britanijos žvalgybos organizavo Irano ministro pirmininko nuvertimą.",
lore:"Priežastis buvo naftos pramonės nacionalizavimas. Dešimtmečius tai buvo neigiama, o 2013 m. JAV oficialiai išslaptino dokumentus, patvirtinančius savo vaidmenį.",
f:"Tai regiono etaloninis įrodymas, kad perversmus tikrai organizuoja iš išorės. Kartojama, kad kiekviena nepatogi vyriausybė anksčiau ar vėliau krenta. Po šešiasdešimties metų pasirodęs pripažinimas naudojamas kaip argumentas apie visų kitų neigimų vertę."},

{id:"e_iran_contra",l:"Iran-Contra",t:"faktas",y:1986,st:"faktas",
k:"JAV slapta pardavė ginklus Iranui ir gautas lėšas nukreipė sukilėliams Nikaragvoje, apeidama Kongresą.",
lore:"Schema apėmė kelias valstybes, tarpininkus ir slaptas sąskaitas. Ji buvo atskleista, tirta Kongreso, dalis dalyvių nuteisti, vėliau daugelis malonės tvarka paleisti.",
f:"Cituojama kaip įrodymas, kad vykdomoji valdžia gali metus veikti prieš savo pačios įstatymus. Kartojama, kad nubaudė tik vykdytojus. Šis mazgas jungia regioną su amerikietiška giliosios valstybės linija."},

{id:"e_irako_ginklai",l:"Irako ginklų byla",t:"faktas",y:2003,st:"faktas",
k:"2003 m. karas pradėtas remiantis teiginiais apie masinio naikinimo ginklus, kurių nerasta.",
lore:"Vėlesni tyrimai nustatė, kad žvalgybos medžiaga buvo silpna, o svarbus šaltinis — nepatikimas. Oficialios komisijos konstatavo, kad išvados buvo pateiktos per daug užtikrintai.",
f:"Tai bene dažniausiai cituojamas faktas visame šiuolaikiniame atlase. Kartojama: parodė mėgintuvėlį Jungtinėse Tautose, ir viskas buvo netiesa. Iš to daroma bendra išvada, kad oficialus pagrindimas karui gali būti tiesiog sugalvotas."},

{id:"e_liberty",l:"USS Liberty",t:"faktas",y:1967,st:"ginčytina",
k:"1967 m. kare Izraelio pajėgos apšaudė JAV žvalgybos laivą, žuvo 34 kariai.",
lore:"Oficiali abiejų šalių išvada — klaidinga identifikacija ir chaotiška padėtis. Dalis išgyvenusiųjų iki šiol tvirtina, kad ataka buvo sąmoninga, ir reikalauja naujo tyrimo.",
f:"Šis atvejis ypatingas tuo, kad kalbantieji yra patys nukentėję kariai, o ne pašaliniai. Kartojama, kad laivas buvo pažymėtas vėliava ir puolamas kelias valandas. Tai vienas iš nedaugelio mazgų, kur nesutarimas išlieka tarp rimtų šaltinių."},

// ================= ESCHATOLOGIJA =================
{id:"th_dadzalas",l:"Dadžalo laukimas",t:"teorija",y:800,st:"nepatikrinama",
k:"Prieš pabaigą esą pasirodys vienaakis apgavikas, kuris darys stebuklus ir suklaidins daugumą.",
lore:"Figūra aprašyta ankstyvuosiuose pasakojimuose kaip melagingas mesijas su ženklu ant kaktos. Šiuolaikinėje literatūroje ji dažnai aiškinama ne kaip asmuo, o kaip sistema.",
f:"Populiariausias šiuolaikinis skaitymas — kad vienaakis apgavikas yra ekranas, o dadžalo sistema reiškia žiniasklaidą, bankus ir sekimą. Vienos akies simbolis siejamas su tuo pačiu trikampiu kaip Vakaruose. Tai retas atvejis, kai dvi visiškai skirtingos tradicijos naudoja identišką ikonografiją."},

{id:"b_dadzalas",l:"Dadžalas",t:"butybe",y:800,st:"mitinis",
k:"Melagingas mesijas, kuris prieš pabaigą suklaidins žmoniją stebuklais.",
lore:"Aprašomas kaip vienaakis, o ant jo kaktos esą įrašytas žodis, kurį perskaito tik tikintieji. Jo pasirodymas yra vienas svarbiausių eschatologinių ženklų.",
f:"Kalbama, kad jis jau valdo per sistemas, o fizinis pasirodymas bus paskutinis etapas. Populiaru rodyti logotipus su viena akimi kaip jo ženklus. Ši figūra šiandien atlieka tiksliai tą patį vaidmenį kaip Antikristas Vakaruose."},

{id:"th_mahdi",l:"Mahdžio laukimas",t:"teorija",y:900,st:"nepatikrinama",
k:"Pasirodys esą teisusis vadovas, kuris atkurs teisingumą prieš pat pabaigą.",
lore:"Lūkestis skiriasi skirtingose tradicijose ir istoriškai ne kartą buvo panaudotas politiškai — pretendentų būta kelis kartus per šimtmetį. Kai kurios valstybės ir judėjimai savo veiksmus derina su šiuo grafiku.",
f:"Kalbama, kad įvykiai regione yra ženklai, o ne politika, ir kad grafikas jau prasidėjęs. Kiekvienas karas ar krizė tikrinami pagal ženklų sąrašą. Struktūriškai tai identiška vakarietiškam apokaliptiniam skaičiavimui, tik su kitais vardais."},

{id:"b_dzinai",l:"Džinai",t:"butybe",y:600,st:"mitinis",
k:"Iš ugnies sukurtos būtybės, gyvenančios lygiagrečiai su žmonėmis ir galinčios juos paveikti.",
lore:"Tai ne folkloro personažai, o religinės kosmologijos dalis, todėl regione jais tikima daug plačiau nei Vakaruose vaiduokliais. Jiems priskiriami apsėdimai, ligos ir nepaaiškinami reiškiniai.",
f:"Kalbama, kad tai, ką Vakaruose vadina ateiviais ar šešėliais, iš tikrųjų yra džinai. Šis paaiškinimas regione pakeičia visą pilkųjų ir pagrobimų liniją. Kai kurie autoriai jį perkelia ir į Vakarus kaip alternatyvą tarpdimensinei hipotezei."},

// ================= POLITINIAI NARATYVAI =================
{id:"th_sionizmo_sam",l:"Sionistinio sąmokslo naratyvas",t:"teorija",y:1948,st:"paneigta",
k:"Regiono ir pasaulio įvykius esą valdo vieninga sionistinė struktūra, apimanti bankus, žiniasklaidą ir vyriausybes.",
lore:"Naratyvas susiformavo po 1948 m. ir sujungė realų politinį konfliktą su importuotu europietišku antisemitiniu šablonu. Kritika konkrečiai valstybės politikai ir šis pasakojimas yra du skirtingi dalykai, tačiau viešojoje kalboje jie nuolat maišomi.",
f:"Kartojama, kad tai ne apie tautą, o apie politiką — bet kaltinimų sąrašas ir žodynas paimtas iš Protokolų. Šis mazgas atlase svarbus kaip pavyzdys, kaip tekstas persikelia į kitą kultūrą ir įgyja naują pateisinimą."},

{id:"th_911_zydai",l:"„Keturi tūkstančiai neatėjo“",t:"teorija",y:2001,st:"paneigta",
k:"Per rugsėjo 11-osios išpuolius esą tūkstančiai žydų darbuotojų buvo iš anksto įspėti ir neatvyko į darbą.",
lore:"Teiginys kilo iš klaidingai perpasakoto pranešimo praėjus dienai po išpuolio. Tarp žuvusiųjų buvo šimtai žydų kilmės žmonių. Skaičius nuo pat pradžių neturėjo šaltinio.",
f:"Nepaisant paneigimo, teiginys plito greičiau nei bet kuris kitas rugsėjo 11-osios elementas. Tai geriausias pavyzdys, kaip prie realios tragedijos per parą prisikabina senasis modulis ir jį iš esmės perima."},

{id:"th_naftos_karai",l:"Karai dėl naftos",t:"teorija",y:1973,st:"ginčytina",
k:"Regiono karai esą vyksta ne dėl saugumo, o dėl naftos ir atsiskaitymų valiutos.",
lore:"Energijos ištekliai realiai buvo svarbus veiksnys, ir tai pripažįsta ir oficialūs dokumentai. Teorija tai paverčia vieninteliu paaiškinimu ir prideda teiginį apie valiutą kaip slaptą priežastį.",
f:"Kartojama, kad puolamos tik tos šalys, kurios bandė pereiti prie kitos valiutos. Sąrašas skamba įtikinamai, kol nepatikrini datų. Tai vienas iš tų mazgų, kur tikras veiksnys išpučiamas į vienintelį."},

{id:"th_arabu_pavasaris",l:"Arabų pavasaris kaip projektas",t:"teorija",y:2011,st:"nepatikrinama",
k:"2011 m. sukilimai esą buvo suplanuoti iš išorės, panaudojant socialinius tinklus ir fondų finansavimą.",
lore:"Vakarų organizacijos tikrai rėmė pilietinės visuomenės mokymus regione, o socialiniai tinklai buvo naudojami koordinacijai. Iš to daroma išvada, kad protestai buvo sukurti, o ne paremti.",
f:"Kartojama, kad milijonas žmonių savaime į gatves neišeina. Šis naratyvas regione ir Rusijoje sutampa beveik pažodžiui — spalvotų revoliucijų pasakojimas yra tas pats šablonas. Jis patogus valdžioms, nes paverčia bet kurį protestą importu."},

{id:"th_isis_kurta",l:"„Sukurta iš išorės“",t:"teorija",y:2014,st:"paneigta",
k:"Radikalioji grupuotė esą buvo sukurta ir finansuojama Vakarų ar regiono žvalgybų.",
lore:"Faktinės sėklos realios: ginklų srautai į Sirijos konfliktą, žvalgybos dokumentai apie prognozuotą radikalizaciją, kalėjimai, kuriuose susipažino būsimi vadai. Iš prognozės ir netiesioginių pasekmių daroma išvada apie tikslą.",
f:"Kartojama, kad chaosas buvo užsakytas, o ne nesėkmė. Kaip įrodymas rodomi 2012 m. žvalgybos dokumentai, kuriuose numatyta galima kalifato atsiradimas — prognozė skaitoma kaip planas. Tai vienas dažniausių šiuolaikinių mazgų regione."},

{id:"th_derin_devlet",l:"Gilioji valstybė Turkijoje",t:"teorija",y:1996,st:"ginčytina",
k:"Valstybėje esą veikia nuolatinis sluoksnis, jungiantis saugumo tarnybas, kariškius ir nusikalstamas struktūras.",
lore:"1996 m. automobilio avarija atskleidė ryšius tarp policijos pareigūno, nusikaltėlio ir politiko viename automobilyje — tai tapo įrodymu, kad tokie ryšiai realūs. Vėliau vykę procesai prieš tariamą tinklą patys buvo apkaltinti dokumentų klastojimu.",
f:"Būtent iš čia į pasaulinę kalbą atėjo pati giliosios valstybės sąvoka. Tai retas atvejis, kai teorija turi ir patvirtintą branduolį, ir įrodytą piktnaudžiavimą ja: pirma sluoksnis buvo realus, paskui juo pasinaudota susidorojimui. Kalbant apie tai, paprastai priimama tik viena iš dviejų dalių."},

{id:"th_masonai_regione",l:"Masonų panika regione",t:"teorija",y:1960,st:"nepatikrinama",
k:"Ložės esą yra sionizmo ir Vakarų įtakos įrankis, veikiantis per elitą.",
lore:"Keliose šalyse masonerija buvo uždrausta būtent tokiu pagrindu. Kaltinimų rinkinys atkeliavo iš Europos ir buvo sujungtas su vietiniu kontekstu.",
f:"Kartojama, kad tai ta pati organizacija, kuri Europoje darė revoliucijas, o čia ardo tikėjimą. Populiaru ieškoti simbolių pastatuose ir banknotuose. Šis mazgas rodo, kaip europietiškas šablonas keliauja be jokių pakeitimų, tik gaudamas naują priešą."},

// ================= VEIDRODINIAI NARATYVAI VAKARUOSE =================
{id:"th_eurabija",l:"Eurabija",t:"teorija",y:2005,st:"paneigta",
k:"Europos vadovai esą sudarė slaptą susitarimą su arabų valstybėmis dėl demografinio ir kultūrinio perėmimo.",
lore:"Sąvoką išplėtojo britų autorė, remdamasi tarpvyriausybinio dialogo dokumentais, kuriuos perskaitė kaip slaptą sutartį. Iš šios konstrukcijos tiesiogiai išaugo Didžiojo pakeitimo naratyvas.",
f:"Kartojama, kad susitarimas egzistuoja popieriuje ir jį galima perskaityti. Tai vienas iš dviejų veidrodinių mazgų: vienoje pusėje kalbama apie sionistinį perėmimą, kitoje — apie islamišką, ir abi naudoja tą pačią struktūrą su ta pačia logika."},

{id:"th_taqiyya",l:"Apsimetinėjimo kaltinimas",t:"teorija",y:2006,st:"paneigta",
k:"Musulmonams esą religiškai leidžiama meluoti netikintiesiems, todėl jokie jų pareiškimai negalioja.",
lore:"Sąvoka realiai egzistuoja kaip leidimas slėpti tikėjimą mirtino pavojaus akivaizdoje ir istoriškai buvo persekiojamų mažumų praktika. Vakarietiškoje literatūroje ji perdirbta į bendrą įsakymą apgaudinėti.",
f:"Šis mazgas atlase struktūriškai unikalus: jis iš anksto panaikina bet kokį paneigimą, nes bet koks atsakymas laikomas apgaule. Tai tobula uždara sistema, ir tuo ji primena kaltinimą raganoms, kur ir prisipažinimas, ir neigimas įrodydavo kaltę."},

// ================= ASMENYS IR GRUPĖS =================
{id:"p_mossadegh",l:"Mohamedas Mosadegas",t:"asmuo",y:1953,st:"realus",
k:"Irano ministras pirmininkas, nuverstas po naftos pramonės nacionalizavimo.",
lore:"Buvo išrinktas, siekė perimti naftos pajamas iš britų bendrovės ir nuverstas žvalgybų organizuotu perversmu. Iki gyvenimo pabaigos laikytas namų arešte.",
f:"Jo istorija naudojama kaip įrodymas, kad demokratija leidžiama tik iki tam tikros ribos. Kartojama, kad viskas, kas vyko vėliau, įskaitant 1979 m., yra tos vienos operacijos pasekmė."},

{id:"p_kutb",l:"Sajidas Kutbas",t:"asmuo",y:1964,st:"realus",
k:"Autorius, kurio raštai suformavo modernaus islamizmo pasaulėvaizdį.",
lore:"Po kelionės į JAV parašė aštrią Vakarų visuomenės kritiką, vėliau kalintas ir 1966 m. įvykdyta mirties bausmė. Jo tekstuose pasaulis dalijamas į tikrąją bendruomenę ir visuotinį neišmanymą.",
f:"Cituojamas kaip žmogus, kuris pirmas pamatė sistemą tokią, kokia ji yra. Jo dvinaris pasaulio vaizdas struktūriškai artimas gnostiniam: matomas pasaulis yra apgaulė, o tikrieji valdovai slepiasi už jo."},

{id:"p_batyeor",l:"Bat Ye'or",t:"asmuo",y:2005,st:"realus",
k:"Autorė, sukūrusi Eurabijos sąvoką.",
lore:"Rašė apie mažumų padėtį istorinėse islamo valstybėse, vėliau perėjo prie teiginio, kad Europa sudarė slaptą susitarimą. Jos knygos tapo atskaitos tašku vadinamajai priešinimosi islamizacijai literatūrai.",
f:"Vadinama vienintele, kuri perskaitė dokumentus ir pamatė, kas ten parašyta. Jos konstrukcija vėliau buvo perimta autorių, kurie jos pačios darbų neskaitė."},

{id:"g_brolija",l:"Musulmonų brolija",t:"grupe",y:1928,st:"reali",
k:"1928 m. Egipte įkurta organizacija, veikianti kaip religinis, socialinis ir politinis judėjimas.",
lore:"Per šimtmetį ji buvo ir persekiojama, ir valdžioje, o skirtingos valstybės vertina ją nevienodai — nuo legalios partijos iki uždraustos organizacijos. Aplink ją susiformavo teorijos abiejose pusėse.",
f:"Regione ji kaltinama darbu užsienio naudai, o Vakaruose — slaptu skverbimusi į institucijas. Tai vienas iš nedaugelio mazgų, kurį priešingos stovyklos naudoja vienodai, tik su skirtingu užsakovu."},

// ================= TEKSTAI =================
{id:"t_kutb",l:"Kelio ženklai",t:"tekstas",y:1964,st:"pirminis",
k:"Knyga, dalijanti pasaulį į tikrąją bendruomenę ir visuotinį neišmanymo būvį.",
lore:"Parašyta kalėjime ir tapo įtakingiausiu XX a. islamizmo tekstu. Jos struktūra paprasta ir todėl lengvai perduodama.",
f:"Cituojama kaip tekstas, kuris viską paaiškina vienu perskyrimu. Populiaru pabrėžti, kad autorius už jį sumokėjo gyvybe, ir tai laikoma teisumo įrodymu."},

{id:"t_eurabija",l:"Eurabija",t:"tekstas",y:2005,st:"pirminis",
k:"Knyga, pristatanti Europos ir arabų dialogo dokumentus kaip slaptą perėmimo susitarimą.",
lore:"Autorė remiasi realiais tarpvyriausybinio bendradarbiavimo tekstais ir juos aiškina kaip sutartį dėl kultūrinio pasidavimo. Metodas — skaityti diplomatinę kalbą pažodžiui ir kaip ketinimą.",
f:"Naudojama kaip įrodymas su nuorodomis, ir būtent nuorodų gausa daro įspūdį. Kartojama, kad viskas paskelbta viešai, tik niekas neskaito — ta pati frazė, kuri vartojama kalbant apie Davosą ir Jungtines Tautas."}
