name: Deploy game API (Cloudflare Worker)

# Diegia worker/ į Cloudflare. Paslaptys (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   – teisės: Workers Scripts Edit + D1 Edit
#   CLOUDFLARE_ACCOUNT_ID  – paskyros ID iš Cloudflare skydelio
# Lentelės kuriamos kaskart (idempotentiška), o briaunos ir lygiai įkeliami tik tada,
# kai duombazė tuščia arba paleidžiant rankomis su „seed“ varnele.

on:
  push:
    branches: [main]
    paths: ["worker/**", ".github/workflows/worker.yml"]
  workflow_dispatch:
    inputs:
      seed:
        description: "Iš naujo įkelti lygius ir briaunas į D1"
        type: boolean
        default: false

concurrency:
  group: worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: "false"
      DB_NAME: conspiracy-map
      READY: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      # Klijuojant iš Cloudflare lango į raktą kartais patenka eilutės lūžis ar tarpas,
      # ir tada Authorization antraštė tampa netinkama. Nuvalom patys.
      - name: Nuvalom raktus
        if: env.READY == 'true'
        run: |
          t=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          a=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
          echo "::add-mask::$t"
          echo "::add-mask::$a"
          echo "CLOUDFLARE_API_TOKEN=$t" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_ACCOUNT_ID=$a" >> "$GITHUB_ENV"
          echo "Token'o ilgis: ${#t} simb., paskyros ID: ${#a} simb."

      - name: Ar yra raktai
        if: env.READY != 'true'
        run: |
          echo "::notice::Nėra CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID – diegimas praleistas."
          echo "Įdėk juos: Settings → Secrets and variables → Actions." >> "$GITHUB_STEP_SUMMARY"

      # Jei į paslaptį pateko ne vien raktas (pvz. visa „curl“ eilutė su žodžiu
      # Bearer), wrangler'io klaidos būna nesuprantamos. Pasakom tai iš karto.
      - name: Ar raktas galioja
        if: env.READY == 'true'
        run: |
          code=$(curl -s -o /tmp/verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            https://api.cloudflare.com/client/v4/user/tokens/verify)
          if [ "$code" != "200" ]; then
            echo "::error::Cloudflare atmetė raktą (HTTP $code). Į CLOUDFLARE_API_TOKEN reikia įklijuoti TIK patį raktą (apie 40 simbolių) – be žodžio Bearer, be kabučių ir be viso curl pavyzdžio."
            jq -r '.errors[]? | "  - \(.message) [kodas \(.code)]"' /tmp/verify.json 2>/dev/null || cat /tmp/verify.json
            exit 1
          fi
          echo "Raktas galioja."

      - uses: actions/setup-node@v4
        if: env.READY == 'true'
        with:
          node-version: 22
      - run: npm install --no-save wrangler@4
        if: env.READY == 'true'

      # Duombazės ieškom pagal pavadinimą ir, jei jos nėra, sukuriam. Taip ID nereikia
      # niekur įrašinėti ranka – wrangler.toml jis įrašomas prieš pat diegimą.
      - name: D1 duombazė
        if: env.READY == 'true'
        run: |
          find_id() { npx wrangler d1 list --json | jq -r --arg n "$DB_NAME" '.[] | select(.name==$n) | .uuid' | head -1; }
          id=$(find_id)
          if [ -z "$id" ]; then
            echo "Duombazės „$DB_NAME“ nėra – sukuriam."
            npx wrangler d1 create "$DB_NAME"
            id=$(find_id)
          fi
          if [ -z "$id" ]; then
            echo "::error::Nepavyko rasti ar sukurti D1 duombazės „$DB_NAME“. Ar rakte duota teisė „D1 Edit“?"
            exit 1
          fi
          echo "D1=$id" >> "$GITHUB_ENV"
          sed -i "s|^database_id = .*|database_id = \"$id\"|" wrangler.toml
          echo "D1 duombazė: $DB_NAME ($id)"

      - name: Lentelės
        if: env.READY == 'true'
        run: npx wrangler d1 execute $D1 --remote --yes --file=schema.sql

      - name: Ar duombazėje jau yra briaunų
        if: env.READY == 'true'
        id: have
        run: |
          n=$(npx wrangler d1 execute $D1 --remote --yes --json \
                --command "SELECT COUNT(*) AS n FROM edges" | jq -r '.[0].results[0].n')
          echo "edges=$n" >> "$GITHUB_OUTPUT"
          echo "Briaunų duombazėje: $n"

      - name: Lygiai ir briaunos
        if: env.READY == 'true' && (steps.have.outputs.edges == '0' || inputs.seed)
        run: npx wrangler d1 execute $D1 --remote --yes --file=seed.sql

      - name: Diegiam Worker'į
        if: env.READY == 'true'
        run: npx wrangler deploy | tee /tmp/deploy.log

      # Iškart patikrinam, ar API atsiliepia ir ar duombazėje yra lygių bei briaunų:
      # be jų rezultatų priimti neįmanoma, o žaidžiant tai pamatytum per vėlai.
      - name: Ar API atsiliepia
        if: env.READY == 'true'
        run: |
          url=$(grep -o 'https://[A-Za-z0-9.-]*\.workers\.dev' /tmp/deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::warning::Diegimo išvestyje adreso nerasta – patikrink rankomis."
            exit 0
          fi
          echo "### Žaidimo API paleista" >> "$GITHUB_STEP_SUMMARY"
          echo "- Adresas: \`$url\`" >> "$GITHUB_STEP_SUMMARY"
          h=$(curl -s --max-time 20 "$url/health" || true)
          echo "Sveikatos patikra: $h"
          echo "- Būsena: \`$h\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$(printf '%s' "$h" | jq -r '.ok // false' 2>/dev/null)" != "true" ]; then
            echo "::warning::Duombazėje dar nėra lygių ar briaunų. Paleisk šią darbo eigą rankomis su „seed“ varnele."
          else
            echo "Įjungimui: site/index.html eilutėje const GAME_API = \"\" įrašyk $url" >> "$GITHUB_STEP_SUMMARY"
          fi
