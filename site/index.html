<!doctype html>
<!-- Statinė kalba – anglų (taip mato paieškos sistemos ir socialiniai tinklai);
     applyStatic() ją pakeičia į tikrąją vartotojo kalbą iškart užsikrovus. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conspiracy Map</title>
<meta name="description" content="An interactive map of 371 conspiracy theories and the people, places and organizations they mention — who is accused, who promoted them, who was targeted. Built from Wikipedia and Wikidata.">
<meta name="theme-color" content="#07080d">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://garbana.github.io/conspiracy-map/">
<link rel="alternate" hreflang="en" href="https://garbana.github.io/conspiracy-map/?lang=en">
<link rel="alternate" hreflang="lt" href="https://garbana.github.io/conspiracy-map/?lang=lt">
<link rel="alternate" hreflang="x-default" href="https://garbana.github.io/conspiracy-map/">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Conspiracy Map">
<meta property="og:url" content="https://garbana.github.io/conspiracy-map/">
<meta property="og:title" content="Conspiracy Map">
<meta property="og:description" content="An interactive map of 371 conspiracy theories and the people, places and organizations they mention — who is accused, who promoted them, who was targeted. Built from Wikipedia and Wikidata.">
<meta property="og:image" content="https://garbana.github.io/conspiracy-map/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="A network map of conspiracy theories and the people, places, organizations and events they mention.">
<meta property="og:locale" content="en_US">
<meta property="og:locale:alternate" content="lt_LT">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #07080d; --bg2: #0d0f18; --panel: rgba(14, 16, 26, .92); --line: rgba(255,255,255,.08);
  --text: #e6e3da; --muted: #8d8a82; --faint: #5b5a56; --accent: #d4a84a; --accent2: #f0cf82;
  --radius: 12px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
  font: 14px/1.5 Inter, system-ui, sans-serif; overflow: hidden; }
#graph { position: fixed; inset: 0;
  background: radial-gradient(ellipse at 50% 45%, #121526 0%, var(--bg) 70%); }
button, input, select { font: inherit; color: inherit; }
a { color: var(--accent2); }

/* ---------- kairysis skydas ---------- */
#side { position: fixed; top: 16px; left: 16px; bottom: 16px; width: 320px; z-index: 5;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  backdrop-filter: blur(10px); display: flex; flex-direction: column; overflow: hidden; }
#side header { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); position: relative; }
#lang { position: absolute; top: 14px; right: 14px; padding: 2px; }
#lang button { flex: none; padding: 3px 8px; font-size: 11px; font-weight: 600; letter-spacing: .06em; }
#side header h1 { margin-right: 76px; }
h1 { font: 700 26px/1.05 "Cormorant Garamond", serif; margin: 0; letter-spacing: .01em; }
h1 span { color: var(--accent); }
.sub { color: var(--muted); font-size: 12px; margin-top: 6px; }
#side .scroll { overflow-y: auto; padding: 14px 20px 20px; flex: 1; }
.label { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
  margin: 16px 0 8px; display: flex; justify-content: space-between; align-items: center; }
.label:first-child { margin-top: 0; }
.label button { background: none; border: 0; color: var(--faint); cursor: pointer; font-size: 11px;
  letter-spacing: .05em; text-transform: none; padding: 0; }
.label button:hover { color: var(--accent2); }

#search-wrap { position: relative; }
#search { width: 100%; padding: 10px 12px; background: var(--bg2); border: 1px solid var(--line);
  border-radius: 8px; outline: none; }
#search:focus { border-color: var(--accent); }
#results { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; z-index: 10;
  background: #11131e; border: 1px solid var(--line); border-radius: 8px; max-height: 320px;
  overflow-y: auto; display: none; }
#results div { padding: 8px 12px; cursor: pointer; display: flex; gap: 8px; align-items: center; }
#results div:hover, #results div.on { background: rgba(212,168,74,.12); }
#results small { color: var(--muted); margin-left: auto; font-size: 11px; white-space: nowrap; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 99px;
  border: 1px solid var(--line); background: transparent; cursor: pointer; font-size: 12.5px;
  color: var(--muted); transition: all .15s; user-select: none; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.chip.on { color: var(--text); border-color: rgba(255,255,255,.22); background: rgba(255,255,255,.05); }
.chip:not(.on) .dot { opacity: .35; }
.chip .n { color: var(--faint); font-size: 11px; }

.row { display: flex; align-items: center; gap: 10px; }
input[type=range] { flex: 1; accent-color: var(--accent); }
select { width: 100%; padding: 8px 10px; background: var(--bg2); border: 1px solid var(--line);
  border-radius: 8px; }
.toggle { display: flex; align-items: center; gap: 8px; cursor: pointer; color: var(--muted);
  font-size: 13px; margin-top: 8px; }
.toggle input { accent-color: var(--accent); }
.seg { display: flex; background: var(--bg2); border: 1px solid var(--line); border-radius: 8px; padding: 3px; }
.seg button { flex: 1; background: none; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer;
  color: var(--muted); font-size: 12.5px; }
.seg button.on { background: rgba(212,168,74,.16); color: var(--accent2); }
.sumnote { color: var(--faint); font-size: 12px; margin: 6px 0 0; font-style: italic; }
#stats { color: var(--faint); font-size: 12px; margin-top: 18px; line-height: 1.6; }
#side footer { padding: 12px 20px; border-top: 1px solid var(--line); font-size: 11px; color: var(--faint); }
#side footer a { color: var(--muted); }

/* ---------- dešinysis skydas (kortelė) ---------- */
#card { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 380px; z-index: 5;
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  backdrop-filter: blur(10px); display: none; flex-direction: column; overflow: hidden; }
#card.open { display: flex; }
#card .head { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); position: relative; }
#card .close { position: absolute; top: 12px; right: 12px; background: none; border: 0;
  color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 4px 8px; }
#card .close:hover { color: var(--text); }
/* Telefone – rankenėlė lapui suskleisti / išskleisti */
#card-grab { display: none; width: 100%; background: none; border: 0; padding: 8px 0 6px; cursor: pointer; }
#card-grab::before { content: ""; display: block; width: 38px; height: 4px; margin: 0 auto;
  border-radius: 2px; background: rgba(255,255,255,.22); }
#card h2 { font: 700 24px/1.15 "Cormorant Garamond", serif; margin: 6px 28px 4px 0; }
#card .lt { color: var(--muted); font-style: italic; margin-bottom: 6px; }
.badge { display: inline-block; font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 4px; font-weight: 600; }
.meta { color: var(--muted); font-size: 12.5px; margin-top: 8px; }
.meta b { color: var(--text); font-weight: 500; }
#card .scroll { overflow-y: auto; padding: 16px 20px 24px; flex: 1; }
.summary { color: #cfccc4; line-height: 1.65; white-space: pre-line; }
.summary.short { max-height: 11.5em; overflow: hidden; -webkit-mask-image: linear-gradient(#000 70%, transparent); mask-image: linear-gradient(#000 70%, transparent); }
.more { background: none; border: 0; color: var(--accent2); cursor: pointer; padding: 4px 0; font-size: 13px; margin-right: 16px; }
.links a { display: inline-block; margin: 10px 14px 0 0; font-size: 13px; }
.links button.share { display: inline-flex; align-items: center; gap: 6px; margin: 10px 14px 0 0;
  padding: 5px 11px; font-size: 13px; cursor: pointer; color: var(--accent2); border-radius: 7px;
  background: rgba(212,168,74,.12); border: 1px solid rgba(212,168,74,.28); }
.links button.share:hover { background: rgba(212,168,74,.2); }
.links button.share.ok { color: #4fd1a5; background: rgba(79,209,165,.12); border-color: rgba(79,209,165,.3); }
.links input.share { margin: 10px 0 0; width: 100%; font-size: 12px; padding: 6px 8px; color: var(--text);
  background: var(--bg2); border: 1px solid var(--line); border-radius: 7px; }
.group h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
  margin: 22px 0 8px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
.group h3 .n { color: var(--faint); }
.conn { display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin: 0 -8px;
  border-radius: 6px; cursor: pointer; }
.conn:hover { background: rgba(255,255,255,.05); }
.conn .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
.conn .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.conn .w { width: 38px; height: 3px; background: rgba(255,255,255,.08); border-radius: 2px; flex: none; }
.conn .w i { display: block; height: 100%; background: var(--accent); border-radius: 2px; }
.conn .lead { color: var(--accent); font-size: 10px; }
.showall { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 6px 0; }
.showall:hover { color: var(--accent2); }

/* ---------- žaidimas „Kelias pas anunakius“ ---------- */
#play { display: flex; align-items: center; gap: 10px; width: 100%; margin-bottom: 18px; padding: 11px 13px;
  cursor: pointer; text-align: left; border-radius: 10px; color: var(--text);
  background: linear-gradient(135deg, rgba(212,168,74,.18), rgba(95,180,255,.1));
  border: 1px solid rgba(212,168,74,.35); }
#play:hover { border-color: var(--accent); background: linear-gradient(135deg, rgba(212,168,74,.26), rgba(95,180,255,.14)); }
#play .ico { font-size: 19px; flex: none; }
#play b { display: block; font: 600 13.5px Inter, sans-serif; }
#play span.s { color: var(--muted); font-size: 11.5px; }

#game { display: none; }
#game.on { display: block; }
#side.playing .scroll > :not(#game) { display: none; }
#game .lvl { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
#game .lvl b { font: 700 19px "Cormorant Garamond", serif; letter-spacing: .02em; }
#game .lvl .of { color: var(--faint); font-size: 11.5px; }
#game .goal { color: var(--muted); font-size: 12.5px; line-height: 1.5; margin-bottom: 14px; }
#game .goal b { color: var(--text); }
#g-meters { display: flex; gap: 8px; margin-bottom: 14px; }
#g-meters div { flex: 1; text-align: center; padding: 8px 4px; border-radius: 8px;
  background: var(--bg2); border: 1px solid var(--line); }
#g-meters .v { font: 600 17px Inter, sans-serif; color: var(--text); }
#g-meters .k { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 2px; }
#g-meters .warn .v { color: #ff9f5a; }
#g-meters .bad .v { color: #ff6b6b; }
#g-steps { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; font-size: 12px; }
#g-steps span { padding: 3px 8px; border-radius: 6px; background: rgba(212,168,74,.12); color: var(--accent2); }
#g-steps span.now { background: var(--accent); color: #07080d; font-weight: 600; }
#game .btns { display: flex; gap: 6px; flex-wrap: wrap; }
#game button.gb { flex: 1; min-width: 92px; padding: 8px 10px; font-size: 12.5px; cursor: pointer;
  border-radius: 8px; color: var(--text); background: var(--bg2); border: 1px solid var(--line); }
#game button.gb:hover:not(:disabled) { border-color: var(--accent); color: var(--accent2); }
#game button.gb:disabled { opacity: .4; cursor: default; }
#game button.gb.main { background: rgba(212,168,74,.16); border-color: rgba(212,168,74,.4); color: var(--accent2); }
#g-hint { margin: 12px 0 0; padding: 9px 11px; border-radius: 8px; font-size: 12.5px; line-height: 1.5;
  background: rgba(95,180,255,.1); border: 1px solid rgba(95,180,255,.25); color: #cfccc4; }
#g-hint.warn { background: rgba(255,107,107,.1); border-color: rgba(255,107,107,.3); }
#g-result { margin-top: 16px; padding: 14px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); }
#g-result h3 { margin: 0 0 4px; font: 700 20px "Cormorant Garamond", serif; color: var(--accent2); }
#g-result .score { font: 700 30px Inter, sans-serif; color: var(--text); line-height: 1.1; margin: 8px 0 2px; }
#g-result .det { color: var(--muted); font-size: 12px; line-height: 1.6; margin-bottom: 12px; }
#g-result input { width: 100%; margin-bottom: 8px; padding: 8px 10px; font-size: 13px; color: var(--text);
  background: var(--bg); border: 1px solid var(--line); border-radius: 8px; }
#g-board { margin-top: 18px; }
#g-board table { width: 100%; border-collapse: collapse; font-size: 12px; }
#g-board td { padding: 5px 4px; border-top: 1px solid var(--line); color: var(--muted); }
#g-board td:first-child { color: var(--faint); width: 26px; }
#g-board td.n { color: var(--text); }
#g-board td:last-child { text-align: right; color: var(--accent2); font-weight: 600; }
#g-board tr.done td.n::after { content: " ✓"; color: #4fd1a5; }

/* ---------- kelio juosta ir žymos ---------- */
#trailbar { position: fixed; top: 16px; left: 352px; right: 16px; z-index: 6; display: none;
  align-items: center; gap: 8px; padding: 7px 8px 7px 12px; font-size: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; backdrop-filter: blur(10px); }
#trailbar.on { display: flex; }
#card.open ~ #trailbar { right: 412px; }
#trailbar .lbl { flex: none; font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
#g-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 20px; font-size: 11px;
  letter-spacing: .04em; text-transform: none; background: rgba(212,168,74,.16); color: var(--accent2); font-weight: 600; }
#g-chip.warn { background: rgba(255,159,90,.18); color: #ff9f5a; }
#g-chip b { font-size: 12.5px; }
#crumbs { flex: 1; min-width: 0; display: flex; align-items: center; gap: 2px; overflow-x: auto; scrollbar-width: none; }
#crumbs::-webkit-scrollbar { display: none; }
#crumbs .crumb { flex: none; max-width: 200px; display: inline-flex; align-items: center; gap: 6px;
  background: none; border: 0; cursor: pointer; color: var(--muted); padding: 3px 8px; border-radius: 6px; }
#crumbs .crumb .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#crumbs .crumb .i { flex: none; width: 17px; height: 17px; border-radius: 50%; display: grid; place-items: center;
  font-size: 10px; font-weight: 600; background: rgba(212,168,74,.16); color: var(--accent2); }
#crumbs .crumb:hover { background: rgba(255,255,255,.05); color: var(--text); }
#crumbs .crumb.on { color: var(--text); background: rgba(212,168,74,.14); }
#crumbs .crumb.on .i { background: var(--accent); color: #07080d; }
#crumbs .sep { flex: none; color: var(--faint); }
#trailbar .hint { flex: none; color: var(--faint); font-size: 11.5px; }
#g-hint-bar { flex: none; background: rgba(95,180,255,.14); border: 1px solid rgba(95,180,255,.3); cursor: pointer;
  font-size: 13px; line-height: 1; padding: 5px 8px; border-radius: 7px; }
#g-hint-bar:hover { background: rgba(95,180,255,.24); }
#trail-end { flex: none; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 17px;
  line-height: 1; padding: 3px 7px; border-radius: 6px; }
#trail-end:hover { color: var(--accent2); background: rgba(255,255,255,.05); }
/* Sigma briaunas piešia po mazgais, todėl paryškintas linijas piešiam patys – virš burbulų */
#glow { position: fixed; inset: 0; pointer-events: none; z-index: 1; }
#trail { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
.tmark { position: absolute; transform: translate(-50%, -50%); border-radius: 50%;
  border: 1.5px solid rgba(212,168,74,.75); box-shadow: 0 0 9px rgba(212,168,74,.3); }
.tmark.cur { border: 2px solid var(--accent2); box-shadow: 0 0 16px rgba(240,207,130,.55); }
.tmark i { position: absolute; top: -8px; left: -10px; font: 600 9.5px/1 Inter, sans-serif; font-style: normal;
  color: #07080d; background: rgba(212,168,74,.9); border-radius: 7px; padding: 3px 5px; }
.tmark.cur i { background: var(--accent2); }

/* ---------- „Apie" langas ---------- */
#side footer #about-btn { background: none; border: 0; padding: 0 0 8px; cursor: pointer;
  color: var(--accent2); font-size: 11.5px; text-decoration: underline; text-underline-offset: 2px; }
#side footer #about-btn:hover { color: var(--accent); }
#about { position: fixed; inset: 0; z-index: 40; display: none; padding: 24px;
  background: rgba(4,5,9,.74); backdrop-filter: blur(4px); }
#about.open { display: grid; place-items: center; }
#about .sheet { position: relative; width: min(720px, 100%); max-height: min(86vh, 920px);
  background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  display: flex; flex-direction: column; overflow: hidden; }
#about .close { position: absolute; top: 12px; right: 12px; background: none; border: 0; z-index: 1;
  color: var(--muted); font-size: 22px; cursor: pointer; line-height: 1; padding: 4px 8px; }
#about .close:hover { color: var(--text); }
#about .scroll { overflow-y: auto; padding: 28px 32px 32px; }
#about h2 { font: 700 27px/1.15 "Cormorant Garamond", serif; margin: 0 28px 2px 0; }
#about h2 + .sub { color: var(--muted); font-size: 12.5px; margin-bottom: 4px; }
#about h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
  font-weight: 500; margin: 26px 0 8px; }
#about p, #about ul { color: #cfccc4; line-height: 1.65; margin: 0 0 10px; }
#about ul { padding-left: 18px; }
#about li { margin-bottom: 5px; }
#about li b, #about p b { color: var(--text); font-weight: 600; }
#about .lead-note { border-left: 2px solid var(--accent); padding: 2px 0 2px 14px; color: var(--text); }
#about .fine { color: var(--muted); font-size: 12.5px; }

/* ---------- legenda, loader, mobilus ---------- */
#legend { position: fixed; bottom: 16px; left: 352px; z-index: 4; display: flex; flex-wrap: wrap;
  gap: 4px 14px; max-width: calc(100vw - 760px); font-size: 12px; color: var(--muted);
  background: rgba(7,8,13,.6); padding: 8px 12px; border-radius: 8px; }
#legend span { display: inline-flex; align-items: center; gap: 6px; }
#legend .dot { width: 8px; height: 8px; border-radius: 50%; }
#zoom { position: fixed; right: 16px; bottom: 16px; z-index: 4; display: flex; flex-direction: column; gap: 4px; }
#card.open ~ #zoom { right: 412px; }
#zoom button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line);
  background: var(--panel); cursor: pointer; font-size: 18px; }
#zoom button:hover { border-color: var(--accent); }
#loader { position: fixed; inset: 0; display: grid; place-items: center; z-index: 20; background: var(--bg);
  transition: opacity .6s; }
#loader div { text-align: center; }
#loader .big { font: 700 34px "Cormorant Garamond", serif; }
#loader .big span { color: var(--accent); }
#loader p { color: var(--muted); }
#menu-btn { display: none; }
#clabels { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
.clabel { position: absolute; transform: translate(-50%, -50%); text-align: center; white-space: nowrap;
  font: 600 15px/1.1 "Cormorant Garamond", serif; letter-spacing: .04em; text-transform: uppercase;
  color: rgba(255,255,255,.75); text-shadow: 0 0 6px #07080d, 0 0 12px #07080d; transition: opacity .2s; }
.clabel small { display: block; font: 500 10px Inter, sans-serif; letter-spacing: .08em; opacity: .6; margin-top: 3px; }
#clabels.off .clabel { opacity: 0; }
#tooltip { position: fixed; pointer-events: none; z-index: 30; background: #11131e; border: 1px solid var(--line);
  border-radius: 8px; padding: 8px 10px; max-width: 280px; font-size: 12.5px; display: none; }
#tooltip b { display: block; font-weight: 600; }
#tooltip span { color: var(--muted); }

@media (max-width: 900px) {
  #side { top: auto; left: 0; right: 0; bottom: 0; width: auto; max-height: 70vh; border-radius: 14px 14px 0 0;
    transform: translateY(calc(100% - 64px)); transition: transform .25s; }
  #side.open { transform: none; }
  #side header { cursor: pointer; padding: 14px 16px; }
  #side header .sub { display: none; }
  #side .scroll, #side footer { padding-left: 16px; padding-right: 16px; }
  h1 { font-size: 22px; }
  /* Kortelė – apatinis lapas: viršuje lieka matomas žemėlapis su pažymėtu mazgu */
  #card { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 58vh; border-radius: 14px 14px 0 0; z-index: 8; }
  #card.peek { height: 124px; }
  #card .head { padding: 6px 20px 12px; }
  #card-grab { display: block; }
  #trailbar { top: 8px; left: 8px; right: 8px; padding-left: 10px; }
  #card.open ~ #trailbar { right: 8px; }

    const ux = dx / len, uy = dy / len;              // liniją trumpinam iki burbulų kraštų
    glowCtx.beginPath();
    glowCtx.moveTo(p.x + ux * ra, p.y + uy * ra);
    glowCtx.lineTo(q.x - ux * rb, q.y - uy * rb);
    glowCtx.strokeStyle = g.c;
    glowCtx.lineWidth = g.w;
    glowCtx.shadowBlur = g.trail ? 9 : 0;
    glowCtx.shadowColor = g.trail ? "rgba(212,168,74,.55)" : "transparent";
    glowCtx.stroke();
  }
  glowCtx.shadowBlur = 0;
}

function hexA(hex, a) {
  const v = parseInt(hex.slice(1), 16);
  return `rgba(${v >> 16},${(v >> 8) & 255},${v & 255},${a.toFixed(2)})`;
}

function drawHover(ctx, d, settings) {
  if (!selectable(d.key)) return;   // nesusijusios teorijos neužsidega
  const size = settings.labelSize, font = settings.labelFont;
  ctx.font = `600 ${size}px ${font}`;
  const w = ctx.measureText(d.label).width + 12;
  ctx.fillStyle = "rgba(14,16,26,.95)";
  ctx.strokeStyle = "rgba(255,255,255,.18)";
  ctx.beginPath();
  ctx.roundRect(d.x + d.size + 4, d.y - size / 2 - 5, w, size + 10, 5);
  ctx.fill(); ctx.stroke();
  ctx.fillStyle = "#fff";
  ctx.fillText(d.label, d.x + d.size + 10, d.y + size / 3);
  ctx.beginPath(); ctx.arc(d.x, d.y, d.size + 2, 0, Math.PI * 2);
  ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.5; ctx.stroke();
}

// ---------- lietimas (telefonai) ----------
// Sigma "click" sugeneruoja tik jei pirštas visai nepajudėjo, o mazgai maži – todėl patys
// atpažįstam bakstelėjimą ir parenkam artimiausią matomą mazgą aplink piršto vietą.
//
// Svarbu: keičiant mastelį, nuėmus pirmą pirštą Sigma iš naujo praneša "touchdown" su likusiu
// pirštu ir tuoj pat "touchup" – be to, ką sekam patys, tai atrodo kaip tobulas bakstelėjimas
// ir pažymėdavo atsitiktinę teoriją. Todėl bakstelėjimu laikom tik judesį, kuris nuo pradžios
// iki galo buvo vieno piršto, baigėsi nuėmus visus pirštus ir netrukus po mastelio keitimo.
function setupTouchTap() {
  const TAP_MOVE = 10, TAP_MS = 400, HIT_R = 24, CALM = 450;
  let tap = null, multiGesture = false, calmUntil = 0;
  const tc = renderer.getTouchCaptor();

  const gotMulti = () => { tap = null; multiGesture = true; calmUntil = Date.now() + CALM; };

  tc.on("touchdown", (e) => {
    if (e.touches.length !== 1) return gotMulti();
    const p = e.touches[0];
    tap = Date.now() < calmUntil ? null : { x: p.x, y: p.y, lx: p.x, ly: p.y, t: Date.now(), moved: 0 };
  });

  tc.on("touchmove", (e) => {
    if (e.touches.length !== 1) return gotMulti();
    if (!tap) return;
    const p = e.touches[0];
    tap.moved += Math.hypot(p.x - tap.lx, p.y - tap.ly);   // kaupiam visą nueitą kelią
    tap.lx = p.x;
    tap.ly = p.y;
    if (tap.moved > TAP_MOVE) tap = null;                  // tai stūmimas
  });

  tc.on("touchup", (e) => {
    const t = tap;
    tap = null;
    if (e.touches && e.touches.length) return;             // ant ekrano dar yra pirštų
    const wasMulti = multiGesture;
    multiGesture = false;
    if (!t || wasMulti || Date.now() < calmUntil || Date.now() - t.t > TAP_MS) return;
    const id = nearestNode(t.x, t.y, HIT_R);
    // Sigma retkarčiais pati sugeneruoja paspaudimą – nesirenkam to paties mazgo dukart
    if (id && !(id === state.selected && Date.now() - (state.pickedAt || 0) < 500)) select(id, false);
  });
}

function nearestNode(x, y, maxDist) {
  let best = null, bestD = maxDist;
  graph.forEachNode((id, a) => {
    if (!visible(a.raw) && id !== state.selected && !state.path.has(id)) return;
    if (!selectable(id)) return;   // kelio režime bakstelėjimas pataiko tik į susijusius
    const d = renderer.getNodeDisplayData(id);
    if (!d || d.hidden) return;
    const v = renderer.framedGraphToViewport(d);
    const dist = Math.hypot(v.x - x, v.y - y) - renderer.scaleSize(d.size);
    // Teorijoms – nedidelis pranašumas, kad būtų lengviau pataikyti
    const bias = a.raw.k === "theory" ? 4 : 0;
    if (dist - bias < bestD) { bestD = dist - bias; best = id; }
  });
  return best;
}

// ---------- klasterių etiketės ----------
function buildClusterLabels() {
  const box = $("clabels");
  box.innerHTML = (data.clusters || []).map((c) =>
    `<div class="clabel" data-c="${c.id}" style="color:${hexA(CLUSTER_PAL[c.id % CLUSTER_PAL.length], .9)}">` +
    `${esc(c[LANG] || c.en || c.top)}<small>${T("cl_n", c.n)} · ${c.themes.map((t) => esc(L(THEMES[t]))).join(" · ")}</small></div>`).join("");
}
function placeClusterLabels() {
  const box = $("clabels");
  const focus = state.hovered || state.selected;
  box.classList.toggle("off", !!focus || state.colorBy !== "cluster");
  // Didesni klasteriai – pirmi; persidengiantys mažesni slepiami (priartinus atsiras)
  const els = [...box.children].map((el) => ({ el, c: data.clusters.find((x) => x.id === +el.dataset.c) }))
    .sort((a, b) => b.c.n - a.c.n);
  const placed = [];
  for (const { el, c } of els) {
    const p = renderer.graphToViewport({ x: c.x, y: c.y });
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    el.style.display = "";
    const w = el.offsetWidth, h = el.offsetHeight;
    const r = { l: p.x - w / 2 - 6, r: p.x + w / 2 + 6, t: p.y - h / 2 - 4, b: p.y + h / 2 + 4 };
    const hit = placed.some((q) => r.l < q.r && r.r > q.l && r.t < q.b && r.b > q.t);
    if (hit) el.style.display = "none"; else placed.push(r);
  }
}

// ---------- pasirinkimas, kelias ir kortelė ----------
function select(id, fromSearch) {
  if (!id) {
    state.selected = null;
    state.neighbors = new Set();
    state.path.clear();
    state.pathEdges.clear();
    buildTrailMarks();
    renderTrailBar();
    invalidateGlow();
    $("card").classList.remove("open", "peek");
    updateUrl();
    renderer.refresh({ skipIndexation: true });
    return;
  }
  const prev = state.selected;
  // Žaidime judėti galima tik tikrais, matomais ryšiais – jokių šuolių
  if (inGame() && prev && id !== prev && !legalMove(prev, id)) return;
  // Iš kur atėjome: jei ankstesnis mazgas su šiuo susijęs, tai žingsnis per sąsają
  const from = prev && prev !== id && graph.hasEdge(prev, id) ? prev : null;
  if (!state.path.has(id)) {
    // Žingsnis per sąsają – kelias auga (ir šakojasi); šuolis (paieška, nuoroda) – kelias naujas.
    // Tinka ir kortelėje išvardyti paminėjimai, kurių esminiame sluoksnyje nematyti.
    if (from) {
      state.path.set(id, from);
      state.pathEdges.add(ekey(from, id));
    } else {
      state.path.clear();
      state.pathEdges.clear();
      state.path.set(id, null);
    }
  }
  const stepped = inGame() && prev && id !== prev;
  state.selected = id;
  state.pickedAt = Date.now();
  state.neighbors = new Set();
  graph.forEachEdge(id, (e, a, s, t) => {
    if (edgeVisible(a) || state.pathEdges.has(ekey(s, t))) state.neighbors.add(s === id ? t : s);
  });
  updateUrl();
  invalidateGlow();
  buildTrailMarks();
  renderTrailBar();
  renderCard(id);
  focusNode(id, fromSearch, from);
  renderer.refresh({ skipIndexation: true });
  if (stepped) gameMove(id);
}

// Kamera į mazgą. Žengiant per sąsają kadre paliekam ir ankstesnį mazgą – kad matytųsi,
// iš kur atėjome; telefone kortelė uždengia apačią, todėl mazgą keliam į laisvą viršų.
function focusNode(id, fromSearch, from) {
  const cam = renderer.getCamera();
  const p = renderer.getNodeDisplayData(id);
  if (!p || !cam.ratio) return;
  const mobile = innerWidth <= 900;
  const sheet = mobile && $("card").classList.contains("open") ? $("card").offsetHeight : 0;
  let ratio = fromSearch ? 0.25 : Math.min(cam.ratio, 0.6);
  let x = p.x, y = p.y;
  const q = from ? renderer.getNodeDisplayData(from) : null;
  if (q) {
    x = p.x * 0.7 + q.x * 0.3;
    y = p.y * 0.7 + q.y * 0.3;
    const { width, height } = renderer.getDimensions();
    const a = renderer.viewportToFramedGraph({ x: 0, y: 0 });
    const b = renderer.viewportToFramedGraph({ x: width, y: height });
    // Kiek kadro skiriam nueitai briaunai (telefone mažiau – apačią dengia kortelė)
    const fit = mobile ? 0.42 : 0.6;
    const need = cam.ratio * Math.max(
      Math.abs(p.x - q.x) / (Math.abs(b.x - a.x) * fit),
      Math.abs(p.y - q.y) / (Math.abs(b.y - a.y) * fit));
    if (need > ratio) ratio = Math.min(need, 1.2);   // per toli neišzuminam
  }
  if (sheet) {
    const a = renderer.viewportToFramedGraph({ x: 0, y: 0 });
    const b = renderer.viewportToFramedGraph({ x: 0, y: sheet / 2 });
    y += (b.y - a.y) * (ratio / cam.ratio);
  }
  cam.animate({ x, y, ratio }, { duration: 600 });
}

// Kelio žymos ant žemėlapio: žiedas apie aplankytą mazgą ir žingsnio numeris
function buildTrailMarks() {
  $("trail").innerHTML = [...state.path.keys()].map((id) =>
    `<div class="tmark" data-id="${esc(id)}"><i>${pathDepth(id) + 1}</i></div>`).join("");
}
function placeTrailMarks() {
  const box = $("trail");
  for (const el of box.children) {
    const d = renderer.getNodeDisplayData(el.dataset.id);
    if (!d) { el.style.display = "none"; continue; }
    const v = renderer.framedGraphToViewport(d);
    const r = renderer.scaleSize(d.size) + 7;
    el.style.display = "";
    el.style.left = v.x + "px";
    el.style.top = v.y + "px";
    el.style.width = el.style.height = r * 2 + "px";
    el.classList.toggle("cur", el.dataset.id === state.selected);
  }
}
function renderTrailBar() {
  const bar = $("trailbar");
  // Žaidimo skaitiklis viršuje – telefone šoninį skydą uždengia kortelė
  const chip = $("g-chip"), g = state.game;
  chip.hidden = !g;
  $("g-hint-bar").hidden = !inGame() || (g && g.lvl === 10);
  $("g-hint-bar").title = g ? T("g_hint") + " (−100)" : "";
  if (g) {
    const used = g.moves.length - 1, left = g.budget - used;
    const d = g.hints && gdist ? gdist.get(state.selected) : undefined;
    chip.innerHTML = `🛸 <b>${used}</b>/${g.budget}` +
      (g.hints ? ` · ${d === undefined ? "⊘" : d + " →"}` : "");
    chip.classList.toggle("warn", left <= 1);
  }
  bar.classList.toggle("on", state.path.size > 0);
  if (!state.path.size) { $("crumbs").innerHTML = ""; return; }
  const crumbs = pathToRoot(state.selected);
  $("crumbs").innerHTML = crumbs.map((id, i) => {
    const n = graph.getNodeAttribute(id, "raw");
    return (i ? `<span class="sep">›</span>` : "") +
      `<button class="crumb ${id === state.selected ? "on" : ""}" data-id="${esc(id)}" title="${esc(nm(n))}">` +
      `<span class="i">${i + 1}</span><span class="t">${esc(nm(n))}</span></button>`;
  }).join("");
  bar.querySelector(".hint").style.display = state.path.size > 1 ? "none" : "";
  const box = $("crumbs"), last = box.lastElementChild;
  // Ilgą kelią paslenkam į dabartinį žingsnį; trumpą paliekam kaip yra
  if (last && box.scrollWidth > box.clientWidth + 4) last.scrollIntoView({ block: "nearest", inline: "end" });
}

async function renderCard(id) {
  const n = graph.getNodeAttribute(id, "raw");
  const kind = kindOf(n);
  const t = TYPES[kind];
  $("c-badge").textContent = L(t);
  $("c-badge").style.cssText = `background:${hexA(t.color, .15)};color:${t.color}`;
  $("c-title").textContent = nm(n);
  const ST = { confirmed: "#4fd1a5", debunked: "#ff6b6b", disputed: "#f5d76e" };
  const st = $("c-status");
  if (n.st && ST[n.st]) {
    st.textContent = T("st_" + n.st);
    st.style.cssText = `background:${hexA(ST[n.st], .15)};color:${ST[n.st]};margin-left:6px`;
    st.hidden = false;
  } else st.hidden = true;
  // Lietuviškai – po pavadinimu originalus (anglų k.) pavadinimas
  const alt = LANG === "lt" && nm(n) !== n.t ? n.t : "";
  $("c-lt").textContent = alt && alt.toLowerCase() !== nm(n).toLowerCase() ? alt : "";
  const meta = [];
  if (sdOf(n)) meta.push(esc(sdOf(n)));
  if (n.d) meta.push(`<b>${esc(n.d.replace(/-00/g, "").replace(/^0+/, ""))}</b>`);
  if (n.rg) meta.push(T("region") + ": <b>" + n.rg.map(esc).join(", ") + "</b>");
  $("c-meta").innerHTML = meta.join(" · ");

  const body = [];
  if (n.th && n.th.length) {
    body.push(`<div class="chips" style="margin-bottom:14px">${n.th.map((k) =>
      `<span class="chip on"><span class="dot" style="background:${THEMES[k].color}"></span>${esc(L(THEMES[k]))}</span>`).join("")}</div>`);
  }
  body.push(`<div id="c-summary"></div>`);
  const wiki = n.u || `https://en.wikipedia.org/wiki/${encodeURIComponent(n.t.replace(/ /g, "_"))}`;
  body.push(`<div class="links">` +
    `<button class="share" title="${esc(state.path.size > 1 ? T("share_path") : T("share"))}">` +
    `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ` +
    `stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/>` +
    `<circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>${esc(T("share"))}</button>` +
    (n.lw ? `<a href="https://lt.wikipedia.org/wiki/${encodeURIComponent(n.lw.replace(/ /g, "_"))}" target="_blank" rel="noopener">${T("wiki")} (LT) ↗</a>` : "") +
    `<a href="${esc(wiki)}" target="_blank" rel="noopener">${T("wiki")}${n.lw ? " (EN)" : ""} ↗</a>` +
    (n.id.startsWith("Q") ? `<a href="https://www.wikidata.org/wiki/${esc(n.id)}" target="_blank" rel="noopener">Wikidata ↗</a>` : "") +
    (n.c ? `<a href="https://www.openstreetmap.org/?mlat=${n.c[0]}&mlon=${n.c[1]}#map=6/${n.c[0]}/${n.c[1]}" target="_blank" rel="noopener">${T("onmap")} ↗</a>` : "") +
    `</div>`);

  // Ryšiai: 1) su vaidmeniu (peržiūrėti), 2) kiti esminiai – pagal tipą, 3) likę paminėjimai
  const byRole = {}, byType = {}, extra = [];
  graph.forEachEdge(id, (e, a, s, tg) => {
    const o = s === id ? tg : s;
    if (inGame() && !legalMove(id, o)) return;   // žaidime rodom tik tai, kuo galima eiti
    const c = { id: o, n: graph.getNodeAttribute(o, "raw"), w: a.weight, lead: a.lead };
    // Vaidmuo priklauso jį priskyrusiai teorijai (a.src): jos kortelėje – "Kaltinami",
    // kitos pusės kortelėje – "Kaltinamas teorijose"
    if (a.role) (byRole[a.role + (a.src === id ? ">" : "<")] ||= []).push(c);
    else if (a.core) (byType[kindOf(c.n)] ||= []).push(c);
    else extra.push(c);
  });
  const isHubCard = n.k === "theory" || n.k === "related";
  const row = (c, color) => `<div class="conn" data-id="${esc(c.id)}"><span class="dot" style="background:${color || TYPES[kindOf(c.n)].color}"></span>` +
    `<span class="t" title="${esc(nm(c.n))}">${esc(nm(c.n))}</span>${c.lead ? `<span class="lead" title="${esc(T("lead"))}">★</span>` : ""}` +
    `<span class="w"><i style="width:${Math.max(8, Math.min(100, c.w / data.maxW * 250))}%"></i></span></div>`;
  const group = (title, list, color, lim = 12, collapsed = false) => {
    list.sort((a, b) => b.w - a.w);
    const shown = collapsed ? 0 : lim;
    return `<div class="group"><h3>${color ? `<span class="dot" style="width:8px;height:8px;border-radius:50%;background:${color}"></span>` : ""}` +
      `${esc(title)} <span class="n">${list.length}</span></h3>` + list.slice(0, shown).map((c) => row(c)).join("") +
      (list.length > shown ? `<div class="rest" hidden>${list.slice(shown).map((c) => row(c)).join("")}</div>` +
        `<button class="showall">${T(collapsed ? "show" : "show_all")} (${list.length})</button>` : "") + `</div>`;
  };
  for (const r of ROLE_ORDER) {
    if (byRole[r + ">"]) body.push(group(T("roles")[r][0], byRole[r + ">"], ROLES[r]));
    if (byRole[r + "<"]) body.push(group(T("roles")[r][1], byRole[r + "<"], ROLES[r]));
  }
  const order = ["theory", "related", "person", "organization", "event", "place", "work", "concept", "media"];
  for (const k of order) if (byType[k]) body.push(group(L(TYPES[k]), byType[k]));
  if (extra.length) body.push(group(Object.keys(byRole).length || Object.keys(byType).length ?
    T("other_mentions") : T("mentions"), extra, null, 12, Object.keys(byRole).length + Object.keys(byType).length > 0));
  const groups = { ...byRole, ...byType, ...(extra.length ? { x: extra } : {}) };
  if (!Object.keys(groups).length) body.push(`<p style="color:var(--muted)">${T("no_links")}</p>`);
  $("c-body").innerHTML = body.join("");
  $("c-body").scrollTop = 0;
  $("card").classList.add("open");

  const box = $("c-summary");
  // Kurios kalbos santrauka mazgui yra – pasako grafo žymos (se / sl), todėl užtenka
  // parsisiųsti vieną santraukų failą; antrasis kraunamas tik paprašius originalo.
  const has = { en: !!n.se, lt: !!n.sl };
  const first = LANG === "lt" ? (has.lt ? "lt" : has.en ? "en" : null) : (has.en ? "en" : has.lt ? "lt" : null);
  if (!first) {
    box.innerHTML = n.n ? `<p style="color:var(--muted)">${T("mentioned", n.n)}</p>` : "";
    return;
  }
  // Lietuviškai: vertimas arba LT Vikipedijos įžanga + mygtukas pereiti prie angliško originalo
  const show = async (v) => {
    if (!SUM[v]) box.innerHTML = `<p style="color:var(--faint)">${T("loading_short")}</p>`;
    const text = (await loadSummaries(v))[id];
    if (state.selected !== id) return;
    if (!text) { box.innerHTML = ""; return; }
    const note = v === "lt" ? (n.ltm ? T("note_ai") : "") : (LANG === "lt" && !has.lt ? T("note_en") : "");
    box.innerHTML = `<div class="summary short" lang="${v}">${esc(text)}</div>` +
      (note ? `<p class="sumnote">${esc(note)}</p>` : "");
    const el = box.firstChild;
    if (el.scrollHeight > el.clientHeight + 4) {
      const b = document.createElement("button");
      b.className = "more"; b.textContent = T("read_more");
      b.onclick = () => { el.classList.remove("short"); b.remove(); };
      box.appendChild(b);
    } else el.classList.remove("short");
    const other = v === "lt" ? "en" : "lt";
    if (LANG === "lt" && has[other]) {
      const b = document.createElement("button");
      b.className = "more"; b.textContent = v === "lt" ? T("show_orig") : T("show_tr");
      b.onclick = () => show(other);
      box.appendChild(b);
    }
  };
  show(first);
}


// Vienas klausytojas visam žaidimo skydui – turinys perpiešiamas po kiekvieno žingsnio
$("game").addEventListener("click", (e) => {
  const t = e.target.closest("[data-go], [data-lvl], button");
  if (!t) return;
  const go = t.dataset.go;
  if (go === "x") return gameClose();
  if (go === "r") return gameOpen(0);
  if (go) return gameOpen(+go);
  const row = t.closest("[data-lvl]");
  if (row) return gameOpen(+row.dataset.lvl);
  const g = state.game;
  switch (t.id) {
    case "g-hint-btn": return gameHint();
    case "g-back": {
      const par = state.path.get(state.selected);
      if (par) select(par, false);
      return;
    }
    case "g-quit": return gameOpen(undefined);
    case "g-menu": return gameOpen(undefined);
    case "g-retry": return gameOpen(g.lvl, g.lvl ? null : { from: g.start });
    case "g-next": return gameOpen(g.lvl + 1);
    case "g-save": {
      const db = gameStore();
      db.nick = ($("g-nick").value || "").trim().slice(0, 20);
      if (!db.nick) return $("g-nick").focus();
      gamePut(db);
      t.disabled = true;
      t.textContent = T("g_saved");
      if (GAME_API && g && g.done === "won" && g.lvl) {
        boardSend(g, db.nick).then((res) => {
          if (res && res.ok) { t.textContent = T("g_rank", res.rank); boardLvl = null; }
        }).catch(() => { /* be tinklo lieka vietinis rezultatas */ });
      }
      return;
    }
    case "g-share": {
      const db = gameStore();
      if (!db.nick) { db.nick = ($("g-nick").value || "").trim().slice(0, 20); gamePut(db); }
      const url = gameShareUrl();
      navigator.clipboard.writeText(url).then(() => { t.textContent = T("share_done"); }, () => {
        const inp = document.createElement("input");
        inp.readOnly = true; inp.value = url; t.parentElement.appendChild(inp); inp.select();
      });
      return;
    }
  }
});

// ---------- dalinimasis ----------
// Nuoroda veda į mazgo puslapį site/t/, kurio meta žymose – to mazgo pavadinimas ir
// santrauka (pokalbių programėlės JavaScript nevykdo, tad mato tik jas). Iš ten iškart
// permetama į žemėlapį; jei nueitas kelias ilgesnis nei vienas žingsnis, jis keliauja kartu.
async function share(btn) {
  const id = state.selected;
  if (!id) return;
  const url = nodeUrl(id);
  const title = nm(graph.getNodeAttribute(id, "raw"));
  if (navigator.share && innerWidth <= 900) {
    try { await navigator.share({ title, text: title, url }); return; }
    catch (e) { if (e && e.name === "AbortError") return; }   // atšaukė – nieko nedarom
  }
  try {
    await navigator.clipboard.writeText(url);
    const old = btn.innerHTML;
    btn.classList.add("ok");
    btn.textContent = T("share_done");
    setTimeout(() => { btn.classList.remove("ok"); btn.innerHTML = old; }, 2200);
  } catch (e) {
    // Be leidimo rašyti į iškarpinę – parodom nuorodą, kad būtų galima nusikopijuoti ranka
    const inp = document.createElement("input");
    inp.className = "share";
    inp.readOnly = true;
    inp.value = url;
    btn.parentElement.appendChild(inp);
    inp.focus();
    inp.select();
  }
}
$("card-close").onclick = () => select(null);

// ---------- valdikliai ----------
function renderChips() {
  const tc = {}, kc = {};
  for (const n of data.nodes) {
    kc[kindOf(n)] = (kc[kindOf(n)] || 0) + 1;
    if (n.k === "theory") for (const t of themesOf(n)) tc[t] = (tc[t] || 0) + 1;
  }
  $("themes").innerHTML = Object.entries(THEMES).sort((a, b) => (tc[b[0]] || 0) - (tc[a[0]] || 0)).map(([k, v]) =>
    `<button class="chip ${state.themes.has(k) ? "on" : ""}" data-k="${k}"><span class="dot" style="background:${v.color}"></span>${esc(L(v))} <span class="n">${tc[k] || 0}</span></button>`).join("");
  $("types").innerHTML = Object.entries(TYPES).map(([k, v]) =>
    `<button class="chip ${state.types.has(k) ? "on" : ""}" data-k="${k}"><span class="dot" style="background:${v.color}"></span>${esc(L(v))} <span class="n">${kc[k] || 0}</span></button>`).join("");
}

function buildControls() {
  renderChips();

  $("themes").onclick = (e) => {
    const c = e.target.closest(".chip"); if (!c) return;
    toggle(state.themes, c.dataset.k, c);
  };
  $("types").onclick = (e) => {
    const c = e.target.closest(".chip"); if (!c) return;
    toggle(state.types, c.dataset.k, c);
    if (c.dataset.k === "media" && state.types.has("media")) { state.generic = true; $("generic").checked = true; }
    refresh();
  };
  $("themes-all").onclick = () => {
    const all = state.themes.size === Object.keys(THEMES).length;
    state.themes = new Set(all ? [] : Object.keys(THEMES));
    document.querySelectorAll("#themes .chip").forEach((c) => c.classList.toggle("on", !all));
    refresh();
  };
  $("generic").onchange = (e) => { state.generic = e.target.checked; refresh(); };
  const setLang = (l) => {
    if (l === LANG) return;
    LANG = l;
    try { localStorage.setItem("cm-lang", l); } catch (e) { /* ignoruojam */ }
    updateUrl();          // kalba – ir adrese, kad nuoroda atsidarytų ta pačia kalba
    applyStatic();
    graph.forEachNode((id, a) => graph.setNodeAttribute(id, "label", nm(a.raw)));
    renderChips();
    renderLegend();
    buildClusterLabels();
    if (state.selected) renderCard(state.selected);
    renderTrailBar();
    if ($("game").classList.contains("on")) renderGame();
    if (aboutOpen()) renderAbout();
    refresh();
  };
  $("lang").onclick = (e) => {
    e.stopPropagation();   // telefone antraštės paspaudimas atidaro / uždaro skydą
    const b = e.target.closest("button"); if (b) setLang(b.dataset.l);
  };
  $("alllinks").onchange = (e) => {
    state.layer = e.target.checked ? "all" : "core";
    if (state.selected) select(state.selected, false); else refresh();
  };
  $("deg").oninput = (e) => { state.minDeg = +e.target.value; $("deg-v").textContent = e.target.value; refresh(); };
  $("color-by").onchange = (e) => { state.colorBy = e.target.value; renderLegend(); refresh(); };
  // Mastelio riba dabar gili, tad vienas mygtuko paspaudimas keičia mastelį stambiau
  $("z-in").onclick = () => renderer.getCamera().animatedZoom({ duration: 260, factor: 1.9 });
  $("z-out").onclick = () => renderer.getCamera().animatedUnzoom({ duration: 260, factor: 1.9 });
  $("z-reset").onclick = () => renderer.getCamera().animatedReset({ duration: 400 });
  $("side-head").onclick = () => { if (innerWidth <= 900) $("side").classList.toggle("open"); };
  $("crumbs").onclick = (e) => {
    const c = e.target.closest(".crumb");
    if (!c || c.dataset.id === state.selected) return;
    // Žaidime grįžti galima tik per gretimą mazgą – kelio juosta nėra teleportas
    if (inGame() && !legalMove(state.selected, c.dataset.id)) return;
    select(c.dataset.id, false);
  };
  $("trail-end").onclick = () => (state.game ? gameOpen(undefined) : select(null));
  $("g-hint-bar").onclick = () => gameHint();
  $("card-grab").onclick = () => $("card").classList.toggle("peek");
  $("about-btn").onclick = (e) => { e.stopPropagation(); openAbout(); };
  $("about-close").onclick = closeAbout;
  $("about").onclick = (e) => { if (!e.target.closest(".sheet")) closeAbout(); };
  setupSearch();
  renderLegend();
}

function toggle(set, k, el) {
  if (set.has(k)) set.delete(k); else set.add(k);
  el.classList.toggle("on", set.has(k));
  refresh();
}

function refresh() {
  zoomApplied = sizeDamp();
  invalidateGlow();
  renderer.refresh({ skipIndexation: true });
  updateStats();
}

function updateStats() {
  let nv = 0, nt = 0;
  const vis = new Set();
  graph.forEachNode((id, a) => { if (visible(a.raw)) { nv++; vis.add(id); if (a.raw.k === "theory") nt++; } });
  let ne = 0;
  graph.forEachEdge((e, a, s, t) => { if (vis.has(s) && vis.has(t) && edgeVisible(a)) ne++; });
  $("stats").innerHTML = T("stats", fmt(nt), fmt(nv), fmt(ne), fmt(graph.order), fmt(graph.size));
}

function renderLegend() {
  let entries;
  if (state.colorBy === "type") entries = Object.values(TYPES).map((v) => [L(v), v.color]);
  else if (state.colorBy === "theme") entries = Object.values(THEMES).map((v) => [L(v), v.color]);
  else entries = [[T("legend_cluster"), "#e8b14a"]];
  $("legend").innerHTML = entries.map(([l, c]) => `<span><span class="dot" style="background:${c}"></span>${esc(l)}</span>`).join("");
}

// ---------- „Apie" langas ----------
// Skaičiai imami iš pačių duomenų, kad tekste jie nepasentų perskaičiavus žemėlapį.
function roleRows() {
  const names = T("roles"), desc = T("role_desc");
  return Object.keys(desc).map((k) => `<li><b>${esc(names[k][0])}</b> — ${esc(desc[k])}</li>`).join("");
}

function aboutStats() {
  const st = { confirmed: 0, debunked: 0, disputed: 0 };
  let th = 0, ent = 0;
  for (const n of data.nodes) { if (n.k === "theory") { th++; if (n.st in st) st[n.st]++; } else ent++; }
  let core = 0, roles = 0;
  for (const [, , , , c, role] of data.edges) { if (c === undefined || c) core++; if (role) roles++; }
  return {
    th: fmt(th), ent: fmt(ent), nodes: fmt(data.nodes.length), edges: fmt(data.edges.length),
    core: fmt(core), extra: fmt(data.edges.length - core), roles: fmt(roles),
    themes: fmt(data.themes.length), clusters: fmt(data.clusters.length),
    // neformatuoti skaičiai – lietuviškiems linksniams (ltN)
    thN: th, entN: ent, nodesN: data.nodes.length, edgesN: data.edges.length, rolesN: roles,
    themesN: data.themes.length, clustersN: data.clusters.length,
    confirmed: fmt(st.confirmed), debunked: fmt(st.debunked), disputed: fmt(st.disputed),
    built: new Date(data.built).toLocaleDateString(LANG, { year: "numeric", month: "long", day: "numeric" }),
  };
}

// ---------- žaidimas „Kelias pas anunakius“ ----------
// Žaidimo grafas = tas pats, ką žaidėjas mato su numatytais filtrais (esminiai ryšiai,
// be bendrinių mazgų ir žiniasklaidos). Tie patys skaičiavimai kaip scraper/11_levels.py,
// todėl „trumpiausias kelias“ sutampa su tuo, ką realiai galima nueiti.
const GAME_KEY = "cm-game";
// Bendros lentelės adresas (Cloudflare Worker). Tuščias – žaidimas veikia be jos,
// rezultatai lieka tik naršyklėje.
const GAME_API = "";
let levels = null, gameAdj = null, gdist = null, board = null, boardLvl = null;

// Rezultatą tikrina serveris: jis pats pereina kelią briauna po briaunos ir perskaičiuoja
// taškus, tad atsiųsti savo skaičiaus neįmanoma.
async function boardSend(g, nick) {
  if (!GAME_API || !g.lvl) return null;
  const r = await fetch(GAME_API + "/run", {
    method: "POST", headers: { "content-type": "application/json" },
    body: JSON.stringify({ lvl: g.lvl, nick, path: g.moves, hints: g.hints, secs: g.sec }),
  });
  return r.json();
}
async function boardLoad(lvl) {
  if (!GAME_API) return null;
  const r = await fetch(`${GAME_API}/top?lvl=${lvl}&limit=10`);
  const d = await r.json();
  return d.rows || [];
}

const gameOk = (n) => !n.g && kindOf(n) !== "media" && ((n.cdg || 0) >= 2 || n.id === levels.target);
const legalMove = (a, b) => !!(gameAdj && gameAdj.get(a) && gameAdj.get(a).has(b));
const inGame = () => !!(state.game && !state.game.done);

function buildGameGraph() {
  const ok = new Set();
  graph.forEachNode((id, a) => { if (gameOk(a.raw)) ok.add(id); });
  gameAdj = new Map();
  const link = (a, b) => { if (!gameAdj.has(a)) gameAdj.set(a, new Set()); gameAdj.get(a).add(b); };
  graph.forEachEdge((e, a, sr, tg) => {
    if (!a.core || !ok.has(sr) || !ok.has(tg)) return;
    link(sr, tg); link(tg, sr);
  });
  gdist = new Map([[levels.target, 0]]);           // atstumas iki anunakių kiekvienam mazgui
  let wave = [levels.target];
  while (wave.length) {
    const next = [];
    for (const u of wave) for (const v of gameAdj.get(u) || []) {
      if (!gdist.has(v)) { gdist.set(v, gdist.get(u) + 1); next.push(v); }
    }
    wave = next;
  }
}

const gameStore = () => { try { return JSON.parse(localStorage.getItem(GAME_KEY)) || {}; } catch (e) { return {}; } };
const gamePut = (o) => { try { localStorage.setItem(GAME_KEY, JSON.stringify(o)); } catch (e) { /* privatus režimas */ } };

async function gameOpen(lvl, opts) {
  if (!levels) levels = await fetch(SITE_BASE + "data/levels.json").then((r) => r.json());
  if (!gameAdj) buildGameGraph();
  $("side").classList.add("playing");
  $("game").classList.add("on");
  if (innerWidth <= 900) $("side").classList.add("open");
  if (lvl === undefined) { state.game = null; renderGame(); return; }   // meniu
  // Filtrai žaidimo metu – numatytieji, kad visiems grafas būtų vienodas
  state.themes = new Set(Object.keys(THEMES));
  state.types = new Set(Object.keys(TYPES).filter((t) => t !== "media"));
  state.generic = false; state.minDeg = 2; state.layer = "core";
  $("generic").checked = false; $("alllinks").checked = false; $("deg").value = 2; $("deg-v").textContent = 2;
  renderChips();

  const L = lvl ? levels.levels.find((x) => x.lvl === lvl) : null;
  const start = (opts && opts.from) || (L && L.start) || randomStart();
  const dist = gdist.get(start);
  state.game = {
    lvl: lvl || 0, start, dist,
    budget: L ? L.budget : dist + 3,
    moves: [start], hints: 0, t0: Date.now(), done: null,
    challenge: opts && opts.challenge,
  };
  state.path.clear(); state.pathEdges.clear();
  state.selected = null;
  select(start, true);
  renderGame();
}

function randomStart() {
  const pool = [];
  gdist.forEach((d, id) => {
    if (d < 3) return;
    const n = graph.getNodeAttribute(id, "raw");
    if (n.k === "theory" && (n.lt || LANG === "en")) pool.push(id);
  });
  return pool[Math.floor(Math.random() * pool.length)] || levels.levels[0].start;
}

function gameClose() {
  state.game = null;
  $("side").classList.remove("playing");
  $("game").classList.remove("on");
  $("game").innerHTML = "";
  select(null);
}

function gameMove(id) {
  const g = state.game;
  g.moves.push(id);
  renderTrailBar();
  if (id === levels.target) gameEnd(true);
  else if (g.moves.length - 1 >= g.budget) gameEnd(false);
  else renderGame();
}

function gameEnd(won) {
  const g = state.game;
  g.done = won ? "won" : "lost";
  g.used = g.moves.length - 1;
  g.sec = Math.max(1, Math.round((Date.now() - g.t0) / 1000));
  g.score = won ? Math.max(100, 1000 - 120 * (g.used - g.dist) - 100 * g.hints) : 0;
  if (innerWidth <= 900) {          // telefone parodom rezultatą, o ne kortelę
    $("card").classList.remove("open", "peek");
    $("side").classList.add("open");
  }
  if (won && g.lvl) {
    const db = gameStore();
    db.best = db.best || {};
    const old = db.best[g.lvl];
    if (!old || g.score > old.score) {
      db.best[g.lvl] = { score: g.score, moves: g.used, hints: g.hints, sec: g.sec, path: g.moves, at: Date.now() };
      gamePut(db);
    }
  }
  renderGame();
}

function gameHint() {
  if (!inGame()) return;
  state.game.hints++;
  renderGame();
  renderTrailBar();
}

const gameName = (id) => nm(graph.getNodeAttribute(id, "raw"));

function gameShareUrl() {
  const g = state.game, db = gameStore();
  const q = new URLSearchParams({ lang: LANG, game: g.lvl || "r" });
  if (!g.lvl) q.set("from", g.start);
  if (db.nick) q.set("n", db.nick);
  q.set("m", g.used);
  return `${SITE_BASE}?${q}`;
}

// Bendra lentelė: kraunam tinginiu būdu ir perpiešiam, kai atkeliauja
function boardHtml(want) {
  if (!GAME_API) return "";
  if (boardLvl !== want) {
    boardLvl = want; board = "loading";
    boardLoad(want).then((rows) => { board = rows || []; renderGame(); })
      .catch(() => { board = []; renderGame(); });
  }
  if (board === "loading") return `<div class="goal">${esc(T("g_loading"))}</div>`;
  if (!board || !board.length) return "";
  return `<div id="g-board" style="margin-top:14px"><div class="label" style="margin-top:0">${esc(T("g_world"))}</div><table>` +
    board.map((r, i) => `<tr><td>${i + 1}</td><td class="n">${esc(r.nick)}</td>` +
      `<td>${r.score} ${esc(T("g_pts"))}</td></tr>`).join("") + `</table></div>`;
}

function renderGame() {
  const box = $("game"), g = state.game, db = gameStore();
  if (!g) {                                   // ---- meniu ----
    const best = db.best || {};
    const total = Object.values(best).reduce((a, b) => a + b.score, 0);
    box.innerHTML = `<div class="lvl"><b>${esc(T("g_title"))}</b></div>` +
      `<div class="goal">${esc(T("g_rules"))}</div>` +
      `<div id="g-board"><table>` + levels.levels.map((L) => {
        const b = best[L.lvl];
        return `<tr class="${b ? "done" : ""}" data-lvl="${L.lvl}" style="cursor:pointer">` +
          `<td>${L.lvl}</td><td class="n">${esc(gameName(L.start))}</td>` +
          `<td>${b ? b.score + " " + esc(T("g_pts")) : esc(T("g_none"))}</td></tr>`;
      }).join("") + `</table></div>` +
      `<div class="goal" style="margin:12px 0 10px">${esc(T("g_total"))}: <b>${total} ${esc(T("g_pts"))}</b></div>` +
      `<div class="btns"><button class="gb main" data-go="1">${esc(T("g_start"))}</button>` +
      `<button class="gb" data-go="r">${esc(T("g_random"))}</button>` +
      `<button class="gb" data-go="x">${esc(T("g_close"))}</button></div>` +
      boardHtml("all");
    return;
  }
  const used = g.moves.length - 1, left = g.budget - used;
  const cur = g.moves[g.moves.length - 1];
  const d = gdist.has(cur) ? gdist.get(cur) : null;
  const steps = g.moves.slice(-4).map((id, i, arr) =>
    `<span class="${i === arr.length - 1 ? "now" : ""}">${esc(gameName(id))}</span>`).join("");
  const meter = (v, k, cls) => `<div class="${cls || ""}"><div class="v">${v}</div><div class="k">${esc(k)}</div></div>`;
  let html = `<div class="lvl"><b>${g.lvl ? g.lvl + " " + esc(T("g_lvl")) : esc(T("g_random"))}</b>` +
    (g.lvl ? `<span class="of">${esc(T("g_of", levels.levels.length))}</span>` : "") + `</div>` +
    `<div class="goal">${T("g_goal", esc(gameName(g.start)))}</div>`;
  if (g.challenge) html += `<div id="g-hint">${T("g_challenge", esc(g.challenge.n), esc(g.challenge.m))}</div>`;
  html += `<div id="g-meters">` + meter(used, T("g_moves")) +
    meter(left, T("g_budget"), left <= 0 ? "bad" : left <= 1 ? "warn" : "") +
    meter(g.dist, T("g_best")) + `</div>`;
  html += `<div id="g-steps">${steps}</div>`;

  if (!g.done) {
    html += `<div class="btns">` +
      `<button class="gb" id="g-hint-btn"${g.lvl === 10 ? " disabled" : ""}>${esc(T("g_hint"))} (−100)</button>` +
      `<button class="gb" id="g-back"${g.moves.length < 2 ? " disabled" : ""}>${esc(T("g_back"))}</button>` +
      `<button class="gb" id="g-quit">${esc(T("g_give"))}</button></div>`;
    if (g.hints) {
      html += d === undefined || d === null ? `<div id="g-hint" class="warn">${esc(T("g_hint_dead"))}</div>`
        : `<div id="g-hint">${T("g_hint_txt", d)}</div>`;
    }
  } else {
    const won = g.done === "won";
    html += `<div id="g-result"><h3>${esc(T(won ? "g_won" : "g_lost"))}</h3>` +
      (won ? `<div class="score">${g.score} <span style="font-size:14px;color:var(--muted)">${esc(T("g_pts"))}</span></div>` +
        `<div class="det">${esc(T("g_det", g.used, g.dist, g.hints, g.sec))}` +
        (g.used === g.dist ? ` · <b style="color:#4fd1a5">${esc(T("g_perfect"))}</b>` : "") + `</div>` +
        `<input id="g-nick" maxlength="20" placeholder="${esc(T("g_nick"))}" value="${esc(db.nick || "")}">` +
        `<div class="btns"><button class="gb main" id="g-save">${esc(T("g_save"))}</button>` +
        `<button class="gb" id="g-share">${esc(T("g_share"))}</button></div>`
        : `<div class="det">${esc(T("g_lost_txt", g.budget))}</div>`) +
      `<div class="btns" style="margin-top:8px">` +
      `<button class="gb" id="g-retry">${esc(T("g_retry"))}</button>` +
      (g.lvl && g.lvl < levels.levels.length ? `<button class="gb main" id="g-next">${esc(T("g_next"))}</button>` : "") +
      `<button class="gb" id="g-menu">${esc(T("g_board"))}</button></div></div>` +
      (g.lvl ? boardHtml(g.lvl) : "");
  }
  box.innerHTML = html;
}

// ---------- paieška ----------
// Paieškai nurašom diakritiką: „samokslo" turi rasti „sąmokslo", „zydu" – „žydų"
const fold = (s) => String(s).normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();

function setupSearch() {
  const idx = data.nodes.map((n) => ({ id: n.id, t: fold(n.t), l: fold(n.lt || ""), d: fold(n.sd || ""), n }));
  const input = $("search"), box = $("results");
  let hits = [], cur = -1;
  const show = () => {
    box.innerHTML = hits.map((h, i) => `<div data-id="${esc(h.id)}" class="${i === cur ? "on" : ""}">` +
      `<span class="dot" style="width:8px;height:8px;border-radius:50%;background:${TYPES[kindOf(h.n)].color}"></span>` +
      `${esc(nm(h.n))}<small>${esc(L(TYPES[kindOf(h.n)]))}</small></div>`).join("");
    box.style.display = hits.length ? "block" : "none";
  };
  input.oninput = () => {
    const q = fold(input.value.trim());
    cur = -1;
    if (q.length < 2) { hits = []; return show(); }
    // Rangas: pavadinimas prasideda užklausa (0) → yra pavadinime (1) → tik aprašyme (2)
    const found = [];
    for (const x of idx) {
      const r = x.t.startsWith(q) || x.l.startsWith(q) ? 0
        : x.t.includes(q) || x.l.includes(q) ? 1
        : x.d.includes(q) ? 2 : -1;
      if (r >= 0) found.push({ x, r });
    }
    hits = found.sort((a, b) => a.r - b.r || ((b.x.n.k === "theory") - (a.x.n.k === "theory")) ||
      ((b.x.n.dg || 0) - (a.x.n.dg || 0))).slice(0, 12).map((f) => f.x);
    show();
  };
  input.onkeydown = (e) => {
    if (e.key === "ArrowDown") { cur = Math.min(hits.length - 1, cur + 1); show(); e.preventDefault(); }
    else if (e.key === "ArrowUp") { cur = Math.max(0, cur - 1); show(); e.preventDefault(); }
    else if (e.key === "Enter" && hits.length) pick(hits[Math.max(0, cur)].id);
    else if (e.key === "Escape") { hits = []; show(); }
  };
  box.onclick = (e) => { const d = e.target.closest("[data-id]"); if (d) pick(d.dataset.id); };
  document.addEventListener("click", (e) => { if (!e.target.closest("#search-wrap")) box.style.display = "none"; });
  function pick(id) {
    hits = []; show(); input.value = "";
    if (innerWidth <= 900) $("side").classList.remove("open");
    select(id, true);
  }
}

// Mazgo puslapio vardas – toks pat, kaip sukuria scraper/10_share_pages.py.
// Paprastai jį paduoda grafas ("sg"); skaičiuojam patys tik tada, jei pasitaikytų senas graph.json.
function slugOf(n) {
  if (n.sg) return n.sg;
  const s = fold(n.t).replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "").slice(0, 60).replace(/-+$/, "");
  return s ? s + "-" + n.id : n.id;
}

// Mazgo adresas: puslapis su to mazgo meta žymomis + kalba + nueitas kelias
function nodeUrl(id) {
  const q = new URLSearchParams({ lang: LANG });
  const p = pathToRoot(id);
  if (p.length > 1) q.set("p", p.join(","));
  return `${SITE_BASE}t/${slugOf(graph.getNodeAttribute(id, "raw"))}.html?${q}`;
}

// Adreso juostoje laikom tą patį adresą, kurį duoda „Dalintis“ – kad nukopijuotas
// iš juostos linkas pokalbyje irgi parodytų teorijos pavadinimą, o ne bendrą antraštę.
function updateUrl() {
  if (state.game) return;      // žaidimo metu adrese lieka iššūkio nuoroda
  history.replaceState(null, "", state.selected ? nodeUrl(state.selected)
    : SITE_BASE + "?lang=" + LANG);
}
function restorePath(ids) {
  state.path.clear();
  state.pathEdges.clear();
  let prev = null;
  for (const id of ids) {
    if (prev && graph.hasEdge(prev, id)) {
      state.path.set(id, prev);
      state.pathEdges.add(ekey(prev, id));
    } else {                       // nutrūkusi grandinė (pasikeitė duomenys) – pradedam iš naujo
      state.path.clear();
      state.pathEdges.clear();
      state.path.set(id, null);
    }
    prev = id;
  }
}
// Iššūkio nuoroda: ?game=<lygis|r>&from=<mazgas>&n=<vardas>&m=<žingsniai>
function readGameLink() {
  const q = new URLSearchParams(location.search);
  const gm = q.get("game");
  if (gm === null) return false;
  const n = q.get("n"), m = q.get("m");
  gameOpen(gm === "r" ? 0 : Math.max(1, Math.min(10, +gm || 1)),
    { from: q.get("from") && graph.hasNode(q.get("from")) ? q.get("from") : null,
      challenge: n && m ? { n: n.slice(0, 20), m: String(m).slice(0, 3) } : null });
  return true;
}

function readHash() {
  if (readGameLink()) return;
  const raw = location.hash.slice(1) || new URLSearchParams(location.search).get("p") || "";
  const ids = decodeURIComponent(raw).split(",").map((x) => x.trim())
    .filter((x) => graph.hasNode(x));
  if (!ids.length) return;
  setTimeout(() => {
    const last = ids[ids.length - 1];
    restorePath(ids);
    state.selected = state.path.get(last) || null;   // kad kamera parodytų ir paskutinį žingsnį
    select(last, ids.length === 1);
  }, 300);
}
addEventListener("keydown", (e) => {
  if (e.key !== "Escape" || document.activeElement === $("search")) return;
  if (aboutOpen()) closeAbout(); else select(null);
});

init().catch((e) => { $("load-msg").textContent = T("load_fail") + e.message; console.error(e); });
</script>
